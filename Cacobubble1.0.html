function createCacoSprite(color, hurt, boss){
  var key = color + (hurt ? '_hurt' : '') + (boss ? '_boss' : '');
  if (cacoSpriteCache[key]) return cacoSpriteCache[key];
  var pixelSize = (R * 2) / 32;
  var pattern = boss ? CACO_BOSS : (hurt ? CACO_HURT : CACO_ALIVE);
  var rows = pattern.length;
  var cols = pattern[0].length;
  var w = Math.ceil(cols * pixelSize) + 8;
  var h = Math.ceil(rows * pixelSize) + 8;
  var off = document.createElement('canvas');
  off.width = w; off.height = h;
  var octx = off.getContext('2d');
  octx.imageSmoothingEnabled = false;
  var pal = cacoPalette(color);
  var startX = (w - cols * pixelSize) / 2;
  var startY = (h - rows * pixelSize) / 2;
  for (var y = 0; y < rows; y++){
    var row = pattern[y];
    for (var x = 0; x < cols; x++){
      var ch = row[x];
      var col = pal[ch];
      if (!col) continue;
      octx.fillStyle = col;
      octx.fillRect(startX + x * pixelSize, startY + y * pixelSize, pixelSize, pixelSize);
    }
  }
  cacoSpriteCache[key] = { canvas: off, w: w, h: h };
  return cacoSpriteCache[key];
}

function createGlowSprite(){
  if (glowSpriteCache) return glowSpriteCache;
  var size = Math.ceil(R * 2.2);
  var off = document.createElement('canvas');
  off.width = size; off.height = size;
  var octx = off.getContext('2d');
  var cx = size / 2, cy = size / 2;
  var maxR = size / 2;
  for (var i = 6; i >= 1; i--){
    var alpha = 0.06 * (7 - i);
    octx.fillStyle = 'rgba(0,255,68,' + alpha + ')';
    octx.beginPath();
    octx.arc(cx, cy, maxR * i / 6, 0, Math.PI * 2);
    octx.fill();
  }
  glowSpriteCache = off;
  return off;
}

  var osc = audioCtx.createOscillator();

function musicTick(){
  if (!audioCtx || !musicOn) return;
  var track = TRACKS[musicTrackIndex];
  var freq = track.lead[noteIndex % track.lead.length];
  if (freq > 0){
    var t0 = audioCtx.currentTime;
    var o1 = audioCtx.createOscillator();
    var g1 = audioCtx.createGain();
    o1.type = track.type;
    o1.frequency.setValueAtTime(freq * 2, t0);
    g1.gain.setValueAtTime(track.vol, t0);
    g1.gain.exponentialRampToValueAtTime(0.001, t0 + 0.18);
    o1.connect(g1); g1.connect(audioCtx.destination);
    o1.start(t0); o1.stop(t0 + 0.18);
  }
  if (noteIndex % 4 === 0){
    var bn = track.bass[(Math.floor(noteIndex / 4)) % track.bass.length];
    var t0b = audioCtx.currentTime;
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(bn, t0b);
    g.gain.setValueAtTime(0.1, t0b);
    g.gain.exponentialRampToValueAtTime(0.001, t0b + 0.5);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t0b); o.stop(t0b + 0.5);
  }
  noteIndex++;
}
function drumTick(){
  if (!audioCtx || !musicOn) return;
  var step = drumStep % 8;
  var t0 = audioCtx.currentTime;
  if (step === 0 || step === 4){
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(80, t0);
    o.frequency.exponentialRampToValueAtTime(30, t0 + 0.1);
    g.gain.setValueAtTime(0.2, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.15);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + 0.15);
  }
  if (step === 2 || step === 6) noise(0.1, 0.1, 3000);
  if (step % 2 === 1) noise(0.03, 0.04, 8000);
  drumStep++;
}
function startMusic(){
  if (musicTimer) return;
  musicStep = 0; drumStep = 0; noteIndex = 0;
  var interval = 60000 / TRACKS[musicTrackIndex].bpm / 4;
  musicTimer = setInterval(musicTick, interval);
  drumTimer = setInterval(drumTick, interval);
}
function stopMusic(){
  if (musicTimer){ clearInterval(musicTimer); musicTimer = null; }

}
function setMusicTrack(idx){

function drawPixelSprite(pattern, cx, cy, pixelSize, palette){
  var rows = pattern.length;
  var cols = pattern[0].length;
  var startX = cx - (cols * pixelSize) / 2;
  var startY = cy - (rows * pixelSize) / 2;
  for (var y = 0; y < rows; y++){
    var row = pattern[y];
    for (var x = 0; x < cols; x++){
      var ch = row[x];
      var col = palette[ch];
      if (!col) continue;
      ctx.fillStyle = col;
      ctx.fillRect(startX + x * pixelSize, startY + y * pixelSize, pixelSize, pixelSize);
    }
  }
}

function cellX(r, c){ return FIELD_X + c * CELL + R + (r % 2 === 0 ? 0 : R); }
function cellY(r){ return FIELD_Y + r * CELL + R; }
function nearestCell(px, py){
  var best = null, bestD = Infinity;
  for (var r = 0; r < ROWS; r++){
    for (var c = 0; c < COLS; c++){
      var x = cellX(r, c), y = cellY(r);
      var d = (x - px) * (x - px) + (y - py) * (y - py);
      if (d < bestD){ bestD = d; best = {r: r, c: c}; }
    }
  }
  return best;
}
function neighbors(r, c){
  var res = [];
  if (r % 2 === 0){
    res.push([r, c-1], [r, c+1]);
    if (r > 0) res.push([r-1, c-1], [r-1, c]);
    if (r < ROWS-1) res.push([r+1, c-1], [r+1, c]);
  } else {
    res.push([r, c-1], [r, c+1]);
    if (r > 0) res.push([r-1, c], [r-1, c+1]);
    if (r < ROWS-1) res.push([r+1, c], [r+1, c+1]);
  }
  return res.filter(function(p){ return p[0] >= 0 && p[0] < ROWS && p[1] >= 0 && p[1] < COLS; });
}
function findGroup(r, c){
  if (!grid[r][c]) return [];
  var color = grid[r][c].color;
  var visited = {};
  var group = [];
  var stack = [[r, c]];
  while (stack.length){
    var pair = stack.pop();
    var cr = pair[0], cc = pair[1];
    var key = cr + ',' + cc;
    if (visited[key]) continue;
    visited[key] = true;
    var b = grid[cr][cc];
    if (!b || b.color !== color) continue;
    group.push(b);
    var nbrs = neighbors(cr, cc);
    for (var i = 0; i < nbrs.length; i++){
      var nr = nbrs[i][0], nc = nbrs[i][1];
      if (!visited[nr + ',' + nc]) stack.push([nr, nc]);
    }
  }
  return group;
}
function findFloating(){
  var connected = {};
  var queue = [];
  for (var c = 0; c < COLS; c++){
    if (grid[0][c]){ connected['0,' + c] = true; queue.push([0, c]); }
  }
  while (queue.length){
    var pair = queue.shift();
    var r = pair[0], cc = pair[1];
    var nbrs = neighbors(r, cc);
    for (var i = 0; i < nbrs.length; i++){
      var nr = nbrs[i][0], nc = nbrs[i][1];
      var key = nr + ',' + nc;
      if (grid[nr][nc] && !connected[key]){
        connected[key] = true; queue.push([nr, nc]);
      }
    }
  }
  var floating = [];
  for (var rr = 0; rr < ROWS; rr++){
    for (var cc2 = 0; cc2 < COLS; cc2++){
      if (grid[rr][cc2] && !connected[rr + ',' + cc2]) floating.push(grid[rr][cc2]);
    }
  }
  return floating;
}
function isGridEmpty(){
  for (var r = 0; r < ROWS; r++)
    for (var c = 0; c < COLS; c++)
      if (grid[r][c]) return false;
  return true;
}
function countCacodemons(){
  var n = 0;
  for (var r = 0; r < ROWS; r++)
    for (var c = 0; c < COLS; c++)
      if (grid[r][c]) n++;
  return n;
}

      ctx.beginPath(); ctx.arc(f.x, f.y, f.size, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  for (var i3 = 0; i3 < titleExplosions.length; i3++){

function levelConfig(lv){

  if (lv <= 6) return { colors: 5, rows: 5, dropEvery: 12 };

  return { colors: 6, rows: 7, dropEvery: 8 };
}
function bonusChance(lv){

}

function updateFlyingOne(f){
  if (!f) return null;
  var steps = 4;
  for (var s = 0; s < steps; s++){
    f.x += f.vx / steps; f.y += f.vy / steps;
    if (f.x - R < FIELD_X){ f.x = FIELD_X + R; f.vx = Math.abs(f.vx); }
    if (f.x + R > FIELD_X + FIELD_W){ f.x = FIELD_X + FIELD_W - R; f.vx = -Math.abs(f.vx); }
    if (f.y - R < FIELD_Y){ f.y = FIELD_Y + R; return 'land'; }
    if (f.y < FIELD_Y + FIELD_H) f.inField = true;
    if (f.inField){
      var cell = nearestCell(f.x, f.y);
      if (cell && grid[cell.r][cell.c]){
        var ex = cellX(cell.r, cell.c), ey = cellY(cell.r);
        var dx = f.x - ex, dy = f.y - ey;
        if (Math.sqrt(dx*dx + dy*dy) < R * 1.85) return 'land';
      }
    }
  }
  return null;
}
function updateFlying(){
  if (flying && updateFlyingOne(flying) === 'land') landBubble(flying, true);
  if (flyingExtra && updateFlyingOne(flyingExtra) === 'land') landBubble(flyingExtra, false);
}
function landBubble(f, isPrimary){
  var cell = nearestCell(f.x, f.y);
  var targetR = -1, targetC = -1;
  if (cell && !grid[cell.r][cell.c]){ targetR = cell.r; targetC = cell.c; }
  else if (cell){
    var bestD = Infinity;
    var nbrs = neighbors(cell.r, cell.c);
    for (var i = 0; i < nbrs.length; i++){
      var nr = nbrs[i][0], nc = nbrs[i][1];
      if (!grid[nr][nc]){
        var d = (cellX(nr, nc) - f.x) * (cellX(nr, nc) - f.x) + (cellY(nr) - f.y) * (cellY(nr) - f.y);
        if (d < bestD){ bestD = d; targetR = nr; targetC = nc; }
      }
    }
    if (targetR < 0){
      outer: for (var r = 0; r < ROWS; r++){
        for (var c = 0; c < COLS; c++){
          if (!grid[r][c]){ targetR = r; targetC = c; break outer; }
        }
      }
    }
  }
  if (targetR >= 0 && targetC >= 0){
    grid[targetR][targetC] = { color: f.color, r: targetR, c: targetC, bonus: f.bonus, hurt: false, boss: false, bossHp: 0, bossMaxHp: 0 };
    Sfx.stick();
    if (f.bonus){
      if (BAD_BONUS_TYPES.indexOf(f.bonus) >= 0) activateBadBonus(targetR, targetC, f.bonus);
      else activateBonus(targetR, targetC, f.bonus);
    } else {
      var group = findGroup(targetR, targetC);
      if (group.length >= 3){
        var bonusesToActivate = [];
        for (var i2 = 0; i2 < group.length; i2++){
          var b = group[i2];
          if (b.bonus) bonusesToActivate.push({ r: b.r, c: b.c, type: b.bonus });
        }
        score += group.length * 10;
        Sfx.cacoHit(); Sfx.pop();
        faceMood = 'happy'; faceMoodTimer = 25;
        if (group.length >= 4){
          var hudY = TOTAL_H - HUD_H;
          var joyTexts = ['RIP!', 'TEAR!', 'BOOM!', 'POP!', 'SLAY!', 'YES!', 'DIE!', 'GORE!'];
          addJoyCloud(TOTAL_W / 2 + 40, hudY + HUD_H / 2 - 30, joyTexts[Math.floor(Math.random() * joyTexts.length)]);
        }
        // Group destroy loop — special handling for boss
        for (var i3 = 0; i3 < group.length; i3++){
          var bb = group[i3];
          if (bb.boss && bb.bossHp > 0){
            bb.bossHp--;
            if (bb.bossHp > 0){
              // Boss survives this hit — flash and stay
              bb.hurt = true;
              Sfx.cacoHit();
              spawnParticles(cellX(bb.r, bb.c), cellY(bb.r), '#ff2222', 30);
              addPopAnim(cellX(bb.r, bb.c), cellY(bb.r), '#ff2222', null);
              floatingTexts.push({ x: cellX(bb.r, bb.c), y: cellY(bb.r) - 40, text: bb.bossHp + ' HITS LEFT', t: 0, tMax: 60, color: '#ff2222' });
              continue;
            }
            // Boss destroyed — fall through to normal removal
            for (var k = 0; k < 6; k++) addPopAnim(cellX(bb.r, bb.c) + (Math.random() - 0.5) * 60, cellY(bb.r) + (Math.random() - 0.5) * 60, '#ff2222', null);
          }
          addPopAnim(cellX(bb.r, bb.c), cellY(bb.r), bb.color, bb.bonus);
          spawnParticles(cellX(bb.r, bb.c), cellY(bb.r), bb.color, 12);
          grid[bb.r][bb.c] = null;
        }
        collapseFloating();
        for (var i4 = 0; i4 < bonusesToActivate.length; i4++){
          var bonus = bonusesToActivate[i4];
          if (BAD_BONUS_TYPES.indexOf(bonus.type) >= 0) activateBadBonus(bonus.r, bonus.c, bonus.type);
          else activateBonus(bonus.r, bonus.c, bonus.type);
        }
      } else {
        grid[targetR][targetC].hurt = true;
        spawnParticles(cellX(targetR, targetC), cellY(targetR), f.color, 6);
      }
    }
  }
  if (isPrimary) flying = null; else flyingExtra = null;
  if (isPrimary && !flyingExtra) finishShot();
}
function finishShot(){
  // Guard: if game is over (e.g. from pushDown bonus), do NOT override with LEVEL_CLEAR
  if (state !== 'PLAYING') return;
  shotsSinceDrop++;
  current = next || { color: pickAvailableColor(), bonus: null };
  next = makeRandomBubble();
  collapseFloating();
  // LEVEL ENDS ONLY IF GRID IS COMPLETELY EMPTY
  if (isGridEmpty()){
    state = 'LEVEL_CLEAR';
    score += 100 * level;
    Sfx.levelUp();
    return;
  }
  var remaining = {};
  for (var r = 0; r < ROWS; r++)
    for (var c = 0; c < COLS; c++)
      if (grid[r][c]) remaining[grid[r][c].color] = true;
  if (Object.keys(remaining).length > 0 && !remaining[current.color]) current.color = pickAvailableColor();
  if (slowTurnsLeft > 0) slowTurnsLeft--;
  else if (blindTurnsLeft > 0) blindTurnsLeft--;
  else if (shotsSinceDrop >= dropEvery){ shotsSinceDrop = 0; dropCeiling(); }
}
function makeRandomBubble(){ return { color: pickAvailableColor(), bonus: null }; }
function collapseFloating(){
  var floating = findFloating();
  if (floating.length === 0) return;
  Sfx.fall();
  for (var i = 0; i < floating.length; i++){
    var f = floating[i];
    addFallAnim(cellX(f.r, f.c), cellY(f.r), f.color, f.bonus);
    grid[f.r][f.c] = null;
    score += 5;
    floatingTexts.push({ x: cellX(f.r, f.c), y: cellY(f.r), text: '+5', t: 0, tMax: 40, color: '#8888ff' });
  }
}

function activateBonus(r, c, type){
  bonusFlash = { type: type, timer: 80 };
  Sfx.bonus(); Sfx.roar();

      for (var cc = 0; cc < COLS; cc++)

    var bestColor = COLORS[0], bestCount = 0;
    for (var col in counts) if (counts[col] > bestCount){ bestCount = counts[col]; bestColor = col; }
    var anchorR = r, anchorC = c;

      for (var r2 = 0; r2 < ROWS && !found; r2++){

      }

    for (var i3 = 0; i3 < group.length; i3++) killCell(group[i3].r, group[i3].c);
    collapseFloating();
  }
  else if (type === 'swap'){

    collapseFloating();
  }
  else if (type === 'slow'){

    collapseFloating();
  }
  else if (type === 'double'){

    collapseFloating();
  }
  else if (type === 'paint'){
    if (grid[r][c]) killCell(r, c);
    score += 25;

      for (var c3 = 0; c3 < COLS; c3++)
        if (grid[r3][c3]) all.push(grid[r3][c3]);
    for (var i4 = all.length - 1; i4 > 0; i4--){

function dropCeiling(){
  for (var c = 0; c < COLS; c++){
    if (grid[ROWS-1][c]){ gameOver(); return; }
  }
  for (var r = ROWS - 1; r > 0; r--){
    for (var c2 = 0; c2 < COLS; c2++){
      grid[r][c2] = grid[r-1][c2];
      if (grid[r][c2]) grid[r][c2].r = r;
    }
  }
  for (var c3 = 0; c3 < COLS; c3++) grid[0][c3] = null;
}
function checkLose(){
  var lowestRow = -1;
  for (var r = ROWS - 1; r >= 0; r--){
    for (var c = 0; c < COLS; c++){
      if (grid[r][c]){ lowestRow = r; break; }
    }
    if (lowestRow >= 0) break;
  }
  if (lowestRow >= 0){
    var depthRatio = lowestRow / ROWS;
    if (depthRatio > 0.75) bloodLevel = Math.min(1, (depthRatio - 0.75) / 0.25);
    else bloodLevel = Math.max(0, bloodLevel - 0.02);
    if (bloodLevel > 0.1 && Math.random() < bloodLevel * 0.3 && screenBlood.length < 50){
      screenBlood.push({ x: Math.random() * TOTAL_W, y: 0, w: 1 + Math.random() * 4, h: 12 + Math.random() * 50, life: 220, speed: 0.4 + Math.random() * 0.6, alpha: 0.5 + Math.random() * 0.4 });
    }
  } else {
    bloodLevel = Math.max(0, bloodLevel - 0.02);
  }
  if (lowestRow >= 0 && state === 'PLAYING' && faceMoodTimer <= 0){
    if (lowestRow / ROWS > 0.75) faceMood = 'hurt';
    else if (faceMood === 'hurt') faceMood = 'calm';
  }
  for (var r2 = 0; r2 < ROWS; r2++){
    for (var c2 = 0; c2 < COLS; c2++){
      if (grid[r2][c2] && cellY(r2) + R > LOSE_Y){ gameOver(); return true; }
    }
  }
  return false;
}
function gameOver(){
  if (state === 'GAME_OVER') return;
  state = 'GAME_OVER';
  faceMood = 'dead'; faceMoodTimer = 99999;
  Sfx.gameOver();
  if (!scoreSaved){ scoreSaved = true; saveScore(playerName, score); }
}

var LS_KEY = 'cacobubble_leaders_v9';
var LS_NAME = 'cacobubble_player_name';
function loadLeaders(){
  try {
    var raw = localStorage.getItem(LS_KEY);
    if (!raw) return [];
    var arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : [];
  } catch(e){ return []; }
}
function saveScore(name, sc){
  var arr = loadLeaders();
  arr.push({ name: name, score: sc, level: level, date: Date.now() });
  arr.sort(function(a, b){ return b.score - a.score; });
  try { localStorage.setItem(LS_KEY, JSON.stringify(arr.slice(0, 5))); } catch(e){}
}
function loadPlayerName(){ try { return localStorage.getItem(LS_NAME) || 'DOOMGUY'; } catch(e){ return 'DOOMGUY'; } }
function savePlayerName(n){ try { localStorage.setItem(LS_NAME, n); } catch(e){} }

function drawLightningBolts(){
  for (var i = 0; i < lightningBolts.length; i++){
    var lb = lightningBolts[i];
    var alpha4 = lb.life / lb.maxLife;
    ctx.strokeStyle = 'rgba(220, 230, 255, ' + alpha4 + ')';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(lb.segments[0][0], lb.segments[0][1]);
    for (var s = 1; s < lb.segments.length; s++){
      ctx.lineTo(lb.segments[s][0], lb.segments[s][1]);
    }
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255, 255, 255, ' + (alpha4 * 0.7) + ')';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
}

  ctx.fillStyle = '#8b0000';

    ctx.lineTo(wc.x + Math.cos(wc.angle - 0.6) * wc.len * 0.7, wc.y + Math.sin(wc.angle - 0.6) * wc.len * 0.7);

function drawTorch(x, y){

function drawSkull(x, y){

  var eyeGlow = blinkPhase > 0.3;

  var pal = { 'B': '#d4c4a8', 'S': '#a89878', 'K': eyeColor, 'R': '#884444' };
  var pattern = [
    "..BBBBBB..",".BBBBBBBB.","BBBBBBBBBB","BBKBBBBKBB","BBKBBBBKBB",
    "BBBBKKBBBB","BBBBBBBBBB",".BBBBBBBB.","..BSBBSB...","...B..B...",
    "..RBBBBR..","...B..B...","...R..R...",".........."
  ];
  drawPixelSprite(pattern, x, y, 3, pal);
  if (eyeGlow){
    ctx.globalAlpha = 0.6;
    ctx.fillStyle = '#ff2200';
    ctx.beginPath(); ctx.arc(x - 6, y - 9, 4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 6, y - 9, 4, 0, Math.PI * 2); ctx.fill();

function drawPillar(x, y){

function drawCacoAt(x, y, color, opts){
  var scale = opts.scale || 1;
  var isBoss = opts.boss;
  var bossHp = opts.bossHp || 0;
  if (isBoss) scale *= 2.5;  // BOSS IS HUGE — like 6 regular balls in area

  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath();
  ctx.arc(x, y + R * scale * 0.9, R * scale * 0.72, 0, Math.PI * 2);
  ctx.fill();

  var spr = createCacoSprite(color, opts.hurt, isBoss);
  var sw = spr.w * scale;
  var sh = spr.h * scale;
  ctx.drawImage(spr.canvas, x - sw / 2, y - sh / 2, sw, sh);

  var glowSprite = createGlowSprite();
  var gw = R * scale * 2.2;
  ctx.globalAlpha = 0.5 + 0.25 * Math.sin(cachedTimeMs / 200);
  ctx.drawImage(glowSprite, x - gw / 2, y - R*0.05*scale - gw / 2, gw, gw);
  ctx.globalAlpha = 1;

  if (isBoss && bossHp > 0){
    // Boss HP display
    ctx.fillStyle = '#ff2222';
    ctx.font = 'bold 18px monospace';
    ctx.textAlign = 'center';
    ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
    var hpText = 'HP ' + bossHp + '/3';
    ctx.strokeText(hpText, x, y - R * scale * 0.9 - 10);
    ctx.fillText(hpText, x, y - R * scale * 0.9 - 10);
  }

  if (opts.bonus){
    var isBad = BAD_BONUS_TYPES.indexOf(opts.bonus) >= 0;
    ctx.strokeStyle = isBad ? '#ff0000' : bonusColor(opts.bonus);
    ctx.lineWidth = isBad ? 3 : 2;
    ctx.setLineDash(isBad ? [6, 3] : [4, 3]);
    ctx.beginPath();
    ctx.arc(x, y, R * scale + 4, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = isBad ? '#ff0000' : bonusColor(opts.bonus);
    ctx.font = 'bold ' + Math.floor(R * 0.9) + 'px monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(bonusSymbol(opts.bonus), x, y + 1);
    ctx.textBaseline = 'alphabetic';
    if (isBad){
      ctx.fillStyle = '#ff0000';
      ctx.font = 'bold ' + Math.floor(R * 1.2) + 'px monospace';
      ctx.fillText('!', x, y - R * scale - 4);
    }
  }
}
function cacoPalette(color){
  return {
    'B': color, 'D': darken(color, 55), 'L': lighten(color, 60),
    'G': '#00ff44', 'K': '#000', 'W': '#e8e8e8'
  };
}
function drawDeathFrame(x, y, color, t){
  var pixelSize = (R * 2) / 24;
  var pattern;
  if (t < 0.20) pattern = DEATH_1;
  else if (t < 0.40) pattern = DEATH_2;
  else if (t < 0.60) pattern = DEATH_3;
  else if (t < 0.85) pattern = DEATH_4;
  else pattern = DEATH_5;
  var pal = { 'B': darken(color, 30), 'K': '#000', 'W': '#aa2222' };
  drawPixelSprite(pattern, x, y, pixelSize, pal);
}
function lighten(hex, amt){
  var n = parseInt(hex.slice(1), 16);
  var r = Math.min(255, (n >> 16) + amt);
  var g = Math.min(255, ((n >> 8) & 0xff) + amt);
  var b = Math.min(255, (n & 0xff) + amt);
  return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
}
function darken(hex, amt){
  var n = parseInt(hex.slice(1), 16);
  var r = Math.max(0, (n >> 16) - amt);
  var g = Math.max(0, ((n >> 8) & 0xff) - amt);
  var b = Math.max(0, (n & 0xff) - amt);
  return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
}

function drawShotgun(){
  var baseX = CANNON_X, baseY = FIELD_Y + FIELD_H + 60;
  ctx.save();
  ctx.translate(baseX, baseY + recoil);
  ctx.rotate(aimAngle);
  var pattern = muzzleFlash > 0 ? SHOTGUN_FIRE : SHOTGUN_IDLE;
  var pixelSize = 5;
  var pal = { 'W': '#888', 'M': '#1a1a1a', 'K': '#000', 'Y': '#ffff00', 'O': '#ff8800' };
  drawPixelSprite(pattern, 0, -60, pixelSize, pal);
  if (current){
    ctx.beginPath();
    ctx.arc(0, -118, 10, 0, Math.PI * 2);
    ctx.fillStyle = current.color; ctx.fill();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
  }
  ctx.restore();
  ctx.fillStyle = '#555';
  for (var i = 0; i < smokePuffs.length; i++){
    var s = smokePuffs[i];
    ctx.globalAlpha = (1 - s.t / s.tMax) * 0.6;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.size * (1 + s.t / s.tMax), 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (muzzleFlash > 0){
    var t = muzzleFlash / 10;
    var dx = baseX + Math.sin(aimAngle) * -100;
    var dy = baseY + recoil + Math.cos(aimAngle) * -100;
    ctx.globalAlpha = t * 0.6;
    ctx.fillStyle = '#ff4400';
    ctx.beginPath(); ctx.arc(dx, dy, 35 + (1-t) * 15, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = t * 0.9;
    ctx.fillStyle = '#ffaa00';
    ctx.beginPath(); ctx.arc(dx, dy, 20 + (1-t) * 10, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = t;
    ctx.fillStyle = '#ffffaa';
    ctx.beginPath(); ctx.arc(dx, dy, 10 + (1-t) * 5, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    muzzleFlash--;
  }
  if (recoil > 0) recoil = Math.max(0, recoil - 2);
  for (var i2 = 0; i2 < casings.length; i2++){
    var c = casings[i2];
    ctx.save();
    ctx.translate(c.x, c.y); ctx.rotate(c.rot);
    ctx.globalAlpha = c.life / c.maxLife;
    ctx.fillStyle = '#ffcc00';
    ctx.fillRect(-2, -4, 4, 8);
    ctx.fillStyle = '#aa8800';
    ctx.fillRect(-2, -4, 4, 2);
    ctx.restore();
    ctx.globalAlpha = 1;
  }
}

function drawFace(x, y, size){
  var pattern = FACE_CALM;
  if (faceMood === 'fire') pattern = FACE_FIRE;
  else if (faceMood === 'angry') pattern = FACE_ANGRY;
  else if (faceMood === 'happy') pattern = FACE_HAPPY;
  else if (faceMood === 'hurt') pattern = FACE_HURT;
  else if (faceMood === 'dead') pattern = FACE_DEAD;
  if (faceMood === 'calm'){
    if (faceBlinkState) pattern = FACE_BLINK;
    else if (faceWinkState && Math.floor(cachedTimeMs / 400) % 3 === 0) pattern = FACE_WINK;
    else if (faceAnimFrame === 1) pattern = FACE_SMILE;
    else if (faceAnimFrame === 3) pattern = FACE_ANGRY;
  }
  var pixelSize = size / 16;
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(x - size/2 - 3, y - size/2 - 3, size + 6, size + 6);
  ctx.strokeStyle = '#555'; ctx.lineWidth = 2;
  ctx.strokeRect(x - size/2 - 3, y - size/2 - 3, size + 6, size + 6);
  var eyeY = y - size * 0.04;
  var eyeOffsetX = size * 0.13;
  var pulse = 0.5 + 0.4 * Math.sin(cachedTimeMs / 180);
  var g1 = ctx.createRadialGradient(x - eyeOffsetX, eyeY, 0, x - eyeOffsetX, eyeY, size * 0.20);
  g1.addColorStop(0, 'rgba(255,50,30,' + pulse + ')');
  g1.addColorStop(1, 'rgba(255,0,0,0)');
  ctx.fillStyle = g1;
  ctx.beginPath(); ctx.arc(x - eyeOffsetX, eyeY, size * 0.20, 0, Math.PI * 2); ctx.fill();
  var g2 = ctx.createRadialGradient(x + eyeOffsetX, eyeY, 0, x + eyeOffsetX, eyeY, size * 0.20);
  g2.addColorStop(0, 'rgba(255,50,30,' + pulse + ')');
  g2.addColorStop(1, 'rgba(255,0,0,0)');
  ctx.fillStyle = g2;
  ctx.beginPath(); ctx.arc(x + eyeOffsetX, eyeY, size * 0.20, 0, Math.PI * 2); ctx.fill();
  drawPixelSprite(pattern, x, y, pixelSize, FACE_PALETTE);
}

  ctx.clip();
  legendScroll += (legendTargetScroll - legendScroll) * 0.2;
  var offsetY = legendScroll;

    if (!BONUS_INFO[i2].good){ drawBonusEntry(BONUS_INFO[i2], listX + 15, cursorY, listW - 30); cursorY += 78; }
  }
  ctx.restore();
  var contentHeight = 20 + 35 + 8 * 78 + 20 + 35 + 5 * 78 + 20;
  var maxScroll = Math.max(0, contentHeight - listH);
  legendTargetScroll = Math.max(0, Math.min(legendTargetScroll, maxScroll));

    ctx.fillStyle = '#8b0000';
    ctx.fillRect(listX + listW - 8, barY, 6, barH);

}

  ctx.fillText('YES', daX + bw/2, by + 40);

  ctx.fillStyle = '#6a1a1a';
  ctx.fillRect(netX, by, bw, bh);
  ctx.strokeStyle = '#ff4444'; ctx.lineWidth = 3;
  ctx.strokeRect(netX, by, bw, bh);
  ctx.fillStyle = '#fff';
  ctx.fillText('NO', netX + bw/2, by + 40);
}

function drawLevelClear(){
  ctx.fillStyle = 'rgba(0,0,0,0.92)';
  ctx.fillRect(0, 0, TOTAL_W, TOTAL_H);
  ctx.fillStyle = '#e9c46a';
  ctx.font = 'bold 56px monospace'; ctx.textAlign = 'center';
  ctx.fillText('LEVEL ' + level + ' CLEAR', TOTAL_W/2, TOTAL_H/2 - 60);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 28px monospace';
  ctx.fillText('SCORE ' + score, TOTAL_W/2, TOTAL_H/2 + 10);
  ctx.fillStyle = '#c41e3a';
  ctx.font = 'bold 22px monospace';
  ctx.fillText('ALL DEMONS SLAIN!', TOTAL_W/2, TOTAL_H/2 + 55);
  var alpha = 0.6 + 0.4 * Math.sin(cachedTimeMs / 400);
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#e9c46a';
  ctx.font = 'bold 22px monospace';
  ctx.fillText('► TAP FOR LEVEL ' + (level + 1) + ' ◄', TOTAL_W/2, TOTAL_H/2 + 130);
  ctx.globalAlpha = 1;
  drawCacoAt(TOTAL_W / 2, TOTAL_H/2 - 170, '#ff2a2a', { scale: 1.2 });
}
function drawGameOver(){
  ctx.fillStyle = 'rgba(0,0,0,0.96)';
  ctx.fillRect(0, 0, TOTAL_W, TOTAL_H);
  drawFace(TOTAL_W / 2, TOTAL_H / 2 - 140, 130);
  ctx.fillStyle = '#c41e3a';
  ctx.font = 'bold 62px monospace'; ctx.textAlign = 'center';
  ctx.fillText('YOU DIED', TOTAL_W/2, TOTAL_H/2 - 20);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 24px monospace';
  ctx.fillText('SCORE ' + score, TOTAL_W/2, TOTAL_H/2 + 30);
  ctx.fillStyle = '#aaa';
  ctx.font = 'bold 18px monospace';
  ctx.fillText('REACHED LEVEL ' + level, TOTAL_W/2, TOTAL_H/2 + 62);
  var alpha = 0.6 + 0.4 * Math.sin(cachedTimeMs / 400);
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#ff4444';
  ctx.font = 'bold 20px monospace';
  ctx.fillText('► TAP TO RESTART ◄', TOTAL_W/2, TOTAL_H/2 + 120);
  ctx.globalAlpha = 1;
}

function drawAim(){
  var sx = CANNON_X, sy = CANNON_Y - 40;
  var x = sx, y = sy;
  var vx = Math.sin(aimAngle) * SHOOT_SPEED;
  var vy = -Math.cos(aimAngle) * SHOOT_SPEED;
  var points = [[x, y]];
  for (var i = 0; i < 300; i++){
    x += vx; y += vy;
    if (x - R < FIELD_X){ x = FIELD_X + R; vx = Math.abs(vx); points.push([x, y]); }
    if (x + R > FIELD_X + FIELD_W){ x = FIELD_X + FIELD_W - R; vx = -Math.abs(vx); points.push([x, y]); }
    if (y - R < FIELD_Y){ points.push([x, y]); break; }
    var cell = nearestCell(x, y);
    if (cell && grid[cell.r][cell.c]){
      var ex = cellX(cell.r, cell.c), ey = cellY(cell.r);
      if (Math.sqrt((x-ex)*(x-ex) + (y-ey)*(y-ey)) < R * 1.9){ points.push([x, y]); break; }
    }
    if (i % 4 === 0) points.push([x, y]);
  }
  ctx.fillStyle = 'rgba(255,80,40,0.9)';
  for (var i2 = 0; i2 < points.length; i2++) ctx.fillRect(points[i2][0] - 2, points[i2][1] - 2, 4, 4);
}

function bonusColor(type){
  switch (type){
    case 'bomb': return '#ff7700';
    case 'laser': return '#00ddff';
    case 'rainbow': return '#ff00ff';
    case 'swap': return '#ffff00';
    case 'push': return '#00ff88';
    case 'slow': return '#88ccff';
    case 'double': return '#ffaa00';
    case 'paint': return '#ff5577';
    case 'bombBad': return '#ff0000';
    case 'blind': return '#8844ff';
    case 'addRow': return '#ff2200';
    case 'shuffle': return '#ffaa00';
    case 'pushDown': return '#ff0000';
  }
  return '#fff';
}
function bonusSymbol(type){
  switch (type){
    case 'bomb': return '*';
    case 'laser': return '=';
    case 'rainbow': return 'R';
    case 'swap': return 'X';
    case 'push': return '^';
    case 'slow': return 'S';
    case 'double': return 'D';
    case 'paint': return 'P';
    case 'bombBad': return '*!';
    case 'blind': return '?!';
    case 'addRow': return '+!';
    case 'shuffle': return '~!';
    case 'pushDown': return 'v!';
  }
  return '?';
}
function bonusName(type){
  switch (type){
    case 'bomb': return 'BOMB';
    case 'laser': return 'LASER';
    case 'rainbow': return 'RAINBOW';
    case 'swap': return 'SWAP';
    case 'push': return 'PUSH';
    case 'slow': return 'SLOW';
    case 'double': return 'DOUBLE';
    case 'paint': return 'PAINT';
    case 'bombBad': return 'BAD BOMB';
    case 'blind': return 'BLIND';
    case 'addRow': return 'ADD ROW';
    case 'shuffle': return 'SHUFFLE';
    case 'pushDown': return 'PUSH DOWN';
  }
  return '';
}

function update(){
  timeMs += 16;
  cachedTimeMs = timeMs;
  updateParticles();
  updateAnimBalls();
  var diff = aimTargetAngle - aimAngle;
  aimAngle += diff * 0.25;
  if (faceMoodTimer > 0){
    faceMoodTimer--;
    if (faceMoodTimer === 0 && faceMood !== 'dead' && faceMood !== 'hurt') faceMood = 'calm';
  }
  if (state === 'START' || state === 'LEGEND' || state === 'ABOUT'){
    updateTitleEffects();
  }
  if (state !== 'PLAYING') return;
  if (levelIntroTimer > 0){ levelIntroTimer--; return; }
  if (paused) return;
  updateFlying();
  checkLose();
}

function clientToField(clientX, clientY){
  var rect = canvas.getBoundingClientRect();
  return {
    x: (clientX - rect.left) * (TOTAL_W / rect.width),
    y: (clientY - rect.top) * (TOTAL_H / rect.height)
  };
}
function updateAimTarget(x, y){
  var dx = x - CANNON_X;
  var dy = y - CANNON_Y;
  var a = Math.atan2(dx, -dy);
  var max = Math.PI / 2.3;
  a = Math.max(-max, Math.min(max, a));
  aimTargetAngle = a;
}
function inRect(p, r){
  return r && p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;
}
function checkPanelButtons(p){
  var lx = 10, bw = PANEL_W - 20;
  if (p.x >= lx && p.x <= lx + bw){
    if (p.y >= LEFT_SOUND_Y && p.y <= LEFT_SOUND_Y + 30){ soundOn = !soundOn; if (soundOn) Sfx.click(); return true; }
    if (p.y >= LEFT_MUSIC_Y && p.y <= LEFT_MUSIC_Y + 30){
      musicOn = !musicOn;
      if (musicOn) startMusic(); else stopMusic();
      Sfx.click(); return true;
    }
    if (p.y >= LEFT_TRACK_Y && p.y <= LEFT_TRACK_Y + 30){
      musicTrackIndex = (musicTrackIndex + 1) % TRACKS.length;
      setMusicTrack(musicTrackIndex);
      Sfx.click(); return true;
    }
  }
  var rx = TOTAL_W - PANEL_W + 10;
  if (p.x >= rx && p.x <= rx + bw){
    if (p.y >= RIGHT_LEGEND_Y && p.y <= RIGHT_LEGEND_Y + 34){
      legendReturnState = state;
      state = 'LEGEND'; legendScroll = 0; legendTargetScroll = 0;
      Sfx.click(); return true;
    }
    if (p.y >= RIGHT_PAUSE_Y && p.y <= RIGHT_PAUSE_Y + 34){
      paused = !paused; Sfx.click(); return true;
    }
    if (p.y >= RIGHT_MENU_Y && p.y <= RIGHT_MENU_Y + 34){
      paused = false; state = 'START';
      Sfx.click(); return true;
    }
  }
  if (inRect(p, vkButtonRect)){ openVK(); return true; }
  return false;
}

function handleTap(clientX, clientY){
  initAudio(); resumeAudio();
  if (musicOn && !musicTimer) startMusic();
  var p = clientToField(clientX, clientY);

  if (state === 'LEGEND'){
    var bx = TOTAL_W / 2 - 100, by = TOTAL_H - 75, bw = 200, bh = 50;
    if (p.x >= bx && p.x <= bx + bw && p.y >= by && p.y <= by + bh){
      state = legendReturnState || 'START';
      if (state === 'PLAYING') paused = true;
      Sfx.click();
      return;
    }
    return;
  }
  if (state === 'ABOUT'){
    if (vkLinkRect && p.x >= vkLinkRect.x && p.x <= vkLinkRect.x + vkLinkRect.w &&
        p.y >= vkLinkRect.y && p.y <= vkLinkRect.y + vkLinkRect.h){
      openVK(); return;
    }
    var bx2 = TOTAL_W / 2 - 100, by2 = TOTAL_H - 75, bw2 = 200, bh2 = 50;
    if (p.x >= bx2 && p.x <= bx2 + bw2 && p.y >= by2 && p.y <= by2 + bh2){
      state = 'START'; Sfx.click(); return;
    }
    return;
  }

  if (state === 'PLAYING' && checkPanelButtons(p)) return;

  if (paused && state === 'PLAYING' && levelIntroTimer <= 0){
    var menuX = FIELD_X + FIELD_W / 2;
    var startY = FIELD_Y + 160;
    for (var i = 0; i < 4; i++){
      var y = startY + i * 50;
      if (p.x >= menuX - 130 && p.x <= menuX + 130 && p.y >= y - 22 && p.y <= y + 16){
        if (i === 0){ paused = false; }
        else if (i === 1){ paused = false; score = 0; level = 1; initLevel(); state = 'PLAYING'; }
        else if (i === 2){ soundOn = !soundOn; }
        else if (i === 3){ musicOn = !musicOn; if (musicOn) startMusic(); else stopMusic(); }
        Sfx.click();
        return;
      }
    }
    return;
  }

  if (state === 'START'){
    var bigBtnW = 420, bigBtnH = 90;
    var bigBtnX = TOTAL_W / 2 - bigBtnW / 2;
    var bigBtnY = TOTAL_H * 0.42;
    if (p.x >= bigBtnX && p.x <= bigBtnX + bigBtnW && p.y >= bigBtnY && p.y <= bigBtnY + bigBtnH){
      state = 'CONFIRM';
      Sfx.click();
      return;
    }
    var btnW = 200, btnH = 40;
    var btnX = TOTAL_W / 2 - btnW / 2;
    var btnStartY = bigBtnY + bigBtnH + 30;
    for (var j = 0; j < 2; j++){
      var by3 = btnStartY + j * (btnH + 8);
      if (p.x >= btnX && p.x <= btnX + btnW && p.y >= by3 && p.y <= by3 + btnH){
        if (j === 0){ state = 'ABOUT'; }
        else if (j === 1){ downloadGame(); }
        Sfx.click();
        return;
      }
    }
    return;
  }

  if (state === 'CONFIRM'){
    var byC = TOTAL_H / 2 + 150;
    var bwC = 150, bhC = 60, gapC = 40;
    var daX = TOTAL_W / 2 - bwC - gapC / 2;
    var netX = TOTAL_W / 2 + gapC / 2;
    if (p.x >= daX && p.x <= daX + bwC && p.y >= byC && p.y <= byC + bhC){
      clearTitleEffects();
      state = 'PLAYING'; score = 0; level = 1; initLevel();
      Sfx.click(); return;
    }
    if (p.x >= netX && p.x <= netX + bwC && p.y >= byC && p.y <= byC + bhC){
      clearTitleEffects();
      state = 'START'; Sfx.click(); return;
    }
    return;
  }

  if (state === 'GAME_OVER'){ state = 'START'; score = 0; level = 1; Sfx.click(); return; }
  if (state === 'LEVEL_CLEAR'){ level++; initLevel(); state = 'PLAYING'; Sfx.click(); return; }

  if (levelIntroTimer > 0) return;

  if (p.x < FIELD_X || p.x > FIELD_X + FIELD_W) return;
  if (p.y > FIELD_Y + FIELD_H + 20) return;

  if (state === 'PLAYING'){
    if (paused){ paused = false; Sfx.click(); return; }
    updateAimTarget(p.x, p.y);
    aimAngle = aimTargetAngle;
    hoverX = p.x; hoverY = p.y;
    shoot();
  }
}

canvas.addEventListener('touchstart', function(e){
  e.preventDefault();
  var t = e.changedTouches[0];
  if (!t) return;
  if (state === 'LEGEND'){
    var p = clientToField(t.clientX, t.clientY);
    var bx = TOTAL_W / 2 - 100, by = TOTAL_H - 75, bw = 200, bh = 50;
    if (p.x >= bx && p.x <= bx + bw && p.y >= by && p.y <= by + bh){
      state = legendReturnState || 'START';
      if (state === 'PLAYING') paused = true;
      Sfx.click();
      return;
    }
    legendTouchStartY = t.clientY;
    legendTouchStartScroll = legendTargetScroll;
    return;
  }
  handleTap(t.clientX, t.clientY);
}, { passive: false });

canvas.addEventListener('touchmove', function(e){
  e.preventDefault();
  if (state === 'LEGEND' && e.touches.length > 0){
    var dy = legendTouchStartY - e.touches[0].clientY;
    legendTargetScroll = Math.max(0, legendTouchStartScroll + dy * 1.5);
  }
}, { passive: false });

canvas.addEventListener('mousedown', function(e){
  e.preventDefault();
  handleTap(e.clientX, e.clientY);
});
canvas.addEventListener('mousemove', function(e){
  if (state === 'PLAYING' && !flying && !flyingExtra && !paused && levelIntroTimer <= 0){
    var p = clientToField(e.clientX, e.clientY);
    if (p.x > FIELD_X && p.x < FIELD_X + FIELD_W && p.y < FIELD_Y + FIELD_H){
      updateAimTarget(p.x, p.y);
      hoverX = p.x; hoverY = p.y;
    }
  }
});
canvas.addEventListener('mouseleave', function(){ hoverX = -1; hoverY = -1; });
canvas.addEventListener('wheel', function(e){
  if (state === 'LEGEND'){ e.preventDefault(); legendTargetScroll += e.deltaY * 0.8; }
}, { passive: false });

document.addEventListener('touchmove', function(e){
  if (state !== 'LEGEND') e.preventDefault();
}, { passive: false });
document.addEventListener('gesturestart', function(e){ e.preventDefault(); });

window.addEventListener('keydown', function(e){
  if (e.key === 'p' || e.key === 'P' || e.key === 'Escape'){
    if (state === 'PLAYING' && levelIntroTimer <= 0){ paused = !paused; Sfx.click(); }
    else if (state === 'LEGEND' || state === 'ABOUT'){
      state = legendReturnState || 'START';
      if (state === 'PLAYING') paused = true;
      Sfx.click();
    }
  }
  if (e.key === 'm' || e.key === 'M'){ soundOn = !soundOn; if (soundOn) Sfx.click(); }
});

var nameOverlay = document.getElementById('nameOverlay');
var nameInput = document.getElementById('nameInput');
var nameStart = document.getElementById('nameStart');
function showNameOverlay(){
  if (nameOverlayShown) return;
  nameOverlayShown = true;
  nameInput.value = loadPlayerName();
  nameOverlay.classList.add('show');
  setTimeout(function(){ nameInput.focus(); }, 100);
}
function hideNameOverlay(){ nameOverlay.classList.remove('show'); }
nameStart.addEventListener('click', function(){
  var v = (nameInput.value || '').trim().slice(0, 12) || 'DOOMGUY';
  playerName = v; savePlayerName(v);
  hideNameOverlay();
  initAudio(); resumeAudio();
  if (musicOn) startMusic();
  Sfx.click();
});
nameInput.addEventListener('keydown', function(e){ if (e.key === 'Enter') nameStart.click(); });

function loop(){ update(); draw(); requestAnimationFrame(loop); }
fitCanvas(); initGrid(); loop();
setTimeout(showNameOverlay, 200);

})();
</script>
