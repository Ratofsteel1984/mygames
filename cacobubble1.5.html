<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CACOBUBBLE — RIP AND POP</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Courier New',monospace}
  body{display:flex;justify-content:center;align-items:center}
  #stage{position:relative;width:876px;height:630px;transform-origin:center center;flex:0 0 auto}
  #c{display:block;position:absolute;top:0;left:0;width:876px;height:630px;background:#0a0505;touch-action:none;image-rendering:pixelated}
  #overlay{position:absolute;inset:0;pointer-events:none;font-family:'Courier New',monospace}
  #overlay>*{pointer-events:auto}
  .panel-left{position:absolute;left:8px;top:20px;width:118px}
  .panel-right{position:absolute;left:748px;top:20px;width:120px}
  .card{background:linear-gradient(180deg,rgba(70,10,10,.96),rgba(25,3,3,.96));border:2px solid #c00000;padding:5px 4px;text-align:center;margin-bottom:7px;box-shadow:0 0 12px rgba(255,0,0,.5),inset 0 0 14px rgba(255,60,60,.25);border-radius:3px}
  .card .label{font-family:Impact,'Arial Black',sans-serif;font-size:14px;color:#ff4455;letter-spacing:1.5px;text-shadow:1px 1px 0 #000,0 0 8px #ff0000}
  .card .value{font-family:Impact,'Arial Black',sans-serif;font-size:30px;color:#ffd76a;margin-top:1px;letter-spacing:1.5px;text-shadow:2px 2px 0 #000,0 0 12px #ff8800}
  .card .value-red{color:#ff6666;text-shadow:2px 2px 0 #000,0 0 12px #ff0000}
  .card .boss-tag{font-family:Impact,sans-serif;font-size:12px;color:#ff2222;letter-spacing:2px;text-shadow:0 0 10px #ff0000}
  .card-score{height:70px;display:flex;flex-direction:column;justify-content:center}
  .card-level{height:60px;display:flex;flex-direction:column;justify-content:center}
  .card-demons{height:54px;display:flex;flex-direction:column;justify-content:center}
  .card-loaded{height:120px;background:linear-gradient(180deg,rgba(90,12,12,.96),rgba(35,3,3,.96));padding:4px}
  .card-next{height:100px;padding:4px}
  .mini{display:block;margin:2px auto 0;image-rendering:pixelated}
  .icon-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px 4px;background:linear-gradient(180deg,rgba(50,8,8,.92),rgba(15,2,2,.92));border:2px solid #c00000;border-radius:5px;box-shadow:0 0 12px rgba(255,0,0,.45),inset 0 0 10px rgba(255,0,0,.2);margin-top:4px}
  .icon-btn{width:100%;aspect-ratio:1;max-height:52px;border-radius:50%;font-size:24px;padding:0;line-height:1;display:flex;align-items:center;justify-content:center;background:#2a1a1a;border:2px solid #b00000;color:#fff;cursor:pointer;font-family:'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif;transition:transform .08s;box-shadow:0 0 8px rgba(255,0,0,.4),inset 0 0 8px rgba(255,0,0,.2)}
  .icon-btn:active{transform:scale(.85);filter:brightness(1.35)}
  .icon-btn.off{opacity:.4;background:#120202}
  .icon-btn.blue{background:#1a3a5a;border-color:#4a90d9;box-shadow:0 0 10px rgba(74,144,217,.5)}
  .icon-btn.green{background:#1a5a3a;border-color:#00ff88;box-shadow:0 0 10px rgba(0,255,136,.5)}
  .icon-btn.purple{background:#2a1a4a;border-color:#aa44ff;box-shadow:0 0 10px rgba(170,68,255,.5)}
  .icon-btn.amber{background:#4a3a1a;border-color:#ffaa00;box-shadow:0 0 10px rgba(255,170,0,.5)}
  .icon-btn.red{background:#4a0a0a;border-color:#ff2222;box-shadow:0 0 10px rgba(255,34,34,.5)}
  .status-chip{display:block;width:100%;height:22px;line-height:22px;text-align:center;font-family:Impact,sans-serif;letter-spacing:1px;font-size:12px;margin-bottom:4px;box-shadow:0 0 8px currentColor;border-radius:2px}
  .status-slow{background:#00ff88;color:#000}
  .status-double{background:#ffff00;color:#000}
  .status-blind{background:#8844ff;color:#fff}
  .card-slayer{height:50px;display:flex;flex-direction:column;justify-content:center}
  .card-slayer .value{font-size:16px}
  .card-leaders{height:150px;padding:6px}
  .card-leaders .label{text-align:center;margin-bottom:4px}
  #uiLeaders{list-style:none;text-align:left;font-size:11px;font-weight:bold;display:flex;flex-direction:column;gap:4px}
  #uiLeaders li{display:flex;justify-content:space-between;gap:4px}
  #uiLeaders li .rank{width:16px}
  #uiLeaders li .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #uiLeaders li .sc{text-align:right}
  #uiLeaders li.gold{color:#ffd700}
  #uiLeaders li.silver{color:#c0c0c0}
  #uiLeaders li.bronze{color:#cd7f32}
  #uiLeaders li.other{color:#aaa}
  #uiLeaders li.empty{color:#666;justify-content:center}

  /* ============ HUD ============ */
  .hud{position:absolute;left:0;right:0;top:540px;height:90px;background:linear-gradient(#4a1010,#1a0303 60%,#050000);border-top:3px solid #d00000;border-bottom:2px solid #d00000;overflow:hidden;box-shadow:0 -8px 20px rgba(255,0,0,.4),inset 0 4px 20px rgba(255,60,60,.2)}
  .hud::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0,transparent 40px,rgba(255,60,60,.08) 40px,rgba(255,60,60,.08) 42px);pointer-events:none}
  .hud::after{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,transparent,#ff3333,transparent);opacity:.6}
  .hud-stat{position:absolute;top:8px;display:flex;flex-direction:column;align-items:center;text-align:center}
  .hud-score{left:36px}
  .hud-drops{right:36px}
  .hud-label{font-family:Impact,'Arial Black',sans-serif;font-size:22px;color:#ff2a2a;letter-spacing:4px;text-shadow:2px 2px 0 #000,0 0 16px #ff0000}
  .hud-value{font-family:Impact,'Arial Black',sans-serif;font-size:50px;line-height:1;margin-top:-2px;letter-spacing:5px;text-shadow:3px 3px 0 #000,0 0 20px currentColor}
  .hud-score .hud-value{color:#ffd700}
  .hud-drops .hud-value{color:#00ff44}
  .hud-value.danger{animation:dangerPulse .5s infinite alternate}
  @keyframes dangerPulse{from{opacity:.6;transform:scale(1)}to{opacity:1;transform:scale(1.08)}}
  .hud-face-wrap{position:absolute;left:340px;top:6px;width:220px;height:78px;pointer-events:none}
  .hud-face{position:absolute;left:0;top:2px;width:74px;height:74px;image-rendering:pixelated;filter:drop-shadow(0 0 10px rgba(0,255,68,.8))}

  /* ============ DOM SPEECH BUBBLES — НАД HUD (внутри DOM) ============ */
  .speech-bubble {
    position: absolute;
    background: linear-gradient(180deg, rgba(90,30,15,0.98), rgba(35,8,4,0.98));
    border: 2.5px solid #ffaa00;
    border-radius: 12px;
    padding: 6px 12px;
    color: #ffdd44;
    font-family: Impact, 'Arial Black', sans-serif;
    font-size: 15px;
    letter-spacing: 1px;
    text-shadow: 1px 1px 0 #000;
    box-shadow: 0 0 16px rgba(255,170,0,0.7), inset 0 0 10px rgba(255,100,50,0.3);
    display: none;
    pointer-events: none;
    z-index: 20;
    white-space: nowrap;
    max-width: 260px;
  }
  .speech-bubble.show { display: block; }
  .speech-bubble .icon { font-size: 22px; vertical-align: middle; margin-right: 6px; }
  .speech-bubble .sub { display: block; font-size: 10px; color: #ff8866; letter-spacing: 1.5px; margin-top: -2px; }
  .speech-bubble::before {
    content: '';
    position: absolute;
    left: -12px;
    top: 50%;
    transform: translateY(-50%);
    width: 0; height: 0;
    border-right: 11px solid #ffaa00;
    border-top: 8px solid transparent;
    border-bottom: 8px solid transparent;
  }

  /* Achievement bubble — big, at top of HUD */
  .speech-achieve { left: 434px; top: 6px; }
  /* Combo bubble — smaller, at bottom */
  .speech-combo {
    left: 434px; top: 58px;
    background: linear-gradient(180deg, rgba(80,20,10,0.98), rgba(40,5,2,0.98));
    border-color: #ffcc00;
    font-size: 18px;
    color: #ffff44;
    padding: 3px 10px;
    box-shadow: 0 0 14px rgba(255,200,0,0.8);
  }

  #nameOverlay{position:fixed;inset:0;background:radial-gradient(circle at 50% 60%,#3a0000,#000 70%);display:none;justify-content:center;align-items:center;z-index:100;flex-direction:column;gap:18px;font-family:'Courier New',monospace;padding:20px;overflow:hidden}
  #nameOverlay.show{display:flex}
  #nameOverlay .caco-deco{position:absolute;image-rendering:pixelated;filter:drop-shadow(0 0 14px #ff2200);animation:cacoFloat 4s ease-in-out infinite;z-index:1}
  @keyframes cacoFloat{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-16px) rotate(3deg)}}
  #nameOverlay h1{font-family:Impact,'Arial Black',sans-serif;color:#ff2a2a;font-size:clamp(28px,9vw,58px);letter-spacing:clamp(4px,2vw,10px);text-shadow:0 0 30px #ff0000,0 0 60px #8b0000,5px 5px 0 #000,-3px -3px 0 #000;text-align:center;max-width:100vw;word-break:break-word;line-height:1;z-index:2}
  #nameOverlay h2{font-family:Impact,'Arial Black',sans-serif;color:#fff;font-size:clamp(16px,5vw,26px);letter-spacing:clamp(3px,1.5vw,7px);text-shadow:3px 3px 0 #000;z-index:2}
  #nameOverlay p{color:#c88;font-size:14px;letter-spacing:3px;z-index:2}
  #nameInput{font-family:'Courier New',monospace;font-size:clamp(18px,6vw,28px);padding:16px 20px;background:#1a0a0a;color:#e9c46a;border:3px solid #b00000;outline:none;text-align:center;width:min(320px,82vw);letter-spacing:5px;box-shadow:0 0 20px rgba(255,0,0,.4) inset,0 0 24px rgba(255,0,0,.3);z-index:2}
  #nameInput:focus{border-color:#ff2a2a;box-shadow:0 0 24px #8b0000,0 0 24px rgba(255,0,0,.5) inset}
  #nameStart{font-family:Impact,'Arial Black',sans-serif;font-size:clamp(18px,5vw,26px);letter-spacing:4px;padding:16px 48px;background:linear-gradient(#c41e3a,#6a0010);color:#fff;border:3px solid #ff4444;cursor:pointer;text-shadow:0 0 10px #000;box-shadow:0 0 26px #8b0000;z-index:2}
  #nameStart:active{background:#8b0000;transform:scale(.97)}
</style>
</head>
<body>
<div id="stage" style="transform: scale(0.438356);">
  <canvas id="c" width="876" height="630"></canvas>
  <div id="overlay" style="display: block;">
    <div class="panel-left">
      <div class="card card-score"><div class="label">SCORE</div><div class="value" id="uiScore">0</div></div>
      <div class="card card-level"><div class="label">LEVEL</div><div class="value" id="uiLevel">1</div><div class="boss-tag" id="uiBossTag" style="display:none;">★ BOSS ★</div></div>
      <div class="card card-demons"><div class="label">DEMONS</div><div class="value value-red" id="uiDemons">32</div></div>
      <div class="card card-loaded"><div class="label">LOADED</div><canvas class="mini" id="uiLoaded" width="76" height="76"></canvas></div>
      <div class="card card-next"><div class="label">NEXT</div><canvas class="mini" id="uiNext" width="64" height="64"></canvas></div>
      <div id="uiStatuses"></div>
    </div>
    <div class="panel-right">
      <div class="card card-slayer"><div class="label">SLAYER</div><div class="value" id="uiPlayerName">DOOMGUY</div></div>
      <div class="card card-leaders"><div class="label">LEADERS</div><ol id="uiLeaders"><li class="empty">no souls yet</li></ol></div>
      <div class="icon-grid">
        <button class="icon-btn purple" id="uiAbout" title="About">ℹ️</button>
        <button class="icon-btn blue" id="uiLegend" title="Legend">📖</button>
        <button class="icon-btn amber" id="uiPause" title="Pause">⏸</button>
        <button class="icon-btn green" id="uiDownload" title="Save">💾</button>
        <button class="icon-btn" id="uiSound" title="Sound">🔊</button>
        <button class="icon-btn red" id="uiMusic" title="Music">🎵</button>
        <button class="icon-btn blue" id="uiTrack" title="Next track">⏭</button>
      </div>
    </div>
    <div class="hud">
      <div class="hud-stat hud-score"><div class="hud-label">SCORE</div><div class="hud-value" id="uiHealth">0000</div></div>
      <div class="hud-face-wrap"><canvas class="hud-face" id="uiFace" width="74" height="74"></canvas></div>
      <div class="hud-stat hud-drops"><div class="hud-label">NEXT DROP</div><div class="hud-value" id="uiAmmo">0012</div></div>
      <!-- SPEECH BUBBLES -->
      <div class="speech-bubble speech-achieve" id="achieveBubble"></div>
      <div class="speech-bubble speech-combo" id="comboBubble"></div>
    </div>
  </div>
</div>
<div id="nameOverlay" class="">
  <h1>CACOBUBBLE</h1>
  <h2>RIP AND POP</h2>
  <p>ENTER YOUR SLAYER NAME</p>
  <input id="nameInput" maxlength="12" autocomplete="off" placeholder="DOOMGUY">
  <button id="nameStart">START</button>

function createCacoSprite(color,hurt,boss){

  var PX=220;
  var off=document.createElement('canvas'); off.width=PX; off.height=PX;
  var o=off.getContext('2d'); o.imageSmoothingEnabled=true;
  var cx=PX/2, cy=PX/2;
  var bodyR=PX*0.34;
  var bodyColor=hurt?'#e02020':color;
  var darkC=darken(bodyColor,110), lightC=lighten(bodyColor,80), superDark=darken(bodyColor,175);

  o.save();
  o.beginPath();
  var wobPts=52;
  for(var i=0;i<=wobPts;i++){
    var a=(i/wobPts)*Math.PI*2;
    var wob=1+Math.sin(a*7)*0.032+Math.sin(a*3+1)*0.05+Math.sin(a*11+2)*0.018;

    var bx=cx+Math.cos(ba)*brad, by=cy+Math.sin(ba)*brad;

    o.fillStyle=lighten(bodyColor,45); o.beginPath(); o.arc(bx-bsize*0.35,by-bsize*0.35,bsize*0.42,0,Math.PI*2); o.fill();
  }
  for(var w=0;w<14;w++){
    var wa=(w*1.7);

    var wx=cx+Math.cos(wa)*wr, wy=cy+Math.sin(wa)*wr;
    var wsz=PX*(0.016+(w%3)*0.008);
    var wg=o.createRadialGradient(wx,wy,1,wx,wy,wsz);
    wg.addColorStop(0,'#ff9090'); wg.addColorStop(0.5,'#d02020'); wg.addColorStop(1,'#700000');
    o.fillStyle=wg; o.beginPath(); o.arc(wx,wy,wsz,0,Math.PI*2); o.fill();
  }
  o.strokeStyle='rgba(40,0,0,0.8)'; o.lineWidth=2;
  for(var v=0;v<12;v++){

    var vx0=cx+Math.cos(va)*bodyR*0.95, vy0=cy+Math.sin(va)*bodyR*0.95;
    o.moveTo(vx0,vy0);
    var vx1=cx+Math.cos(va+0.3)*bodyR*0.28, vy1=cy+Math.sin(va+0.3)*bodyR*0.28;
    o.quadraticCurveTo((vx0+vx1)/2+14,(vy0+vy1)/2-8,vx1,vy1);
    o.stroke();
  }
  o.restore();

  var mouthW=bodyR*1.7, mouthH=bodyR*1.0, mouthY=cy+bodyR*0.28;
  var mouthGrad=o.createRadialGradient(cx,mouthY,4,cx,mouthY,mouthW*0.72);
  mouthGrad.addColorStop(0,'#0a0000'); mouthGrad.addColorStop(1,'#000');
  o.fillStyle=mouthGrad;
  o.beginPath(); o.ellipse(cx,mouthY,mouthW*0.56,mouthH*0.56,0,0,Math.PI*2); o.fill();
  o.fillStyle='#a8143a';
  o.beginPath(); o.ellipse(cx,mouthY+mouthH*0.3,mouthW*0.36,mouthH*0.24,0,0,Math.PI*2); o.fill();
  o.fillStyle='#dd4477';
  o.beginPath(); o.ellipse(cx,mouthY+mouthH*0.2,mouthW*0.28,mouthH*0.14,0,0,Math.PI*2); o.fill();
  o.strokeStyle='#550000'; o.lineWidth=1.4;
  o.beginPath(); o.moveTo(cx-mouthW*0.2,mouthY+mouthH*0.2); o.lineTo(cx+mouthW*0.2,mouthY+mouthH*0.2); o.stroke();

  var teeth=15;
  function teethRow(baseY,isUpper){
    for(var t=0;t<teeth;t++){
      var tCX=cx-mouthW*0.5+(t+0.5)*(mouthW/teeth);
      var tW=mouthW/teeth*0.52;
      var tH=mouthH*(0.58+((t*7)%4)*0.12);
      var tipY=isUpper?baseY+tH:baseY-tH;
      var tg=o.createLinearGradient(tCX,baseY,tCX,tipY);
      tg.addColorStop(0,'#b8ac8c'); tg.addColorStop(0.35,'#fbf3d8');
      tg.addColorStop(0.85,'#e8dcc0'); tg.addColorStop(1,'#9a8a60');
      o.fillStyle=tg;
      o.beginPath();
      o.moveTo(tCX-tW,baseY);
      o.lineTo(tCX-tW*0.22,tipY+(isUpper?-tH*0.08:tH*0.08));
      o.lineTo(tCX,tipY);
      o.lineTo(tCX+tW*0.22,tipY+(isUpper?-tH*0.08:tH*0.08));
      o.lineTo(tCX+tW,baseY);
      o.closePath(); o.fill();
      o.strokeStyle='#4a3520'; o.lineWidth=1.3; o.stroke();
    }
  }
  teethRow(mouthY-mouthH*0.55,true);
  teethRow(mouthY+mouthH*0.55,false);

  var eyeY=cy-bodyR*0.42;
  var eyeRX=bodyR*0.44, eyeRY=bodyR*0.38;
  o.fillStyle='rgba(0,0,0,0.9)';
  o.beginPath(); o.ellipse(cx,eyeY,eyeRX*1.45,eyeRY*1.5,0,0,Math.PI*2); o.fill();
  var eg=o.createRadialGradient(cx-eyeRX*0.3,eyeY-eyeRY*0.3,2,cx,eyeY,eyeRX);
  eg.addColorStop(0,'#ffffff'); eg.addColorStop(0.55,'#ffe8d0'); eg.addColorStop(1,'#c09070');
  o.fillStyle=eg;
  o.beginPath(); o.ellipse(cx,eyeY,eyeRX,eyeRY,0,0,Math.PI*2); o.fill();
  o.strokeStyle='rgba(200,0,0,0.9)'; o.lineWidth=1.4;
  for(var bv=0;bv<16;bv++){
    var bva=bv*Math.PI/8;

  var irisCol=irisFor(color,hurt);

  ig.addColorStop(0,lighten(irisCol,90)); ig.addColorStop(0.5,irisCol); ig.addColorStop(1,darken(irisCol,90));
  o.fillStyle=ig;
  o.beginPath(); o.arc(cx,eyeY,irisR,0,Math.PI*2); o.fill();
  o.strokeStyle=darken(irisCol,70); o.lineWidth=1.6;
  for(var ir=0;ir<24;ir++){
    var ia=ir*Math.PI/12;

    o.moveTo(cx+Math.cos(ia)*irisR*0.3,eyeY+Math.sin(ia)*irisR*0.3);
    o.lineTo(cx+Math.cos(ia)*irisR*0.96,eyeY+Math.sin(ia)*irisR*0.96);
    o.stroke();
  }
  o.fillStyle='#000';
  o.beginPath(); o.ellipse(cx,eyeY,irisR*0.22,irisR*0.82,0,0,Math.PI*2); o.fill();
  o.fillStyle='rgba(255,255,255,0.95)';
  o.beginPath(); o.arc(cx-irisR*0.4,eyeY-irisR*0.45,irisR*0.26,0,Math.PI*2); o.fill();
  o.fillStyle='rgba(255,255,255,0.55)';
  o.beginPath(); o.arc(cx+irisR*0.45,eyeY+irisR*0.55,irisR*0.14,0,Math.PI*2); o.fill();
  o.strokeStyle='#1a0a0a'; o.lineWidth=4;
  o.beginPath(); o.ellipse(cx,eyeY,eyeRX,eyeRY,0,0,Math.PI*2); o.stroke();

  o.strokeStyle='#080303'; o.lineWidth=PX*0.055; o.lineCap='round';
  o.beginPath();
  o.moveTo(cx-eyeRX*1.85,eyeY-eyeRY*2.05);
  o.lineTo(cx-eyeRX*0.1,eyeY-eyeRY*0.55);
  o.stroke();
  o.beginPath();
  o.moveTo(cx+eyeRX*1.85,eyeY-eyeRY*2.05);
  o.lineTo(cx+eyeRX*0.1,eyeY-eyeRY*0.55);
  o.stroke();

  function drawHorn(hx,hy,angle,length,baseW){
    o.save(); o.translate(hx,hy); o.rotate(angle);
    var hg=o.createLinearGradient(-baseW/2,0,baseW/2,0);
    hg.addColorStop(0,'#5a4530'); hg.addColorStop(0.5,'#f5ecd0'); hg.addColorStop(1,'#8a7a5a');
    o.fillStyle=hg;
    o.beginPath();
    o.moveTo(-baseW/2,0);
    o.quadraticCurveTo(-baseW*0.9,-length*0.6,0,-length);
    o.quadraticCurveTo(baseW*0.9,-length*0.6,baseW/2,0);
    o.closePath(); o.fill();
    o.strokeStyle='#2a1500'; o.lineWidth=3.5; o.stroke();
    o.strokeStyle='rgba(50,30,10,0.6)'; o.lineWidth=1.6;
    for(var hr=1;hr<=8;hr++){
      var hy2=-length*hr/9;
      var hw2=baseW*(1-hr/9)*0.95;
      o.beginPath(); o.moveTo(-hw2/2,hy2); o.lineTo(hw2/2,hy2); o.stroke();
    }
    o.fillStyle='#1a0a00';
    o.beginPath(); o.arc(0,-length,baseW*0.08,0,Math.PI*2); o.fill();
    o.restore();
  }
  var hornLen=bodyR*(boss?1.45:1.2), hornW=PX*(boss?0.20:0.17);
  drawHorn(cx-bodyR*0.6,cy-bodyR*0.75,-0.65,hornLen,hornW);
  drawHorn(cx+bodyR*0.6,cy-bodyR*0.75,0.65,hornLen,hornW);
  if(boss){
    drawHorn(cx-bodyR*1.08,cy-bodyR*0.1,-1.5,hornLen*0.78,hornW*0.82);
    drawHorn(cx+bodyR*1.08,cy-bodyR*0.1,1.5,hornLen*0.78,hornW*0.82);
  }else{
    drawHorn(cx-bodyR*0.98,cy-bodyR*0.02,-1.65,bodyR*0.6,PX*0.09);
    drawHorn(cx+bodyR*0.98,cy-bodyR*0.02,1.65,bodyR*0.6,PX*0.09);
  }

  o.strokeStyle='#000'; o.lineWidth=6;
  o.beginPath();
  for(var ol=0;ol<=wobPts;ol++){
    var oa=(ol/wobPts)*Math.PI*2;
    var owob=1+Math.sin(oa*7)*0.032+Math.sin(oa*3+1)*0.05+Math.sin(oa*11+2)*0.018;

    var ox=cx+Math.cos(oa)*orad, oy=cy+Math.sin(oa)*orad;

  o.closePath(); o.stroke();
  o.strokeStyle=lighten(color,70); o.lineWidth=3;
  o.beginPath();
  for(var ol2=0;ol2<=wobPts;ol2++){
    var oa2=(ol2/wobPts)*Math.PI*2;
    var owob2=1+Math.sin(oa2*7)*0.032+Math.sin(oa2*3+1)*0.05+Math.sin(oa2*11+2)*0.018;

  }
  o.closePath(); o.stroke();

  cacoSpriteCache[key]={canvas:off,w:PX,h:PX};
  return cacoSpriteCache[key];
}
function createGlowSprite(color){

var audioCtx=null;
function initAudio(){if(audioCtx) return; try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
function resumeAudio(){if(audioCtx&&audioCtx.state==='suspended') audioCtx.resume();}
function tone(freq,dur,type,vol,delay){
  if(!audioCtx||!soundOn) return;
  var t0=audioCtx.currentTime+(delay||0);
  var osc=audioCtx.createOscillator(), gain=audioCtx.createGain();
  osc.type=type||'square'; osc.frequency.setValueAtTime(freq,t0);
  gain.gain.setValueAtTime(vol||0.15,t0);
  gain.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(t0); osc.stop(t0+dur);
}
function sweep(f1,f2,dur,type,vol){
  if(!audioCtx||!soundOn) return;
  var t0=audioCtx.currentTime;
  var osc=audioCtx.createOscillator(), gain=audioCtx.createGain();
  osc.type=type||'square'; osc.frequency.setValueAtTime(f1,t0);
  osc.frequency.exponentialRampToValueAtTime(f2,t0+dur);
  gain.gain.setValueAtTime(vol||0.15,t0);
  gain.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(t0); osc.stop(t0+dur);
}
function noise(dur,vol,filterFreq){
  if(!audioCtx||!soundOn) return;
  var t0=audioCtx.currentTime;
  var bufSize=Math.floor(audioCtx.sampleRate*dur);
  var buf=audioCtx.createBuffer(1,bufSize,audioCtx.sampleRate);
  var data=buf.getChannelData(0);
  for(var i=0;i<bufSize;i++) data[i]=(Math.random()*2-1)*Math.pow(1-i/bufSize,2);
  var src=audioCtx.createBufferSource(); src.buffer=buf;
  var gain=audioCtx.createGain(); gain.gain.setValueAtTime(vol||0.15,t0);
  gain.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  var node=src;
  if(filterFreq){
    var filter=audioCtx.createBiquadFilter();
    filter.type='lowpass'; filter.frequency.value=filterFreq;
    src.connect(filter); node=filter;
  }
  node.connect(gain); gain.connect(audioCtx.destination); src.start(t0);
}

var musicTimer=null, musicStep=0;
var TITLE_TRACK=0, GAMEPLAY_DEFAULT_TRACK=1, BOSS_TRACK=7;
function nextEnabledTrack(from){
  for(var i=1;i<=TRACKS.length;i++){
    var idx=((from+i)%TRACKS.length+TRACKS.length)%TRACKS.length;
    if(trackEnabled[idx]) return idx;
  }
  return from;
}
function musicTick(){
  if(!audioCtx||!musicOn) return;
  if(!trackEnabled[musicTrackIndex]) musicTrackIndex=nextEnabledTrack(musicTrackIndex);
  var track=TRACKS[musicTrackIndex];
  var tLen=track.lead.length;
  var step=musicStep%tLen;
  var t0=audioCtx.currentTime;
  var lf=track.lead[step];
  if(lf>0){
    var o1=audioCtx.createOscillator(), g1=audioCtx.createGain();
    o1.type=track.leadType; o1.frequency.setValueAtTime(lf,t0);
    g1.gain.setValueAtTime(0.001,t0);
    g1.gain.exponentialRampToValueAtTime(track.leadVol,t0+0.02);
    g1.gain.exponentialRampToValueAtTime(0.001,t0+track.leadDur);
    o1.connect(g1); g1.connect(audioCtx.destination);
    o1.start(t0); o1.stop(t0+track.leadDur+0.1);
  }
  var pf=track.pad[step];
  if(pf>0){
    var o2=audioCtx.createOscillator(), g2=audioCtx.createGain();
    o2.type=track.padType; o2.frequency.setValueAtTime(pf,t0);
    g2.gain.setValueAtTime(0.001,t0);
    g2.gain.exponentialRampToValueAtTime(track.padVol,t0+0.15);
    g2.gain.exponentialRampToValueAtTime(0.001,t0+track.padDur);
    o2.connect(g2); g2.connect(audioCtx.destination);
    o2.start(t0); o2.stop(t0+track.padDur+0.2);
  }
  var bf=track.bass[step];
  if(bf>0){
    var o3=audioCtx.createOscillator(), g3=audioCtx.createGain();
    o3.type=track.bassType; o3.frequency.setValueAtTime(bf,t0);
    g3.gain.setValueAtTime(0.001,t0);
    g3.gain.exponentialRampToValueAtTime(track.bassVol,t0+0.02);
    g3.gain.exponentialRampToValueAtTime(0.001,t0+0.35);
    o3.connect(g3); g3.connect(audioCtx.destination);
    o3.start(t0); o3.stop(t0+0.4);
  }
  if(track.kick[step%track.kick.length]){
    var o4=audioCtx.createOscillator(), g4=audioCtx.createGain();
    o4.type='sine';
    o4.frequency.setValueAtTime(150,t0);
    o4.frequency.exponentialRampToValueAtTime(40,t0+0.12);
    g4.gain.setValueAtTime(0.28,t0);
    g4.gain.exponentialRampToValueAtTime(0.001,t0+0.15);
    o4.connect(g4); g4.connect(audioCtx.destination);
    o4.start(t0); o4.stop(t0+0.15);
  }
  if(track.snare[step%track.snare.length]) noise(0.12,0.13,2400);
  if(track.hat[step%track.hat.length]) noise(0.025,0.035,9500);
  musicStep++;
}
function startMusic(){
  if(musicTimer) return;
  musicStep=0;
  if(!trackEnabled[musicTrackIndex]) musicTrackIndex=nextEnabledTrack(musicTrackIndex);
  var interval=60000/TRACKS[musicTrackIndex].bpm/4;
  musicTimer=setInterval(musicTick,interval);
}
function stopMusic(){if(musicTimer){clearInterval(musicTimer); musicTimer=null;}}
function setMusicTrack(idx,restart){
  musicTrackIndex=((idx%TRACKS.length)+TRACKS.length)%TRACKS.length;
  if(!trackEnabled[musicTrackIndex]) musicTrackIndex=nextEnabledTrack(musicTrackIndex);
  if(restart!==false&&musicTimer){stopMusic(); startMusic();}
  updateDOMUI();
}

function pad4(n){n=Math.floor(n); return (n<10?'000':n<100?'00':n<1000?'0':'')+n;}
function renderOnMini(miniCanvas,drawFn){
  var mctx=miniCanvas.getContext('2d');
  mctx.clearRect(0,0,miniCanvas.width,miniCanvas.height);
  mctx.imageSmoothingEnabled=true;
  var saved=ctx; ctx=mctx;
  try{drawFn(mctx);}finally{ctx=saved;}
}
function updateDOMUI(){
  uiScore.textContent=score;
  uiLevel.textContent=level;
  uiBossTag.style.display=(level%5===0&&level>0)?'block':'none';
  uiDemons.textContent=countCacodemons();
  uiHealth.textContent=pad4(Math.min(999999,score));

  uiAmmo.textContent=pad4(shotsLeft);

  uiMusic.textContent=musicOn?'🎵':'🔇';
  uiMusic.classList.toggle('off',!musicOn);

  if(slowTurnsLeft>0) statusHtml+='<div class="status-chip status-slow">SLOW '+slowTurnsLeft+'</div>';
  if(doubleShotArmed) statusHtml+='<div class="status-chip status-double">DOUBLE!</div>';
  if(blindTurnsLeft>0) statusHtml+='<div class="status-chip status-blind">BLIND '+blindTurnsLeft+'</div>';
  if(uiStatuses._last!==statusHtml){uiStatuses.innerHTML=statusHtml; uiStatuses._last=statusHtml;}
  uiPlayerName.textContent=playerName.slice(0,10);
  var leaders=loadLeaders();
  var leadersHash=JSON.stringify(leaders);
  if(uiLeaders._hash!==leadersHash){
    uiLeaders._hash=leadersHash;
    if(leaders.length===0){uiLeaders.innerHTML='<li class="empty">no souls yet</li>';}
    else{
      var cls=['gold','silver','bronze','other','other'];
      var html='';
      for(var i=0;i<leaders.length;i++){
        var e=leaders[i];
        html+='<li class="'+cls[i]+'"><span class="rank">'+(i+1)+'.</span><span class="name">'+e.name.slice(0,7)+'</span><span class="sc">'+e.score+'</span></li>';
      }

  renderOnMini(uiLoaded,function(){if(current) drawCacoAt(38,38,current.color,{bonus:current.bonus,scale:1.55});});
  renderOnMini(uiNext,function(){if(next) drawCacoAt(32,32,next.color,{bonus:next.bonus,scale:1.3});});
  renderOnMini(uiFace,function(){drawHeroHead(37,37,68,faceMood);});
}

// ============ FIELD HELPERS ============
function cellX(r,c){return FIELD_X+c*CELL+R+(r%2===0?0:R);}
function cellY(r){return FIELD_Y+r*CELL+R;}
function nearestCell(px,py){
  var best=null,bestD=Infinity;
  for(var r=0;r<ROWS;r++) for(var c=0;c<COLS;c++){
    var x=cellX(r,c),y=cellY(r);
    var d=(x-px)*(x-px)+(y-py)*(y-py);
    if(d<bestD){bestD=d; best={r:r,c:c};}
  }
  return best;
}
function neighbors(r,c){
  var res=[];
  if(r%2===0){
    res.push([r,c-1],[r,c+1]);
    if(r>0) res.push([r-1,c-1],[r-1,c]);
    if(r<ROWS-1) res.push([r+1,c-1],[r+1,c]);
  }else{
    res.push([r,c-1],[r,c+1]);
    if(r>0) res.push([r-1,c],[r-1,c+1]);
    if(r<ROWS-1) res.push([r+1,c],[r+1,c+1]);
  }
  return res.filter(function(p){return p[0]>=0&&p[0]<ROWS&&p[1]>=0&&p[1]<COLS;});
}
function findGroup(r,c){
  if(!grid[r][c]) return [];
  var color=grid[r][c].color;
  var visited={}, group=[], stack=[[r,c]];
  while(stack.length){
    var pair=stack.pop();
    var cr=pair[0], cc=pair[1];
    var key=cr+','+cc;
    if(visited[key]) continue;
    visited[key]=true;
    var b=grid[cr][cc];
    if(!b||b.color!==color) continue;
    group.push(b);
    var nbrs=neighbors(cr,cc);
    for(var i=0;i<nbrs.length;i++){
      var nr=nbrs[i][0], nc=nbrs[i][1];
      if(!visited[nr+','+nc]) stack.push([nr,nc]);
    }
  }
  return group;
}
function findFloating(){
  var connected={}, queue=[];
  for(var c=0;c<COLS;c++) if(grid[0][c]){connected['0,'+c]=true; queue.push([0,c]);}
  while(queue.length){
    var pair=queue.shift();
    var r=pair[0], cc=pair[1];
    var nbrs=neighbors(r,cc);
    for(var i=0;i<nbrs.length;i++){
      var nr=nbrs[i][0], nc=nbrs[i][1];
      var key=nr+','+nc;
      if(grid[nr][nc]&&!connected[key]){connected[key]=true; queue.push([nr,nc]);}
    }
  }
  var floating=[];
  for(var rr=0;rr<ROWS;rr++) for(var cc2=0;cc2<COLS;cc2++)
    if(grid[rr][cc2]&&!connected[rr+','+cc2]) floating.push(grid[rr][cc2]);
  return floating;
}
function isGridEmpty(){
  for(var r=0;r<ROWS;r++) for(var c=0;c<COLS;c++) if(grid[r][c]) return false;
  return true;
}
function hasPendingFallAnim(){
  for(var i=0;i<animBalls.length;i++) if(animBalls[i].type==='fall') return true;
  return false;
}
function countCacodemons(){
  var n=0;
  for(var r=0;r<ROWS;r++) for(var c=0;c<COLS;c++) if(grid[r][c]) n++;
  return n;
}

function drawBonusRing(x,y,radius,type,t){
  var vis=BONUS_VIS[type]; if(!vis) return;
  var isBad=BAD_BONUS_TYPES.indexOf(type)>=0;
  var pulse=0.85+0.15*Math.sin(t*0.15);
  if(vis.style==='rainbow'){
    var hues=['#ff0000','#ff8800','#ffff00','#00ff00','#00aaff','#cc00ff'];
    ctx.lineWidth=5;
    for(var i=0;i<6;i++){
      var a0=(i/6)*Math.PI*2+t*0.03, a1=((i+1)/6)*Math.PI*2+t*0.03;
      ctx.strokeStyle=hues[i];
      ctx.beginPath(); ctx.arc(x,y,radius,a0,a1); ctx.stroke();
    }
    return;
  }
  var col=vis.color;
  ctx.globalAlpha=0.4*pulse; ctx.strokeStyle=col; ctx.lineWidth=8;
  ctx.beginPath(); ctx.arc(x,y,radius,0,Math.PI*2); ctx.stroke();
  ctx.globalAlpha=1;
  if(vis.style==='spiky'||vis.style==='spiky-bad'){
    ctx.strokeStyle=col; ctx.lineWidth=isBad?3.5:3;
    ctx.beginPath(); ctx.arc(x,y,radius,0,Math.PI*2); ctx.stroke();
    var spikes=isBad?8:6;
    ctx.fillStyle=col;
    for(var s=0;s<spikes;s++){
      var a=(s/spikes)*Math.PI*2+t*0.04;
      var sx=x+Math.cos(a)*(radius+4), sy=y+Math.sin(a)*(radius+4);
      ctx.beginPath();
      ctx.moveTo(x+Math.cos(a-0.15)*radius,y+Math.sin(a-0.15)*radius);
      ctx.lineTo(sx,sy);
      ctx.lineTo(x+Math.cos(a+0.15)*radius,y+Math.sin(a+0.15)*radius);
      ctx.closePath(); ctx.fill();
    }
  }else if(vis.style==='beam'){
    ctx.strokeStyle=col; ctx.lineWidth=3.5;
    ctx.beginPath(); ctx.arc(x,y,radius,0,Math.PI*2); ctx.stroke();
    ctx.lineWidth=2.5;
    for(var i2=0;i2<4;i2++){
      var a2=i2*Math.PI/2;
      ctx.beginPath();
      ctx.moveTo(x+Math.cos(a2)*(radius-8),y+Math.sin(a2)*(radius-8));
      ctx.lineTo(x+Math.cos(a2)*radius,y+Math.sin(a2)*radius);
      ctx.stroke();
    }
  }else if(vis.style==='double'){
    ctx.strokeStyle=col; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(x,y,radius,0,Math.PI*2); ctx.stroke();
    ctx.lineWidth=1.8;
    ctx.beginPath(); ctx.arc(x,y,radius-5,0,Math.PI*2); ctx.stroke();
  }else if(vis.style==='up'){
    ctx.strokeStyle=col; ctx.lineWidth=3.5;
    ctx.beginPath(); ctx.arc(x,y,radius,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle=col;
    var ax=x, ay=y-radius-3;
    ctx.beginPath(); ctx.moveTo(ax-8,ay+5); ctx.lineTo(ax,ay-5); ctx.lineTo(ax+8,ay+5); ctx.closePath(); ctx.fill();
  }else if(vis.style==='down'){
    ctx.strokeStyle=col; ctx.lineWidth=3.5;
    ctx.beginPath(); ctx.arc(x,y,radius,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle=col;
    var dx=x, dy=y+radius+3;
    ctx.beginPath(); ctx.moveTo(dx-8,dy-5); ctx.lineTo(dx,dy+5); ctx.lineTo(dx+8,dy-5); ctx.closePath(); ctx.fill();
  }else if(vis.style==='dash'||vis.style==='dash-bad'){
    ctx.strokeStyle=col; ctx.lineWidth=3.5;
    ctx.setLineDash([6,5]); ctx.lineDashOffset=-t*0.5;
    ctx.beginPath(); ctx.arc(x,y,radius,0,Math.PI*2); ctx.stroke();
    ctx.setLineDash([]);
  }else if(vis.style==='wavy'){
    ctx.strokeStyle=col; ctx.lineWidth=3;
    ctx.beginPath();
    for(var ang=0;ang<Math.PI*2;ang+=0.15){
      var r2=radius+2.5*Math.sin(ang*6+t*0.1);
      var px=x+Math.cos(ang)*r2, py=y+Math.sin(ang)*r2;
      if(ang===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath(); ctx.stroke();
  }else if(vis.style==='thick-bad'){
    ctx.strokeStyle=col; ctx.lineWidth=5.5;
    ctx.beginPath(); ctx.arc(x,y,radius,0,Math.PI*2); ctx.stroke();
    ctx.lineWidth=2.5; ctx.strokeStyle='#fff';
    ctx.globalAlpha=0.5*pulse;
    ctx.beginPath(); ctx.arc(x,y,radius,0,Math.PI*2); ctx.stroke();
    ctx.globalAlpha=1;
  }else if(vis.style==='chaos'){
    ctx.strokeStyle=col; ctx.lineWidth=3;
    for(var k=0;k<3;k++){
      var offset=Math.sin(t*0.1+k*2)*3.5;
      ctx.beginPath(); ctx.arc(x,y,radius+offset,0,Math.PI*2); ctx.stroke();
    }
  }
}

// ============ LEVEL ============
function levelConfig(lv){
  if(lv<=2) return{colors:3,rows:3,dropEvery:12};
  if(lv<=4) return{colors:4,rows:3,dropEvery:11};
  if(lv<=6) return{colors:5,rows:4,dropEvery:10};
  if(lv<=8) return{colors:6,rows:4,dropEvery:9};
  return{colors:6,rows:5,dropEvery:8};
}
function bonusChance(lv){if(lv<2) return 0.20; return Math.min(0.35+(lv-2)*0.03,0.60);}
function badBonusChance(){return 0.35;}
function initGrid(){
  grid=[];
  for(var r=0;r<ROWS;r++){grid[r]=[]; for(var c=0;c<COLS;c++) grid[r][c]=null;}
}
function initLevel(){
  initGrid();
  animBalls=[]; bloodParticles=[]; floatingTexts=[]; smokePuffs=[]; sparks=[];
  screenBlood=[]; bloodLevel=0; ashParticles=[]; bloodStains=[]; bloodDrips=[];
  casings=[]; joyClouds=[]; lightningBolts=[];
  wallCracks=[]; wallBloodStreams=[]; wallBloodDrops=[];
  levelClearParticles=[];
  levelClearPending=0;
  stats._shotsThisLevel=0; stats._missThisLevel=0; stats._bonusThisLevel=false;
  var cfg=levelConfig(level);
  var usedColors=COLORS.slice(0,cfg.colors);
  var isBoss=level%5===0&&level>0;
  for(var r=0;r<cfg.rows;r++){
    for(var c=0;c<COLS;c++){
      if(Math.random()<0.92){
        var isBossCell=isBoss&&r===0&&c===Math.floor(COLS/2);
        grid[r][c]={
          color:usedColors[Math.floor(Math.random()*usedColors.length)],
          r:r,c:c,bonus:null,hurt:false,boss:isBossCell,bossHp:isBossCell?3:0,bossMaxHp:3
        };
      }
    }
  }
  var chance=bonusChance(level), placed=0;
  for(var r2=0;r2<cfg.rows&&placed<4;r2++){
    for(var c2=0;c2<COLS&&placed<4;c2++){
      if(grid[r2][c2]&&!grid[r2][c2].boss&&Math.random()<chance){
        if(Math.random()<badBonusChance()) grid[r2][c2].bonus=BAD_BONUS_TYPES[Math.floor(Math.random()*BAD_BONUS_TYPES.length)];
        else grid[r2][c2].bonus=GOOD_BONUS_TYPES[Math.floor(Math.random()*GOOD_BONUS_TYPES.length)];
        placed++;
      }
    }
  }
  current={color:pickAvailableColor(),bonus:null};
  next={color:pickAvailableColor(),bonus:null};
  aimAngle=0; aimTargetAngle=0;
  shotsSinceDrop=0; dropEvery=cfg.dropEvery;
  flying=null; flyingExtra=null;
  particles=[];
  hoverX=-1; hoverY=-1;
  bonusFlash=null; scoreSaved=false;
  slowTurnsLeft=0; doubleShotArmed=false; blindTurnsLeft=0;
  paused=false; pauseMenuMode='main'; recoil=0; muzzleFlash=0; shakeTimer=0;
  faceMood='calm'; faceMoodTimer=0;
  levelIntroTimer=120;
  for(var i=0;i<12;i++) spawnWallCrack();
  for(var i2=0;i2<10;i2++) spawnWallBloodStream();
  if(isBoss&&musicOn){setMusicTrack(BOSS_TRACK);}
  else if(musicOn&&musicTrackIndex===BOSS_TRACK) setMusicTrack(GAMEPLAY_DEFAULT_TRACK);
  Sfx.roar();
}
function pickAvailableColor(){
  var used={};
  for(var r=0;r<ROWS;r++) for(var c=0;c<COLS;c++) if(grid[r][c]) used[grid[r][c].color]=true;
  var arr=Object.keys(used);
  if(arr.length===0) return COLORS[Math.floor(Math.random()*COLORS.length)];
  return arr[Math.floor(Math.random()*arr.length)];
}

function shoot(){

  }
  for(var i2=0;i2<35;i2++){
    if(sparks.length>=MAX_PARTICLES) break;
    sparks.push({x:CANNON_X+(Math.random()-0.5)*25,y:FIELD_Y+FIELD_H+10,vx:(Math.random()-0.5)*20,vy:-Math.random()*14-3,life:35+Math.random()*25,size:2+Math.random()*3});
  }

    flyingExtra={x:CANNON_X,y:CANNON_Y,vx:Math.sin(a2)*SHOOT_SPEED,vy:-Math.cos(a2)*SHOOT_SPEED,color:next.color,bonus:next.bonus,inField:false};

function updateFlyingOne(f){
  if(!f) return null;
  var steps=4;
  for(var s=0;s<steps;s++){
    f.x+=f.vx/steps; f.y+=f.vy/steps;
    if(f.x-R<FIELD_X){f.x=FIELD_X+R; f.vx=Math.abs(f.vx);}
    if(f.x+R>FIELD_X+FIELD_W){f.x=FIELD_X+FIELD_W-R; f.vx=-Math.abs(f.vx);}
    if(f.y-R<FIELD_Y){f.y=FIELD_Y+R; return 'land';}
    if(f.y<FIELD_Y+FIELD_H) f.inField=true;
    if(f.inField){
      var cell=nearestCell(f.x,f.y);
      if(cell&&grid[cell.r][cell.c]){
        var ex=cellX(cell.r,cell.c), ey=cellY(cell.r);
        var dx=f.x-ex, dy=f.y-ey;
        if(Math.sqrt(dx*dx+dy*dy)<R*1.85) return 'land';
      }
    }
  }
  return null;
}
function updateFlying(){
  if(flying&&updateFlyingOne(flying)==='land') landBubble(flying,true);
  if(flyingExtra&&updateFlyingOne(flyingExtra)==='land') landBubble(flyingExtra,false);
}
function landBubble(f,isPrimary){
  var cell=nearestCell(f.x,f.y);
  var targetR=-1, targetC=-1;
  if(cell&&!grid[cell.r][cell.c]){targetR=cell.r; targetC=cell.c;}
  else if(cell){
    var bestD=Infinity;
    var nbrs=neighbors(cell.r,cell.c);
    for(var i=0;i<nbrs.length;i++){
      var nr=nbrs[i][0], nc=nbrs[i][1];
      if(!grid[nr][nc]){
        var d=(cellX(nr,nc)-f.x)*(cellX(nr,nc)-f.x)+(cellY(nr)-f.y)*(cellY(nr)-f.y);
        if(d<bestD){bestD=d; targetR=nr; targetC=nc;}
      }
    }
    if(targetR<0){
      outer: for(var r=0;r<ROWS;r++) for(var c=0;c<COLS;c++)
        if(!grid[r][c]){targetR=r; targetC=c; break outer;}
    }
  }
  if(targetR>=0&&targetC>=0){
    grid[targetR][targetC]={color:f.color,r:targetR,c:targetC,bonus:f.bonus,hurt:false,boss:false,bossHp:0,bossMaxHp:0};
    Sfx.stick();
    if(f.bonus){
      stats._bonusThisLevel=true;
      if(BAD_BONUS_TYPES.indexOf(f.bonus)>=0) activateBadBonus(targetR,targetC,f.bonus);
      else activateBonus(targetR,targetC,f.bonus);
    }else{
      var group=findGroup(targetR,targetC);
      if(group.length>=3){
        var bonusesToActivate=[];
        for(var i2=0;i2<group.length;i2++){
          var b=group[i2];
          if(b.bonus) bonusesToActivate.push({r:b.r,c:b.c,type:b.bonus});
        }
        score+=group.length*10;
        stats.pops++;
        if(group.length>stats.bestCombo) stats.bestCombo=group.length;
        if(group.length>=5) stats.combos5plus++;
        Sfx.cacoHit(); Sfx.pop();
        faceMood='happy'; faceMoodTimer=25;
        if(group.length>=4){
          var joyTexts=['RIP!','TEAR!','BOOM!','POP!','SLAY!','YES!','DIE!','GORE!'];
          showComboSpeech(joyTexts[Math.floor(Math.random()*joyTexts.length)]);
        }
        var bossKilledThisShot=false;
        for(var i3=0;i3<group.length;i3++){
          var bb=group[i3];
          if(bb.boss&&bb.bossHp>0){
            bb.bossHp--;
            if(bb.bossHp>0){
              bb.hurt=true; Sfx.cacoHit();
              spawnParticles(cellX(bb.r,bb.c),cellY(bb.r),'#ff2222',30);
              addPopAnim(cellX(bb.r,bb.c),cellY(bb.r),'#ff2222',null);
              floatingTexts.push({x:cellX(bb.r,bb.c),y:cellY(bb.r)-50,text:bb.bossHp+' HITS LEFT',t:0,tMax:60,color:'#ff2222'});
              continue;
            }
            bossKilledThisShot=true;
            for(var k=0;k<6;k++) addPopAnim(cellX(bb.r,bb.c)+(Math.random()-0.5)*60,cellY(bb.r)+(Math.random()-0.5)*60,'#ff2222',null);
          }
          addPopAnim(cellX(bb.r,bb.c),cellY(bb.r),bb.color,bb.bonus);
          spawnParticles(cellX(bb.r,bb.c),cellY(bb.r),bb.color,12);
          grid[bb.r][bb.c]=null;
        }
        if(bossKilledThisShot){stats.bossKills++;}
        collapseFloating();
        for(var i4=0;i4<bonusesToActivate.length;i4++){
          var bonus=bonusesToActivate[i4];
          if(BAD_BONUS_TYPES.indexOf(bonus.type)>=0) activateBadBonus(bonus.r,bonus.c,bonus.type);
          else activateBonus(bonus.r,bonus.c,bonus.type);
        }
        checkAchievements();
      }else{
        grid[targetR][targetC].hurt=true;
        spawnParticles(cellX(targetR,targetC),cellY(targetR),f.color,6);
        stats._missThisLevel++;
      }
    }
  }
  if(isPrimary) flying=null; else flyingExtra=null;
  if(isPrimary&&!flyingExtra) finishShot();
}
// ** NEW: finishShot simplified — level end is now checked in update() every frame **
function finishShot(){
  if(state!=='PLAYING') return;
  shotsSinceDrop++;
  current=next||{color:pickAvailableColor(),bonus:null};
  next=makeRandomBubble();
  collapseFloating();
  var remaining={};
  for(var r=0;r<ROWS;r++) for(var c=0;c<COLS;c++) if(grid[r][c]) remaining[grid[r][c].color]=true;
  if(Object.keys(remaining).length>0&&!remaining[current.color]) current.color=pickAvailableColor();
  if(slowTurnsLeft>0) slowTurnsLeft--;
  else if(blindTurnsLeft>0) blindTurnsLeft--;
  else if(shotsSinceDrop>=dropEvery){shotsSinceDrop=0; dropCeiling();}
}
function makeRandomBubble(){return{color:pickAvailableColor(),bonus:null};}
function collapseFloating(){
  var floating=findFloating();
  if(floating.length===0) return;
  Sfx.fall();
  for(var i=0;i<floating.length;i++){
    var f=floating[i];
    addFallAnim(cellX(f.r,f.c),cellY(f.r),f.color,f.bonus);
    grid[f.r][f.c]=null;
    score+=5;
    floatingTexts.push({x:cellX(f.r,f.c),y:cellY(f.r),text:'+5',t:0,tMax:40,color:'#8888ff'});
  }
}
function capKillList(toKill,totalOnField){
  if(toKill.length>=totalOnField&&toKill.length>1) return toKill.slice(0,Math.max(1,totalOnField-1));
  return toKill;
}
function activateBonus(r,c,type){
  bonusFlash={type:type,timer:80};
  Sfx.bonus(); Sfx.roar();
  faceMood='happy'; faceMoodTimer=35;
  spawnBonusBurst();
  stats.goodBonuses++;
  stats.bonusTypesUsed[type]=true;
  if(type==='rainbow') stats.rainbowUsed++;
  checkAchievements();
  var killCell=function(rr,cc){
    var b=grid[rr][cc]; if(!b) return;
    addPopAnim(cellX(rr,cc),cellY(rr),b.color,b.bonus);
    spawnParticles(cellX(rr,cc),cellY(rr),b.color,12);
    grid[rr][cc]=null;
  };
  if(type==='bomb'){
    var toKill=[];
    for(var dr=-1;dr<=1;dr++) for(var dc=-1;dc<=1;dc++){
      var nr=r+dr,nc=c+dc;
      if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&grid[nr][nc]) toKill.push([nr,nc]);
    }
    toKill=capKillList(toKill,countCacodemons());
    var pts=toKill.length*15; score+=pts;
    floatingTexts.push({x:cellX(r,c),y:cellY(r)-20,text:'+'+pts,t:0,tMax:60,color:'#ff8800'});
    for(var i=0;i<toKill.length;i++) killCell(toKill[i][0],toKill[i][1]);
    collapseFloating();
  }else if(type==='laser'){
    var targetColor=grid[r][c]?grid[r][c].color:(current?current.color:null);
    if(!targetColor) return;
    var toKill2=[];
    for(var rr=0;rr<ROWS;rr++) for(var cc=0;cc<COLS;cc++)
      if(grid[rr][cc]&&grid[rr][cc].color===targetColor) toKill2.push([rr,cc]);
    toKill2=capKillList(toKill2,countCacodemons());
    var pts2=toKill2.length*12; score+=pts2;
    floatingTexts.push({x:cellX(r,c),y:cellY(r)-20,text:'+'+pts2,t:0,tMax:60,color:'#00ddff'});
    for(var i2=0;i2<toKill2.length;i2++) killCell(toKill2[i2][0],toKill2[i2][1]);
    collapseFloating();
  }else if(type==='rainbow'){
    var counts={};
    for(var r1=0;r1<ROWS;r1++) for(var c1=0;c1<COLS;c1++)
      if(grid[r1][c1]) counts[grid[r1][c1].color]=(counts[grid[r1][c1].color]||0)+1;
    var bestColor=COLORS[0], bestCount=0;
    for(var col in counts) if(counts[col]>bestCount){bestCount=counts[col]; bestColor=col;}
    var anchorR=r, anchorC=c;
    if(!grid[anchorR][anchorC]){
      var found=false;
      for(var r2=0;r2<ROWS&&!found;r2++) for(var c2=0;c2<COLS&&!found;c2++)
        if(grid[r2][c2]){anchorR=r2; anchorC=c2; found=true;}
    }
    if(grid[anchorR][anchorC]) grid[anchorR][anchorC].color=bestColor;
    var group=grid[anchorR][anchorC]?findGroup(anchorR,anchorC):[];
    var groupCells=[];
    for(var gi=0;gi<group.length;gi++) groupCells.push([group[gi].r,group[gi].c]);
    groupCells=capKillList(groupCells,countCacodemons());
    var pts3=Math.max(groupCells.length,3)*15; score+=pts3;
    floatingTexts.push({x:cellX(r,c),y:cellY(r)-20,text:'+'+pts3,t:0,tMax:60,color:'#ff00ff'});
    for(var i3=0;i3<groupCells.length;i3++) killCell(groupCells[i3][0],groupCells[i3][1]);
    collapseFloating();
  }else if(type==='swap'){
    if(grid[r][c]) killCell(r,c); score+=20;
    var tmp=current; current=next; next=tmp;
    floatingTexts.push({x:cellX(r,c),y:cellY(r)-20,text:'SWAP!',t:0,tMax:60,color:'#ffff00'});
    collapseFloating();
  }else if(type==='push'){
    if(grid[r][c]) killCell(r,c); score+=30;
    for(var rr2=0;rr2<ROWS-1;rr2++) for(var cc2=0;cc2<COLS;cc2++){
      grid[rr2][cc2]=grid[rr2+1][cc2];
      if(grid[rr2][cc2]) grid[rr2][cc2].r=rr2;
    }
    for(var cc3=0;cc3<COLS;cc3++) grid[ROWS-1][cc3]=null;
    floatingTexts.push({x:cellX(r,c),y:cellY(r)-20,text:'PUSH!',t:0,tMax:60,color:'#00ff88'});
    collapseFloating();
  }else if(type==='slow'){
    if(grid[r][c]) killCell(r,c); score+=25; slowTurnsLeft=3;
    floatingTexts.push({x:cellX(r,c),y:cellY(r)-20,text:'SLOW!',t:0,tMax:60,color:'#88ccff'});
    collapseFloating();
  }else if(type==='double'){
    if(grid[r][c]) killCell(r,c); score+=25; doubleShotArmed=true;
    floatingTexts.push({x:cellX(r,c),y:cellY(r)-20,text:'DOUBLE!',t:0,tMax:60,color:'#ffaa00'});
    collapseFloating();
  }else if(type==='paint'){
    if(grid[r][c]) killCell(r,c); score+=25;
    var targetColor2=current?current.color:COLORS[0];
    var all=[];
    for(var r3=0;r3<ROWS;r3++) for(var c3=0;c3<COLS;c3++)
      if(grid[r3][c3]) all.push(grid[r3][c3]);
    for(var i4=all.length-1;i4>0;i4--){
      var j=Math.floor(Math.random()*(i4+1));
      var t=all[i4]; all[i4]=all[j]; all[j]=t;
    }

      spawnParticles(cellX(all[i5].r,all[i5].c),cellY(all[i5].r),targetColor2,4);
    }
    floatingTexts.push({x:cellX(r,c),y:cellY(r)-20,text:'PAINT x'+n,t:0,tMax:60,color:'#ff5577'});

    if(grid[r][c]) killCell(r,c);
    for(var cc4=0;cc4<COLS;cc4++) if(grid[ROWS-1][cc4]){gameOver(); return;}
    for(var rr3=ROWS-1;rr3>0;rr3--) for(var cc5=0;cc5<COLS;cc5++){
      grid[rr3][cc5]=grid[rr3-1][cc5];
      if(grid[rr3][cc5]) grid[rr3][cc5].r=rr3;
    }
    for(var cc6=0;cc6<COLS;cc6++) grid[0][cc6]=null;
    floatingTexts.push({x:cellX(r,c),y:cellY(r)-20,text:'PUSH DOWN!',t:0,tMax:80,color:'#ff0000'});
  }
}
function dropCeiling(){
  for(var c=0;c<COLS;c++) if(grid[ROWS-1][c]){gameOver(); return;}
  for(var r=ROWS-1;r>0;r--) for(var c2=0;c2<COLS;c2++){
    grid[r][c2]=grid[r-1][c2];
    if(grid[r][c2]) grid[r][c2].r=r;
  }
  for(var c3=0;c3<COLS;c3++) grid[0][c3]=null;
  for(var c4=0;c4<COLS;c4++) if(grid[ROWS-1][c4]){gameOver(); return;}
}
function checkLose(){
  if(state!=='PLAYING') return false;
  for(var c=0;c<COLS;c++){if(grid[ROWS-1][c]){gameOver(); return true;}}
  for(var r=0;r<ROWS;r++) for(var c2=0;c2<COLS;c2++)
    if(grid[r][c2]&&cellY(r)+R>LOSE_Y){gameOver(); return true;}
  var lowestRow=-1;
  for(var r2=ROWS-1;r2>=0;r2--){
    for(var c3=0;c3<COLS;c3++) if(grid[r2][c3]){lowestRow=r2; break;}
    if(lowestRow>=0) break;
  }
  if(lowestRow>=0){
    var depthRatio=lowestRow/ROWS;
    if(depthRatio>0.7) bloodLevel=Math.min(1,(depthRatio-0.7)/0.3);
    else bloodLevel=Math.max(0,bloodLevel-0.02);
    if(bloodLevel>0.1&&Math.random()<bloodLevel*0.3&&screenBlood.length<50){
      screenBlood.push({x:Math.random()*TOTAL_W,y:0,w:1+Math.random()*4,h:12+Math.random()*50,life:220,speed:0.4+Math.random()*0.6,alpha:0.5+Math.random()*0.4});
    }
  }else bloodLevel=Math.max(0,bloodLevel-0.02);
  if(lowestRow>=0&&faceMoodTimer<=0){
    if(lowestRow/ROWS>0.7) faceMood='hurt';
    else if(faceMood==='hurt') faceMood='calm';
  }
  return false;
}
function gameOver(){
  if(state==='GAME_OVER') return;
  state='GAME_OVER';
  faceMood='dead'; faceMoodTimer=99999;
  Sfx.gameOver();

}

function drawSkull(x,y){

  var pattern=[
    "..BBBBBB..",".BBBBBBBB.","BBBBBBBBBB","BBKBBBBKBB","BBKBBBBKBB",
    "BBBBKKBBBB","BBBBBBBBBB",".BBBBBBBB.","..BSBBSB...","...B..B...",
    "..RBBBBR..","...B..B...","...R..R...",".........."
  ];
  var rows=pattern.length, cols=pattern[0].length, ps=3;
  var sX=x-(cols*ps)/2, sY=y-(rows*ps)/2;

  }
}

function updateTitleEffects(){
  if(state==='START'||state==='LEGEND'||state==='ABOUT') spawnTitleFlames();
  for(var i=titleFlames.length-1;i>=0;i--){var f=titleFlames[i]; f.x+=f.vx; f.y+=f.vy; f.vy-=0.02; f.life--; f.size*=0.997; if(f.life<=0) titleFlames.splice(i,1);}
  for(var i2=titleSparks.length-1;i2>=0;i2--){var s=titleSparks[i2]; s.x+=s.vx; s.y+=s.vy; s.vy-=0.06; s.life--; if(s.life<=0) titleSparks.splice(i2,1);}
  for(var i3=titleSmoke.length-1;i3>=0;i3--){var sm=titleSmoke[i3]; sm.x+=sm.vx; sm.y+=sm.vy; sm.size+=0.2; sm.life--; if(sm.life<=0) titleSmoke.splice(i3,1);}
  for(var i4=titleEmbers.length-1;i4>=0;i4--){var e=titleEmbers[i4]; e.x+=e.vx; e.y+=e.vy; e.vy+=0.08; e.life--; if(e.life<=0) titleEmbers.splice(i4,1);}
  for(var i5=titleExplosions.length-1;i5>=0;i5--){var ex=titleExplosions[i5]; ex.r+=(ex.maxR-ex.r)*0.15; ex.life--; if(ex.life<=0) titleExplosions.splice(i5,1);}
  for(var i6=titleBloodDrips.length-1;i6>=0;i6--){var bd=titleBloodDrips[i6]; if(bd.len<bd.targetLen) bd.len+=bd.speed; bd.life--; if(bd.life<=0) titleBloodDrips.splice(i6,1);}
  for(var i7=titleHeroSmoke.length-1;i7>=0;i7--){var hs=titleHeroSmoke[i7]; hs.x+=hs.vx; hs.y+=hs.vy; hs.size+=0.15; hs.life--; if(hs.life<=0) titleHeroSmoke.splice(i7,1);}
  lightningTimer--;
  if(lightningTimer<=0){lightningTimer=120+Math.floor(Math.random()*300); lightningFlash=8; Sfx.thunder();}
  if(lightningFlash>0) lightningFlash--;
}

    }

  }

function drawAim(){
  var sx=CANNON_X, sy=CANNON_Y-50;
  var x=sx, y=sy;
  var vx=Math.sin(aimAngle)*SHOOT_SPEED;
  var vy=-Math.cos(aimAngle)*SHOOT_SPEED;
  var points=[[x,y]];
  for(var i=0;i<300;i++){
    x+=vx; y+=vy;
    if(x-R<FIELD_X){x=FIELD_X+R; vx=Math.abs(vx); points.push([x,y]);}
    if(x+R>FIELD_X+FIELD_W){x=FIELD_X+FIELD_W-R; vx=-Math.abs(vx); points.push([x,y]);}
    if(y-R<FIELD_Y){points.push([x,y]); break;}
    var cell=nearestCell(x,y);
    if(cell&&grid[cell.r][cell.c]){
      var ex=cellX(cell.r,cell.c), ey=cellY(cell.r);
      if(Math.sqrt((x-ex)*(x-ex)+(y-ey)*(y-ey))<R*1.9){points.push([x,y]); break;}
    }
    if(i%4===0) points.push([x,y]);
  }
  ctx.fillStyle='rgba(255,80,40,0.9)';
  for(var i2=0;i2<points.length;i2++) ctx.fillRect(points[i2][0]-2.5,points[i2][1]-2.5,5,5);
}

function draw(){
  ctx.clearRect(0,0,TOTAL_W,TOTAL_H);
  if(state==='LEGEND'||state==='ABOUT'){drawStartScreen(); updateOverlayVisibility(); return;}
  if(state==='START'){drawStartScreen(); updateOverlayVisibility(); return;}
  if(state==='CONFIRM'){drawStartScreen(); drawConfirmScreen(); updateOverlayVisibility(); return;}

  var shakeX=0, shakeY=0;
  if(shakeTimer>0){shakeX=(Math.random()-0.5)*6; shakeY=(Math.random()-0.5)*6; shakeTimer--;}
  ctx.save();
  ctx.translate(shakeX,shakeY);
  drawBackground();
  for(var i=0;i<bloodStains.length;i++){
    var b=bloodStains[i];
    ctx.globalAlpha=b.alpha*Math.min(1,b.life/100);
    ctx.fillStyle='#4a0000';
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.fillStyle='rgba(20,0,0,0.8)'; ctx.fillRect(FIELD_X,FIELD_Y,FIELD_W,FIELD_H);
  ctx.strokeStyle='#ff2222'; ctx.lineWidth=5;
  ctx.strokeRect(FIELD_X,FIELD_Y,FIELD_W,FIELD_H);
  ctx.strokeStyle='#8b0000'; ctx.lineWidth=2;
  ctx.strokeRect(FIELD_X+7,FIELD_Y+7,FIELD_W-14,FIELD_H-14);
  var pulse=0.6+0.4*Math.sin(cachedTimeMs/200);
  ctx.strokeStyle='rgba(255,80,80,'+(0.5+pulse*0.5)+')'; ctx.lineWidth=3;
  ctx.setLineDash([14,9]);
  ctx.beginPath(); ctx.moveTo(FIELD_X,LOSE_Y); ctx.lineTo(FIELD_X+FIELD_W,LOSE_Y); ctx.stroke();
  ctx.setLineDash([]);
  doomText('▼ LOSE',FIELD_X+60,LOSE_Y-8,17,'#ff2200');

  ctx.save();
  ctx.beginPath();
  ctx.rect(FIELD_X-R,FIELD_Y-R,FIELD_W+2*R,FIELD_H+2*R);
  ctx.clip();
  for(var r=0;r<ROWS;r++) for(var c=0;c<COLS;c++)
    if(grid[r][c]&&!grid[r][c].boss)
      drawCacoAt(cellX(r,c),cellY(r),grid[r][c].color,{hurt:grid[r][c].hurt,bonus:grid[r][c].bonus,scale:1,boss:false});
  for(var r2=0;r2<ROWS;r2++) for(var c2=0;c2<COLS;c2++)
    if(grid[r2][c2]&&grid[r2][c2].boss)
      drawCacoAt(cellX(r2,c2),cellY(r2),grid[r2][c2].color,{hurt:grid[r2][c2].hurt,bonus:grid[r2][c2].bonus,scale:1,boss:true,bossHp:grid[r2][c2].bossHp});
  if(flying) drawCacoAt(flying.x,flying.y,flying.color,{bonus:flying.bonus,scale:1});
  if(flyingExtra) drawCacoAt(flyingExtra.x,flyingExtra.y,flyingExtra.color,{bonus:flyingExtra.bonus,scale:1});
  for(var i2=0;i2<animBalls.length;i2++){
    var a=animBalls[i2];
    if(a.type==='death'){
      var p=a.t/a.tMax;
      drawDeathFrame(a.x,a.y,a.color,p);
    }else if(a.type==='fall'){
      drawCacoAt(a.x,a.y,a.color,{bonus:a.bonus,scale:1});
    }
  }
  ctx.restore();

  for(var i3=0;i3<bloodParticles.length;i3++){
    var p2=bloodParticles[i3];
    ctx.globalAlpha=p2.life/p2.maxLife;
    ctx.fillStyle=p2.color||'#8b0000';
    ctx.fillRect(p2.x-p2.size/2,p2.y-p2.size/2,p2.size,p2.size);
  }
  ctx.globalAlpha=1;
  for(var i4=0;i4<particles.length;i4++){
    var p3=particles[i4]; ctx.globalAlpha=p3.life/p3.maxLife;
    ctx.fillStyle=p3.color; ctx.fillRect(p3.x-2,p3.y-2,4,4);
  }
  ctx.globalAlpha=1;
  for(var i5=0;i5<sparks.length;i5++){
    var sp=sparks[i5]; ctx.globalAlpha=Math.min(1,sp.life/30);
    ctx.fillStyle='#ffff88';
    ctx.fillRect(sp.x-sp.size/2,sp.y-sp.size/2,sp.size,sp.size);
  }
  ctx.globalAlpha=1;
  for(var i7=0;i7<floatingTexts.length;i7++){
    var ft=floatingTexts[i7];
    ctx.globalAlpha=1-ft.t/ft.tMax;
    ctx.strokeStyle='#000'; ctx.lineWidth=3;
    ctx.font='bold 18px monospace'; ctx.textAlign='center';
    ctx.strokeText(ft.text,ft.x,ft.y);
    ctx.fillStyle=ft.color; ctx.fillText(ft.text,ft.x,ft.y);
    ctx.globalAlpha=1;
  }
  if(state==='PLAYING'&&!flying&&!flyingExtra&&current&&hoverX>=0&&!paused&&levelIntroTimer<=0&&blindTurnsLeft<=0&&levelClearPending<=0) drawAim();
  if(blindTurnsLeft>0&&state==='PLAYING'){
    ctx.fillStyle='rgba(120,60,200,0.15)'; ctx.fillRect(FIELD_X,FIELD_Y,FIELD_W,FIELD_H);
    doomText('BLINDED x'+blindTurnsLeft,FIELD_X+FIELD_W/2,FIELD_Y+28,20,'#8844ff');
  }
  if((state==='PLAYING'&&levelIntroTimer<=0)||state==='LEVEL_CLEAR'||state==='GAME_OVER') drawShotgun();
  if(bonusFlash&&bonusFlash.timer>0){
    bonusFlash.timer--;
    var t2=bonusFlash.timer/80;
    var isBad=BAD_BONUS_TYPES.indexOf(bonusFlash.type)>=0;
    var bounce=1+0.2*Math.sin(bonusFlash.timer/3);
    ctx.save();
    ctx.translate(FIELD_X+FIELD_W/2,FIELD_Y+FIELD_H/2);
    ctx.scale(bounce,bounce);
    ctx.globalAlpha=Math.min(1,t2*2);
    var sym=BONUS_SYMBOLS[bonusFlash.type]||'!';
    var col=isBad?'#ff0000':(BONUS_VIS[bonusFlash.type]&&BONUS_VIS[bonusFlash.type].color?BONUS_VIS[bonusFlash.type].color:'#fff');
    doomText(sym,0,20,120,col);
    ctx.restore();
    ctx.globalAlpha=1;
  }
  if(bloodLevel>=0.05){
    ctx.globalAlpha=bloodLevel*0.5; ctx.fillStyle='#8b0000'; ctx.fillRect(0,0,TOTAL_W,TOTAL_H);
    ctx.globalAlpha=1;
    for(var i8=0;i8<screenBlood.length;i8++){
      var sb2=screenBlood[i8]; ctx.globalAlpha=sb2.alpha;
      ctx.fillStyle='#8b0000'; ctx.fillRect(sb2.x,sb2.y,sb2.w,sb2.h);
      ctx.beginPath(); ctx.arc(sb2.x+sb2.w/2,sb2.y+sb2.h,sb2.w*0.8,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha=1;
    }
    for(var i9=0;i9<bloodDrips.length;i9++){
      var bd=bloodDrips[i9];
      ctx.globalAlpha=bd.alpha*(bd.life/bd.maxLife);
      ctx.fillStyle='#8b0000';
      ctx.fillRect(bd.x-bd.size/2,bd.y-bd.size/2,bd.size,bd.size*1.5);
      ctx.globalAlpha=1;
    }
  }
  if(paused&&state==='PLAYING'&&levelIntroTimer<=0) drawPauseMenu();
  if(state==='LEVEL_CLEAR') drawLevelClear();
  if(state==='GAME_OVER') drawGameOver();
  if(state==='PLAYING'&&levelIntroTimer>0) drawLevelIntro();
  ctx.restore();
  updateOverlayVisibility();
}
function updateOverlayVisibility(){
  if(state==='PLAYING'){overlay.style.display='block'; updateDOMUI();}
  else overlay.style.display='none';
}

// ============ UPDATE — с проверкой завершения уровня каждый кадр ============
function update(){
  timeMs+=16; cachedTimeMs=timeMs;
  updateHeroAnim();
  updateParticles();
  updateAnimBalls();
  var diff=aimTargetAngle-aimAngle;
  aimAngle+=diff*0.25;
  if(faceMoodTimer>0){
    faceMoodTimer--;
    if(faceMoodTimer===0&&faceMood!=='dead'&&faceMood!=='hurt') faceMood='calm';
  }
  if(state==='START'||state==='LEGEND'||state==='ABOUT') updateTitleEffects();
  if(state!=='PLAYING') return;
  if(levelIntroTimer>0){levelIntroTimer--; return;}
  if(paused) return;

  // ** Level clear pending delay — показываем "LEVEL CLEARED" **
  if(levelClearPending>0){
    levelClearPending--;
    if(levelClearPending<=0){
      levelClearPending=0;
      state='LEVEL_CLEAR';
    }
    return;
  }

  updateFlying();
  checkLose();

  // ** Проверка завершения уровня КАЖДЫЙ кадр — фикс главного бага **
  if(state==='PLAYING' && !flying && !flyingExtra && isGridEmpty() && !hasPendingFallAnim()){
    triggerLevelComplete();
  }
}
function updateAnimBalls(){
  for(var i=animBalls.length-1;i>=0;i--){
    var a=animBalls[i]; a.t++;
    if(a.type==='fall'){a.x+=a.vx; a.y+=a.vy; a.vy+=0.6; if(a.y>TOTAL_H+60) animBalls.splice(i,1);}
    else if(a.type==='death'){if(a.t>=a.tMax) animBalls.splice(i,1);}
  }
  for(var i2=bloodParticles.length-1;i2>=0;i2--){
    var p=bloodParticles[i2]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.4; p.life--;
    if(p.life<=0) bloodParticles.splice(i2,1);
  }
  for(var i3=sparks.length-1;i3>=0;i3--){
    var sp=sparks[i3]; sp.x+=sp.vx; sp.y+=sp.vy; sp.vy+=0.35; sp.life--;
    if(sp.life<=0||sp.y>TOTAL_H+50) sparks.splice(i3,1);
  }
  for(var i4=floatingTexts.length-1;i4>=0;i4--){
    var ft=floatingTexts[i4]; ft.t++; ft.y-=0.8;
    if(ft.t>=ft.tMax) floatingTexts.splice(i4,1);
  }
  for(var i5=smokePuffs.length-1;i5>=0;i5--){
    var s=smokePuffs[i5]; s.t++; s.x+=s.vx; s.y+=s.vy; s.vy-=0.1;
    if(s.t>=s.tMax) smokePuffs.splice(i5,1);
  }
  for(var i6=bloodStains.length-1;i6>=0;i6--){
    var b=bloodStains[i6]; if(b.life<999&&b.life>0) b.life--; if(b.life===0) bloodStains.splice(i6,1);
  }
  for(var i7=casings.length-1;i7>=0;i7--){
    var c=casings[i7]; c.x+=c.vx; c.y+=c.vy; c.vy+=0.5; c.rot+=c.rotSpd; c.life--;
    if(c.life<=0||c.y>TOTAL_H+20) casings.splice(i7,1);
  }
  for(var i9=bloodDrips.length-1;i9>=0;i9--){
    var bd=bloodDrips[i9]; bd.y+=bd.vy; bd.life--;
    if(bd.life<=0||bd.y>TOTAL_H) bloodDrips.splice(i9,1);
  }
  for(var i10=screenBlood.length-1;i10>=0;i10--){
    var sb=screenBlood[i10]; sb.y+=sb.speed; sb.life--;
    if(sb.life<=0||sb.y>TOTAL_H) screenBlood.splice(i10,1);
  }
  if(Math.random()<0.4&&ashParticles.length<MAX_PARTICLES){
    ashParticles.push({x:Math.random()*TOTAL_W,y:FIELD_Y+FIELD_H+20,vx:(Math.random()-0.5)*1.2,vy:-0.4-Math.random()*1,life:200+Math.random()*200,maxLife:200+Math.random()*200,size:1+Math.random()*2});
  }
  for(var i11=ashParticles.length-1;i11>=0;i11--){
    var a2=ashParticles[i11]; a2.x+=a2.vx; a2.y+=a2.vy; a2.life--;
    if(a2.life<=0||a2.y<FIELD_Y-100) ashParticles.splice(i11,1);
  }
  if(Math.random()<0.15&&lavaBubbles.length<30){
    lavaBubbles.push({x:Math.random()*TOTAL_W,y:TOTAL_H-HUD_H+10,r:3+Math.random()*6,life:100,maxLife:100});
  }
  for(var i12=lavaBubbles.length-1;i12>=0;i12--){
    var lb=lavaBubbles[i12]; lb.y-=0.7; lb.life--;
    if(lb.life<=0) lavaBubbles.splice(i12,1);
  }
  for(var i13=wallCracks.length-1;i13>=0;i13--){
    var wc=wallCracks[i13]; wc.life--;
    if(wc.life<=0) wallCracks.splice(i13,1);
  }
  if(Math.random()<0.08) spawnWallCrack();
  for(var i14=wallBloodStreams.length-1;i14>=0;i14--){
    var wbs=wallBloodStreams[i14];
    wbs.life--;
    if(wbs.len<wbs.maxLen) wbs.len+=0.4;
    if(wbs.len>=wbs.maxLen&&Math.random()<0.02){
      wallBloodDrops.push({x:wbs.x+(Math.random()-0.5)*2,y:wbs.y+wbs.maxLen,vy:1+Math.random()*2,size:2+Math.random()*2,life:300});
    }
    if(wbs.life<=0) wallBloodStreams.splice(i14,1);
  }
  if(Math.random()<0.12&&wallBloodStreams.length<14) spawnWallBloodStream();
  for(var i15=wallBloodDrops.length-1;i15>=0;i15--){
    var wbd=wallBloodDrops[i15];
    wbd.y+=wbd.vy; wbd.vy+=0.05; wbd.life--;
    if(wbd.life<=0||wbd.y>TOTAL_H) wallBloodDrops.splice(i15,1);
  }
  for(var i16=lightningBolts.length-1;i16>=0;i16--){
    lightningBolts[i16].life--;
    if(lightningBolts[i16].life<=0) lightningBolts.splice(i16,1);
  }
  if(Math.random()<0.04) spawnLightningBolt();
  if(state==='PLAYING'&&!paused){
    ambientSparkTimer++;
    if(ambientSparkTimer>2&&sparks.length<MAX_PARTICLES){
      ambientSparkTimer=0;
      for(var i17=0;i17<3;i17++){
        if(sparks.length>=MAX_PARTICLES) break;
        sparks.push({x:Math.random()*TOTAL_W,y:FIELD_Y+FIELD_H+10+Math.random()*30,vx:(Math.random()-0.5)*2,vy:-2-Math.random()*3,life:40+Math.random()*40,size:1+Math.random()*2});
      }
    }
  }
  faceBlinkTimer++;
  if(faceBlinkTimer>100){faceBlinkTimer=0; faceBlinkState=!faceBlinkState;}
}
function spawnParticles(x,y,color,count){
  for(var i=0;i<count;i++){
    if(particles.length>=MAX_PARTICLES) break;
    particles.push({x:x,y:y,vx:(Math.random()-0.5)*8,vy:(Math.random()-0.5)*8-1,life:30,maxLife:30,color:color});
  }
}
function updateParticles(){
  for(var i=particles.length-1;i>=0;i--){
    var p=particles[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.25; p.life--;
    if(p.life<=0) particles.splice(i,1);
  }
}
function clientToField(clientX,clientY){
  var rect=canvas.getBoundingClientRect();
  return {
    x:(clientX-rect.left)*(TOTAL_W/rect.width),
    y:(clientY-rect.top)*(TOTAL_H/rect.height)
  };
}
function updateAimTarget(x,y){
  var dx=x-CANNON_X, dy=y-CANNON_Y;
  var a=Math.atan2(dx,-dy);
  var max=Math.PI/2.3;
  a=Math.max(-max,Math.min(max,a));
  aimTargetAngle=a;
}

// ============ DOM BUTTONS ============
function domClick(fn){
  return function(e){
    e.preventDefault(); e.stopPropagation();
    initAudio(); resumeAudio();
    if(musicOn&&!musicTimer) startMusic();
    fn();
  };
}
uiSound.addEventListener('click',domClick(function(){soundOn=!soundOn; if(soundOn) Sfx.click(); updateDOMUI();}));
uiMusic.addEventListener('click',domClick(function(){musicOn=!musicOn; if(musicOn) startMusic(); else stopMusic(); Sfx.click(); updateDOMUI();}));
uiTrack.addEventListener('click',domClick(function(){setMusicTrack(nextEnabledTrack(musicTrackIndex)); Sfx.click();}));
uiLegend.addEventListener('click',domClick(function(){legendReturnState=state; state='LEGEND'; legendScroll=0; legendTargetScroll=0; Sfx.click();}));
uiAbout.addEventListener('click',domClick(function(){legendReturnState=state; state='ABOUT'; Sfx.click();}));
uiPause.addEventListener('click',domClick(function(){paused=!paused; pauseMenuMode='main'; Sfx.click();}));
uiDownload.addEventListener('click',domClick(function(){downloadGame();}));
function openVK(){
  Sfx.click();
  try{var w=window.open(VK_URL,'_blank','noopener,noreferrer'); if(!w) window.location.href=VK_URL;}catch(e){window.location.href=VK_URL;}
}
function downloadGame(){
  try{
    var html='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
    var blob=new Blob([html],{type:'text/html;charset=utf-8'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url; a.download='cacobubble.html';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url);},1000);
    Sfx.click();
  }catch(e){alert('Download failed: '+e.message);}
}

// ============ INPUT ============
function handleTap(clientX,clientY){
  initAudio(); resumeAudio();
  if(musicOn&&!musicTimer) startMusic();
  var p=clientToField(clientX,clientY);

  if(state==='LEGEND'||state==='ABOUT'){
    if(state==='ABOUT'&&vkLinkRect&&p.x>=vkLinkRect.x&&p.x<=vkLinkRect.x+vkLinkRect.w&&p.y>=vkLinkRect.y&&p.y<=vkLinkRect.y+vkLinkRect.h){openVK(); return;}
    var bx=TOTAL_W/2-110, by=TOTAL_H-72, bw=220, bh=52;
    if(p.x>=bx&&p.x<=bx+bw&&p.y>=by&&p.y<=by+bh){
      state=legendReturnState||'START';
      if(state==='PLAYING') paused=true;
      Sfx.click();
    }
    return;
  }
  if(paused&&state==='PLAYING'&&levelIntroTimer<=0){
    if(pauseMenuMode==='main'){
      var menuX=FIELD_X+FIELD_W/2, startY=FIELD_Y+150;
      for(var i=0;i<5;i++){
        var y=startY+i*48;
        if(p.x>=menuX-150&&p.x<=menuX+150&&p.y>=y-22&&p.y<=y+16){
          if(i===0){paused=false;}
          else if(i===1){paused=false; score=0; level=1; initLevel(); state='PLAYING';}
          else if(i===2){pauseMenuMode='music';}
          else if(i===3){soundOn=!soundOn;}
          else if(i===4){paused=false; state='START'; setMusicTrack(TITLE_TRACK);}
          Sfx.click(); return;
        }
      }
    }else if(pauseMenuMode==='music'){
      var listX=FIELD_X+30, listY=FIELD_Y+95, rowH=36;
      var bx2=FIELD_X+FIELD_W/2-100, by2=FIELD_Y+FIELD_H-52;
      if(p.x>=bx2&&p.x<=bx2+200&&p.y>=by2&&p.y<=by2+42){pauseMenuMode='main'; Sfx.click(); return;}
      for(var t=0;t<TRACKS.length;t++){
        var ry=listY+t*rowH;
        if(p.x>=listX&&p.x<=listX+28&&p.y>=ry-2&&p.y<=ry+22){
          trackEnabled[t]=!trackEnabled[t];
          if(!trackEnabled[musicTrackIndex]&&musicTimer){setMusicTrack(nextEnabledTrack(musicTrackIndex));}
          Sfx.click(); return;
        }
        if(p.x>=listX+36&&p.x<=listX+340&&p.y>=ry-2&&p.y<=ry+22){
          if(trackEnabled[t]){setMusicTrack(t); Sfx.click();}
          return;
        }
      }
    }
    return;
  }
  if(state==='START'){
    var bigBtnW=460, bigBtnH=96;
    var bigBtnX=TOTAL_W/2-bigBtnW/2;
    var bigBtnY=TOTAL_H*0.47;
    if(p.x>=bigBtnX&&p.x<=bigBtnX+bigBtnW&&p.y>=bigBtnY&&p.y<=bigBtnY+bigBtnH){
      state='CONFIRM'; Sfx.click(); return;
    }
    var btnW=220, btnH=44;
    var btnX=TOTAL_W/2-btnW/2;
    var btnStartY=bigBtnY+bigBtnH+30;
    for(var j=0;j<2;j++){
      var by3=btnStartY+j*(btnH+8);
      if(p.x>=btnX&&p.x<=btnX+btnW&&p.y>=by3&&p.y<=by3+btnH){
        if(j===0) state='ABOUT';
        else if(j===1){state='LEGEND'; legendScroll=0; legendTargetScroll=0;}
        Sfx.click(); return;
      }
    }
    return;
  }
  if(state==='CONFIRM'){
    var byC=TOTAL_H/2+195;
    var bwC=160, bhC=64, gapC=44;
    var daX=TOTAL_W/2-bwC-gapC/2;
    var netX=TOTAL_W/2+gapC/2;
    if(p.x>=daX&&p.x<=daX+bwC&&p.y>=byC&&p.y<=byC+bhC){
      clearTitleEffects();
      setMusicTrack(GAMEPLAY_DEFAULT_TRACK);
      state='PLAYING'; score=0; level=1;
      stats={pops:0,bestCombo:0,goodBonuses:0,badBonuses:0,levelsCleared:0,bossKills:0,combos5plus:0,rainbowUsed:0,perfectLevels:0,bonusTypesUsed:{},levelsWithNoBonus:0,blindWins:0,speedClears:0,_shotsThisLevel:0,_missThisLevel:0,_bonusThisLevel:false};
      unlockedAchievements={};
      initLevel();
      Sfx.click(); return;
    }
    if(p.x>=netX&&p.x<=netX+bwC&&p.y>=byC&&p.y<=byC+bhC){
      clearTitleEffects(); state='START'; Sfx.click(); return;
    }
    return;
  }
  if(state==='GAME_OVER'){state='START'; score=0; level=1; setMusicTrack(TITLE_TRACK); Sfx.click(); return;}
  if(state==='LEVEL_CLEAR'){level++; initLevel(); state='PLAYING'; Sfx.click(); return;}
  if(levelIntroTimer>0) return;
  if(levelClearPending>0) return;  // блок ввода во время pending
  if(p.x<FIELD_X||p.x>FIELD_X+FIELD_W) return;
  if(p.y>FIELD_Y+FIELD_H+20) return;
  if(state==='PLAYING'){
    if(paused){paused=false; Sfx.click(); return;}
    updateAimTarget(p.x,p.y); aimAngle=aimTargetAngle;
    hoverX=p.x; hoverY=p.y;
    shoot();
  }
}
canvas.addEventListener('touchstart',function(e){
  e.preventDefault();
  var t=e.changedTouches[0]; if(!t) return;
  if(state==='LEGEND'){
    var p=clientToField(t.clientX,t.clientY);
    var bx=TOTAL_W/2-110, by=TOTAL_H-72, bw=220, bh=52;
    if(p.x>=bx&&p.x<=bx+bw&&p.y>=by&&p.y<=by+bh){
      state=legendReturnState||'START';
      if(state==='PLAYING') paused=true;
      Sfx.click(); return;
    }
    legendTouchStartY=t.clientY; legendTouchStartScroll=legendTargetScroll;
    return;
  }
  handleTap(t.clientX,t.clientY);
},{passive:false});
canvas.addEventListener('touchmove',function(e){
  e.preventDefault();
  if(state==='LEGEND'&&e.touches.length>0){
    var dy=legendTouchStartY-e.touches[0].clientY;
    legendTargetScroll=Math.max(0,legendTouchStartScroll+dy*1.5);
  }
},{passive:false});
canvas.addEventListener('mousedown',function(e){e.preventDefault(); handleTap(e.clientX,e.clientY);});
canvas.addEventListener('mousemove',function(e){
  if(state==='PLAYING'&&!flying&&!flyingExtra&&!paused&&levelIntroTimer<=0&&levelClearPending<=0){
    var p=clientToField(e.clientX,e.clientY);
    if(p.x>FIELD_X&&p.x<FIELD_X+FIELD_W&&p.y<FIELD_Y+FIELD_H){
      updateAimTarget(p.x,p.y); hoverX=p.x; hoverY=p.y;
    }
  }
});
canvas.addEventListener('mouseleave',function(){hoverX=-1; hoverY=-1;});
canvas.addEventListener('wheel',function(e){
  if(state==='LEGEND'){e.preventDefault(); legendTargetScroll+=e.deltaY*0.8;}
},{passive:false});
document.addEventListener('touchmove',function(e){if(state!=='LEGEND') e.preventDefault();},{passive:false});
document.addEventListener('gesturestart',function(e){e.preventDefault();});
window.addEventListener('keydown',function(e){
  if(e.key==='p'||e.key==='P'||e.key==='Escape'){
    if(state==='PLAYING'&&levelIntroTimer<=0){paused=!paused; pauseMenuMode='main'; Sfx.click();}
    else if(state==='LEGEND'||state==='ABOUT'){
      state=legendReturnState||'START';
      if(state==='PLAYING') paused=true;
      Sfx.click();
    }
  }
  if(e.key==='m'||e.key==='M'){soundOn=!soundOn; if(soundOn) Sfx.click();}
});

var nameOverlay=document.getElementById('nameOverlay');
var nameInput=document.getElementById('nameInput');
var nameStart=document.getElementById('nameStart');
function showNameOverlay(){
  if(nameOverlayShown) return;
  nameOverlayShown=true;
  nameInput.value=loadPlayerName();
  var cacoBacks=['#ff0044','#dd00ff','#0088ff','#00ff44'];
  var positions=[
    {left:'4%',top:'12%',size:180,delay:0},
    {right:'4%',top:'15%',size:160,delay:1},
    {left:'6%',bottom:'10%',size:150,delay:2},
    {right:'6%',bottom:'12%',size:170,delay:0.5}
  ];
  var old=nameOverlay.querySelectorAll('.caco-deco');
  for(var k=0;k<old.length;k++) old[k].remove();
  for(var i=0;i<positions.length;i++){
    var pos=positions[i];
    var spr=createCacoSprite(cacoBacks[i],false,false);
    var cvs=document.createElement('canvas');
    cvs.width=spr.w; cvs.height=spr.h;
    var c=cvs.getContext('2d');
    c.imageSmoothingEnabled=true;
    c.drawImage(spr.canvas,0,0);
    var img=document.createElement('img');
    img.src=cvs.toDataURL();
    img.className='caco-deco';
    if(pos.left) img.style.left=pos.left;
    if(pos.right) img.style.right=pos.right;
    if(pos.top) img.style.top=pos.top;
    if(pos.bottom) img.style.bottom=pos.bottom;
    img.style.width=pos.size+'px';
    img.style.height=pos.size+'px';
    img.style.animationDelay=pos.delay+'s';
    nameOverlay.appendChild(img);
  }
  nameOverlay.classList.add('show');
  setTimeout(function(){nameInput.focus();},100);
}
function hideNameOverlay(){nameOverlay.classList.remove('show');}
nameStart.addEventListener('click',function(){
  var v=(nameInput.value||'').trim().slice(0,12)||'DOOMGUY';
  playerName=v; savePlayerName(v);
  hideNameOverlay();
  initAudio(); resumeAudio();
  setMusicTrack(TITLE_TRACK);
  if(musicOn) startMusic();
  Sfx.click();
});
nameInput.addEventListener('keydown',function(e){if(e.key==='Enter') nameStart.click();});

function loop(){update(); draw(); requestAnimationFrame(loop);}
fitCanvas(); initGrid(); loop();
setTimeout(showNameOverlay,200);
})();
