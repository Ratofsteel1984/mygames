let actx=null,master=null,musicGain=null,sfxGain=null,mstep=0,hatBuf=null;

let musicOn=true,sfxOn=true;

const MUSIC_DEFS={
  city:{bpm:100,chords:[[220,261.63,329.63],[174.61,220,261.63],[130.81,164.81,196],[196,246.94,293.66]],bass:[110,87.31,65.41,98],drum:'4/4',lead:'sparse'},

function initAudio(){
  if(!actx){
    try{actx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
    master=actx.createGain();master.gain.value=0.35;
    const filt=actx.createBiquadFilter();filt.type='lowpass';filt.frequency.value=5200;
    master.connect(filt);filt.connect(actx.destination);
    musicGain=actx.createGain();musicGain.gain.value=musicOn?0.28:0;musicGain.connect(master);
    sfxGain=actx.createGain();sfxGain.gain.value=sfxOn?0.45:0;sfxGain.connect(master);
    hatBuf=actx.createBuffer(1,2048,actx.sampleRate);
    const d=hatBuf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }
  if(actx.state==='suspended'){actx.resume().then(()=>{if(!musicInterval)startMusicLoop();}).catch(()=>{});}
  else if(!musicInterval)startMusicLoop();
}
function startMusicLoop(){if(musicInterval){clearInterval(musicInterval);musicInterval=null;}const bpm=MUSIC_DEFS[musicTheme].bpm;musicInterval=setInterval(musicStep,(60000/bpm)/4);}
function setMusicTheme(t){if(musicTheme===t&&musicInterval)return;musicTheme=t;mstep=0;if(musicInterval){clearInterval(musicInterval);musicInterval=null;}if(actx&&musicOn)startMusicLoop();}
function setMusicOn(v){musicOn=v;try{localStorage.setItem('vhs_music',v?'1':'0');}catch(e){}if(musicGain)musicGain.gain.value=v?0.28:0;if(v&&actx&&!musicInterval)startMusicLoop();if(!v&&musicInterval){clearInterval(musicInterval);musicInterval=null;}}
function setSfxOn(v){sfxOn=v;try{localStorage.setItem('vhs_sfx',v?'1':'0');}catch(e){}if(sfxGain)sfxGain.gain.value=v?0.45:0;}
function tone(freq,t,dur,type,vol,dest){if(!actx)return;const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);o.connect(g);g.connect(dest||musicGain||master);g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.start(t);o.stop(t+dur+0.05);}
function kick(t,strong){if(!actx)return;const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.setValueAtTime(strong?170:150,t);o.frequency.exponentialRampToValueAtTime(42,t+0.13);g.gain.setValueAtTime(strong?0.55:0.4,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.22);o.connect(g);g.connect(musicGain);o.start(t);o.stop(t+0.26);}
function hat(t,vol){if(!actx||!hatBuf)return;vol=vol||0.07;const s=actx.createBufferSource();s.buffer=hatBuf;const f=actx.createBiquadFilter();f.type='highpass';f.frequency.value=7500;const g=actx.createGain();s.connect(f);f.connect(g);g.connect(musicGain);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.05);s.start(t);s.stop(t+0.07);}
function snare(t,vol){if(!actx||!hatBuf)return;vol=vol||0.26;const s=actx.createBufferSource();s.buffer=hatBuf;const f=actx.createBiquadFilter();f.type='bandpass';f.frequency.value=1700;f.Q.value=0.7;const g=actx.createGain();s.connect(f);f.connect(g);g.connect(musicGain);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.17);s.start(t);s.stop(t+0.2);}
function musicStep(){
  if(!actx||actx.state!=='running'||!musicOn)return;
  if(state==='dead')return;
  const def=MUSIC_DEFS[musicTheme];
  const t=actx.currentTime+0.05;
  const step=mstep%16,bar=Math.floor(mstep/16)%4;
  const ch=def.chords[bar],bassRoot=def.bass[bar],d=def.drum;
  if(d==='4/4'||d==='triumphant'||d==='poppy'){if(step%4===0)kick(t,step===0);if(step===4||step===12)snare(t,d==='triumphant'?0.32:0.26);if(step%4===2)hat(t,0.10);if(step%2===1)hat(t,0.035);}
  else if(d==='soft'){if(step%4===0)kick(t,false);if(step===4||step===12)snare(t,0.18);if(step%2===0)hat(t,0.055);}
  else if(d==='industrial'){if(step%4===0)kick(t,true);if(step===4||step===12)snare(t,0.30);if(step%2===0)hat(t,0.06);}
  else if(d==='fast'){if(step%2===0)kick(t,false);if(step===4||step===12)snare(t,0.24);if(step%2===1)hat(t,0.08);}
  const bassPat=[1,0,0,1,0,0,1,0,1,0,0,1,0,1,0,1];
  if(bassPat[step]){tone(bassRoot,t,0.17,'sawtooth',0.20);tone(bassRoot*0.997,t,0.17,'sawtooth',0.10);}
  if(step===0)ch.forEach(f=>{tone(f,t,2.35,'sawtooth',0.017);tone(f*1.005,t,2.35,'sawtooth',0.014);});
  if(step%2===0){const ap=[0,1,2,1,0,2,1,2];const f=ch[ap[(step/2)%8]%ch.length]*2;tone(f,t,0.13,'square',0.026);}
  let leadPat=[null,null,null,null,null,null,0,null,null,null,2,null,1,null,3,null];
  if(def.lead==='happy')leadPat=[0,null,2,null,1,null,3,null,2,null,0,null,3,null,1,null];
  if(def.lead==='epic')leadPat=[0,null,null,2,null,1,null,null,3,null,null,2,null,3,null,4];
  if(def.lead==='dark')leadPat=[null,null,0,null,1,null,null,2,null,null,1,null,0,null,2,null];
  if(def.lead==='airy')leadPat=[0,null,null,null,1,null,null,null,2,null,null,null,3,null,null,null];
  const leadNotes=[ch[2]*2,ch[1]*2,ch[0]*2,ch[1]*2.5,ch[2]*2.5];
  const lp=leadPat[step];
  if(lp!==null&&lp<leadNotes.length){tone(leadNotes[lp],t,0.42,'triangle',0.058);tone(leadNotes[lp]*1.008,t,0.42,'sawtooth',0.020);}
  mstep++;
}
function sfx(type){

  const t=actx.currentTime;
  if(type==='shot'){tone(880,t,0.08,'square',0.10,sfxGain);tone(440,t,0.12,'sawtooth',0.07,sfxGain);}
  else if(type==='hit')tone(160,t,0.16,'sawtooth',0.14,sfxGain);
  else if(type==='kill'){tone(200,t,0.1,'square',0.12,sfxGain);tone(120,t+0.06,0.18,'sawtooth',0.10,sfxGain);}

  else if(type==='pickup'){tone(660,t,0.07,'square',0.09,sfxGain);tone(990,t+0.06,0.10,'square',0.08,sfxGain);}
  else if(type==='star'){tone(880,t,0.05,'square',0.08,sfxGain);tone(1320,t+0.05,0.06,'square',0.07,sfxGain);}
  else if(type==='bonus')[523,659,784,1047,1319].forEach((f,i)=>tone(f,t+i*0.07,0.3,'square',0.09,sfxGain));
  else if(type==='combo'){tone(1200,t,0.05,'square',0.09,sfxGain);tone(1800,t+0.04,0.06,'square',0.07,sfxGain);}
  else if(type==='hurt'){tone(220,t,0.2,'sawtooth',0.13,sfxGain);tone(110,t+0.05,0.25,'square',0.09,sfxGain);}
  else if(type==='win')[523,659,784,1047].forEach((f,i)=>tone(f,t+i*0.11,0.4,'square',0.10,sfxGain));
  else if(type==='arcade')[523,659,784].forEach((f,i)=>tone(f,t+i*0.08,0.15,'square',0.10,sfxGain));
  else if(type==='mgwin')[523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,t+i*0.08,0.3,'square',0.10,sfxGain));
  else if(type==='mglose'){tone(220,t,0.15,'square',0.10,sfxGain);tone(165,t+0.1,0.2,'square',0.10,sfxGain);}
  else if(type==='bossHit'){tone(90,t,0.3,'sawtooth',0.18,sfxGain);tone(60,t+0.1,0.4,'square',0.12,sfxGain);}
  else if(type==='vhs'){tone(120,t,0.05,'square',0.04,sfxGain);tone(80,t+0.03,0.08,'square',0.05,sfxGain);}
  else if(type==='page'){tone(440,t,0.08,'square',0.07,sfxGain);tone(660,t+0.04,0.1,'triangle',0.06,sfxGain);}
  else if(type==='select'){tone(660,t,0.06,'square',0.08,sfxGain);tone(880,t+0.04,0.08,'triangle',0.06,sfxGain);}
  else if(type==='bottle')tone(300,t,0.1,'square',0.08,sfxGain);
  else if(type==='train'){if(!hatBuf)return;const s=actx.createBufferSource();s.buffer=hatBuf;const f=actx.createBiquadFilter();f.type='lowpass';f.frequency.value=180;const g=actx.createGain();s.connect(f);f.connect(g);g.connect(sfxGain);g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(0.09,t+0.5);g.gain.exponentialRampToValueAtTime(0.0001,t+2.2);s.start(t);s.stop(t+2.3);}
  else if(type==='drip')tone(900+Math.random()*400,t,0.05,'sine',0.03,sfxGain);
}
let ambientTimer=null,ambientBuf=null;
function startAmbient(theme){
  if(ambientTimer){clearInterval(ambientTimer);ambientTimer=null;}
  if(!actx)return;
  if(!ambientBuf){ambientBuf=actx.createBuffer(1,actx.sampleRate,actx.sampleRate);const d=ambientBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  ambientTimer=setInterval(()=>{
    if(!actx||actx.state!=='running'||state!=='play'||!sfxOn)return;
    const t=actx.currentTime;
    const mk=(freq,type,q,vol,dur)=>{const s=actx.createBufferSource();s.buffer=ambientBuf;const f=actx.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;const g=actx.createGain();s.connect(f);f.connect(g);g.connect(sfxGain);g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+dur*0.3);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.start(t);s.stop(t+dur+0.05);};
    if(theme==='city'||theme==='shops'||theme==='final'){if(Math.random()<0.25)mk(800+Math.random()*400,'bandpass',0.6,0.018,0.7);}
    else if(theme==='park'){if(Math.random()<0.4)mk(3000,'highpass',1,0.012,1.1);}
    else if(theme==='metro'){if(Math.random()<0.35)mk(200,'lowpass',1,0.03,1.4);}
  },600);
}

/* ============ INPUT ============ */
const keys={};
function clearKeys(){for(const k in keys)keys[k]=false;}
addEventListener('keydown',e=>{
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD','Enter'].includes(e.code))e.preventDefault();
  const wasPressed=keys[e.code];keys[e.code]=true;initAudio();if(wasPressed)return;
  if((e.code==='KeyP'||e.code==='Escape')&&(state==='play'||state==='finale')){state='paused';pauseSel=0;clearKeys();sfx('vhs');return;}
  if((e.code==='KeyP'||e.code==='Escape')&&state==='paused'){state=(finalePhase>0?'finale':'play');clearKeys();return;}
  if(state==='orient_select'){
    if(e.code==='ArrowLeft'||e.code==='ArrowUp'||e.code==='KeyA'||e.code==='KeyW'){if(orientIdx!==0){orientIdx=0;setOrientation('horizontal');sfx('select');}}
    else if(e.code==='ArrowRight'||e.code==='ArrowDown'||e.code==='KeyD'||e.code==='KeyS'){if(orientIdx!==1){orientIdx=1;setOrientation('vertical');sfx('select');}}
    if(e.code==='KeyH'){state='howto';howtoBack='orient_select';}
  }
  if(state==='howto'&&(e.code==='Escape'||e.code==='Space'||e.code==='Enter')){state=howtoBack||'orient_select';return;}
  if(state==='arcade_select'){
    if(e.code==='ArrowLeft'||e.code==='KeyA'){arcadeSel=Math.max(0,arcadeSel-1);sfx('select');}
    else if(e.code==='ArrowRight'||e.code==='KeyD'){arcadeSel=Math.min(5,arcadeSel+1);sfx('select');}
    else if(e.code==='ArrowUp'||e.code==='KeyW'){arcadeSel=Math.max(0,arcadeSel-2);sfx('select');}
    else if(e.code==='ArrowDown'||e.code==='KeyS'){arcadeSel=Math.min(5,arcadeSel+2);sfx('select');}
    else if(e.code==='Space'||e.code==='Enter'){const games=['tetris','snake','race','lines','tanks','breakout'];startMiniGame(games[arcadeSel]);return;}
    else if(e.code==='Escape'){state='play';clearKeys();releaseAllBtns();return;}
  }
  if(state==='paused'){
    if(e.code==='ArrowUp'||e.code==='KeyW'){pauseSel=Math.max(0,pauseSel-1);sfx('select');}
    else if(e.code==='ArrowDown'||e.code==='KeyS'){pauseSel=Math.min(6,pauseSel+1);sfx('select');}
    else if(e.code==='Space'||e.code==='Enter'){pauseActivate();return;}
  }
  if(state==='title'||state==='story'||state==='orient_select'||state==='win'||state==='dead'||state==='map'){
    if(e.code==='Space'||e.code==='Enter')confirmPress();
  }
  if(state==='minigame'){
    if(e.code==='Escape'||e.code==='KeyP'){state='play';miniGame=null;setMusicTheme(currentTheme);clearKeys();releaseAllBtns();}
    else if(miniGame)mgKeyDown(e.code);
  }
});
addEventListener('keyup',e=>{keys[e.code]=false;if(state==='minigame'&&miniGame)mgKeyUp(e.code);});

const PAUSE_ITEMS=[{id:'resume',label:'ПРОДОЛЖИТЬ'},{id:'music',label:'МУЗЫКА'},{id:'sfx',label:'ЗВУКИ'},{id:'howto',label:'КАК ИГРАТЬ'},{id:'orient',label:'ФОРМАТ ЭКРАНА'},{id:'menu',label:'ГЛАВНОЕ МЕНЮ'},{id:'fs',label:'ПОЛНЫЙ ЭКРАН'}];
let pauseSel=0;
function getPauseRowY(i){return 30+i*22;}
function getPauseRect(i){return{x:W/2-90,y:getPauseRowY(i)-9,w:180,h:18};}
function handlePauseTap(p){for(let i=0;i<PAUSE_ITEMS.length;i++){if(inBtn(p.x,p.y,getPauseRect(i))){pauseSel=i;pauseActivate();return true;}}return false;}
function pauseActivate(){
  const item=PAUSE_ITEMS[pauseSel];if(!item)return;
  if(item.id==='resume'){state=(finalePhase>0?'finale':'play');clearKeys();}
  else if(item.id==='music'){setMusicOn(!musicOn);sfx('select');}
  else if(item.id==='sfx'){setSfxOn(!sfxOn);sfx('select');}
  else if(item.id==='howto'){state='howto';howtoBack='paused';}
  else if(item.id==='orient'){orientIdx=(orientation==='horizontal'?0:1);state='orient_select';orientFromPause=true;}
  else if(item.id==='menu'){state='title';setMusicTheme('menu');clearKeys();}
  else if(item.id==='fs'){toggleFullscreen();}
}
let orientFromPause=false,howtoBack='orient_select';

function onTouchStart(e){
  e.preventDefault();isTouchDevice=true;initAudio();
  for(const t of e.touches){
    const p=canvasPos(t.clientX,t.clientY);
    if(state==='title'){const ob={x:6,y:H-20,w:130,h:14};if(inBtn(p.x,p.y,ob)){orientFromPause=false;orientIdx=(orientation==='horizontal'?0:1);state='orient_select';sfx('vhs');return;}state='story';storyPage=0;storyTimer=0;setMusicTheme('menu');sfx('vhs');return;}
    if(state==='story'){const sb=getStorySkipBtn();if(inBtn(p.x,p.y,sb)){orientFromPause=false;orientIdx=(orientation==='horizontal'?0:1);state='orient_select';sfx('vhs');return;}if(storyPage<STORY_PAGES.length-1){storyPage++;storyTimer=0;sfx('page');}else{orientFromPause=false;orientIdx=(orientation==='horizontal'?0:1);state='orient_select';sfx('vhs');}return;}
    if(state==='orient_select'){handleOrientSelect(p);return;}
    if(state==='howto'){state=howtoBack||'orient_select';return;}
    if(state==='paused'){handlePauseTap(p);return;}
    if(state==='map'){
      // Любой тап на карте = продолжить
      doFadeTo(()=>goToNextLevel());
      return;
    }
    if(state==='arcade_select'){const s=arcadeSelectState;for(let i=0;i<s.games.length;i++){const col=i%2,row=Math.floor(i/2);const gx=s.startX+col*(s.cw+s.gap),gy=s.startY+row*(s.ch+s.gap);if(p.x>=gx&&p.x<=gx+s.cw&&p.y>=gy&&p.y<=gy+s.ch){arcadeSel=i;startMiniGame(s.games[i].t);return;}}return;}
    if(state==='arcade_win'){state='play';miniGame=null;return;}
    if(state==='dead'){startLevel(currentLevelId);return;}
    if(state==='win'){state='title';setMusicTheme('menu');return;}
    if(state==='minigame'&&miniGame){mgTouchStart(p.x,p.y);return;}
    if(state==='play'||state==='intro'||state==='finale'){if(inBtn(p.x,p.y,getPauseBtn())){state='paused';pauseSel=0;sfx('vhs');releaseAllBtns();return;}}
  }
  if(state==='play'||state==='intro'||state==='finale')syncTouchButtons(e);
}
function onTouchMove(e){e.preventDefault();if(state==='play'||state==='intro'||state==='finale')syncTouchButtons(e);}
function onTouchEnd(e){e.preventDefault();if(state==='minigame'){mgTouchEnd();return;}if(state==='play'||state==='intro'||state==='finale')syncTouchButtons(e);}
function onTouchCancel(e){e.preventDefault();releaseAllBtns();}

cv.addEventListener('touchmove',onTouchMove,{passive:false});
cv.addEventListener('touchend',onTouchEnd,{passive:false});
cv.addEventListener('touchcancel',onTouchCancel,{passive:false});

  if(state==='orient_select'){handleOrientSelect(p);return;}
  if(state==='howto'){state=howtoBack||'orient_select';return;}

  if(state==='arcade_win'){state='play';miniGame=null;return;}
  if(state==='dead'){startLevel(currentLevelId);return;}
  if(state==='win'){state='title';setMusicTheme('menu');return;}
  if(state==='minigame'&&miniGame){mgTouchStart(p.x,p.y);return;}
  if(state==='play'||state==='intro'||state==='finale'){if(inBtn(p.x,p.y,getPauseBtn())){state='paused';pauseSel=0;releaseAllBtns();return;}for(const b of touchButtons){if(inBtn(p.x,p.y,b)){mouseDownBtn=b.id;touch[b.id]=true;return;}}}
});
cv.addEventListener('mouseup',()=>{mouseDownBtn=null;releaseAllBtns();});

function handleOrientSelect(p){
  const btns=getOrientBtns();
  if(inBtn(p.x,p.y,btns.hBtn)){if(orientIdx!==0){orientIdx=0;setOrientation('horizontal');sfx('select');}return true;}
  if(inBtn(p.x,p.y,btns.vBtn)){if(orientIdx!==1){orientIdx=1;setOrientation('vertical');sfx('select');}return true;}
  if(inBtn(p.x,p.y,btns.hintBtn)){howtoBack='orient_select';state='howto';return true;}
  const sbtn=getStartBtn();
  if(inBtn(p.x,p.y,sbtn)){setOrientation(orientIdx===0?'horizontal':'vertical');if(orientFromPause){orientFromPause=false;state=(finalePhase>0?'finale':'play');clearKeys();}else startGame();return true;}
  return true;
}

function aabb(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}

function update(){
  time++;
  if(shake>0)shake*=0.88;
  if(flash>0)flash*=0.9;
  if(glitch>0)glitch*=0.94;
  if(fadeDir===1){fadeAlpha+=0.06;if(fadeAlpha>=1){fadeAlpha=1;fadeDir=-1;if(fadeCallback){fadeCallback();fadeCallback=null;}}}
  else if(fadeDir===-1){fadeAlpha-=0.06;if(fadeAlpha<=0){fadeAlpha=0;fadeDir=0;}}
  if(state==='title'||state==='story'||state==='orient_select'||state==='howto'||state==='paused'||state==='map'){updateParticles();return;}
  if(state==='arcade_select'||state==='arcade_win'){updateParticles();return;}
  if(state==='dead'||state==='win'){updateParticles();return;}
  if(state==='minigame'&&miniGame){mgUpdate();return;}
  if(invincibleTimer>0){invincibleTimer--;if(invincibleTimer===0)setMusicTheme(currentTheme);}
  if(comboTimer>0){comboTimer--;if(comboTimer===0)comboCount=0;}
  if(animState==='climb'){
    animTimer++;
    const t=animTimer/60;
    if(t<0.33){const lt=t/0.33;player.x=40+lt*20;player.y=120+Math.sin(lt*Math.PI/2)*20;}
    else if(t<0.66){const lt=(t-0.33)/0.33;player.x=60+lt*30;player.y=140-lt*20;}
    else{const lt=(t-0.66)/0.34;player.x=90+lt*30;player.y=120-lt*20;}
    if(animTimer>60){player.x=120;player.y=100;animState='play';}
    updateCamera();updateParticles();return;
  }
  if(animState==='end'){
    animTimer++;updateParticles();updateCamera();
    if(animTimer>60){
      if(goalStore){state='finale';finalePhase=1;finaleTimer=0;animState='play';}
      else doFadeTo(()=>{state='map';});
      animState='play';
    }
    return;
  }
  updatePlayer();updateEnemies();updateShots();updateCamera();
  updateParticles();updateAmbientParticles();updateDrips();updateTrain();updateRain();updateBoss();
  if(Math.random()<0.35)spawnAmbientParticle();
  if(currentTheme==='metro'&&Math.random()<0.08)spawnDrip();
  if(state==='finale')updateFinale();
}
function updateBoss(){
  if(!boss||!boss.active)return;
  boss.t++;boss.shootCd--;
  const p=player;
  boss.dir=p.x>boss.x?1:-1;
  if(Math.abs(p.x-boss.x)>60)boss.x+=boss.dir*0.5;
  boss.phase=Math.floor((boss.maxHp-boss.hp)/4);
  if(boss.shootCd<=0){
    boss.shootCd=90-boss.phase*15;
    const n=3+boss.phase;
    const baseAngle=Math.atan2(p.y-boss.y,p.x-boss.x);
    for(let i=0;i<n;i++){const a=baseAngle+(i-(n-1)/2)*0.3;eBullets.push({x:boss.x+boss.w/2,y:boss.y+boss.h/2,w:6,h:6,vx:Math.cos(a)*2.4,vy:Math.sin(a)*2.4,life:180});}
    sfx('shot');
  }
  for(const s of shots){
    if(s.life>0&&aabb(s,boss)){
      boss.hp--;s.life=0;sfx('bossHit');shake=6;glitch=0.5;
      for(let i=0;i<16;i++)particles.push({x:boss.x+18,y:boss.y+20,vx:(Math.random()-0.5)*4,vy:(Math.random()-0.5)*4,life:30,c:i%2?'#ff2d95':'#ffde59',s:2});
      if(boss.hp<=0){boss.active=false;sfx('win');flash=1;glitch=1.5;}
      break;
    }
  }
  if(aabb(player,boss)&&player.invuln<=0&&invincibleTimer<=0){
    player.tape-=18;player.invuln=70;player.vx=(player.x<boss.x?-1:1)*3.5;player.vy=-3.5;
    sfx('hurt');shake=6;flash=0.5;glitch=0.8;
    if(player.tape<=0)die();
  }
}
function updateFinale(){
  finaleTimer++;
  const p=player;
  if(finalePhase===1){p.vx=1.6;p.x+=p.vx;p.anim+=Math.abs(p.vx)*0.14;if(finaleTimer>60){finalePhase=2;finaleTimer=0;}}
  else if(finalePhase===2){p.x+=0.8;if(finaleTimer>80){finalePhase=3;finaleTimer=0;}}
  else if(finalePhase===3){if(finaleTimer>100){state='win';persistSave();}}
  const targetX=player.x+player.w/2-VW*0.42;camX+=(targetX-camX)*0.08;
}
function updateTrain(){

let stepTimer=0;
function updatePlayer(){
  const p=player;
  const LEFT=keys['ArrowLeft']||keys['KeyA']||touch.left;
  const RIGHT=keys['ArrowRight']||keys['KeyD']||touch.right;
  const JUMP=keys['ArrowUp']||keys['KeyW']||touch.jump;
  const SHOOT=keys['KeyJ']||keys['KeyZ']||keys['KeyK']||touch.shoot;
  const CROUCH=keys['ArrowDown']||keys['KeyS'];
  const accel=0.55,maxSpd=2.7,fric=0.78;
  if(LEFT){p.vx-=accel;p.facing=-1;}
  if(RIGHT){p.vx+=accel;p.facing=1;}
  if(!LEFT&&!RIGHT)p.vx*=fric;
  p.vx=clamp(p.vx,-maxSpd,maxSpd);
  p.crouch=!!CROUCH&&p.onGround;
  nearArcade=null;
  for(const pr of props){if(pr.t==='arcade'&&Math.abs((p.x+p.w/2)-(pr.x+pr.w/2))<24&&Math.abs((p.y+p.h/2)-(pr.y+pr.h/2))<36){nearArcade=pr;break;}}
  if(nearArcade&&CROUCH&&!arcadeLockUsed){arcadeLockUsed=true;state='arcade_select';arcadeSel=0;sfx('arcade');clearKeys();releaseAllBtns();}
  if(!CROUCH)arcadeLockUsed=false;
  const wasOnGround=p.onGround;
  if(JUMP&&p.onGround&&!p.crouch){p.vy=-6.2;p.onGround=false;sfx('jump');p.hasDoubleJumped=false;}
  else if(JUMP&&!p.onGround&&save.totalStars>=20&&!p.hasDoubleJumped&&p.vy>-4){p.vy=-5.5;p.hasDoubleJumped=true;sfx('jump');}
  if(p.shootCd>0)p.shootCd--;
  if(p.wrapFx>0)p.wrapFx--;
  if(SHOOT&&p.shootCd<=0&&!p.dead){p.shootCd=18;p.wrapFx=14;shots.push({x:p.x+(p.facing>0?16:-6),y:p.y+7,w:10,h:6,vx:p.facing*5.4,life:90,rot:0,hit:false});sfx('shot');shake=Math.max(shake,0.5);}
  p.vy+=0.34;if(p.vy>8)p.vy=8;
  p.x+=p.vx;
  const pw=p.crouch?p.h*0.6:p.h;
  const pyH=p.crouch?p.y+p.h*0.4:p.y;
  const hbox={x:p.x,y:pyH,w:p.w,h:pw};
  for(const s of solids){if(aabb(hbox,s)){if(p.vx>0)p.x=s.x-p.w;else if(p.vx<0)p.x=s.x+s.w;p.vx=0;}}
  p.y+=p.vy;p.onGround=false;
  const pyV=p.crouch?p.y+p.h*0.4:p.y;
  const vbox={x:p.x,y:pyV,w:p.w,h:pw};
  for(const s of solids){if(aabb(vbox,s)){if(p.vy>0){p.y=s.y-p.h;p.vy=0;p.onGround=true;}else if(p.vy<0){p.y=s.y+s.h;p.vy=0;}}}
  if(p.onGround&&!wasOnGround&&Math.abs(p.vy)<0.5){sfx('land');p.hasDoubleJumped=false;}
  if(p.onGround&&Math.abs(p.vx)>0.5){stepTimer--;if(stepTimer<=0){stepTimer=14;sfx('step');}}
  if(p.x<-40)p.x=-40;
  if(p.x>worldW+40)p.x=worldW+40;
  if(p.onGround&&p.y<500)lastSafe={x:p.x,y:p.y-2};
  if(p.y>520){
    if(invincibleTimer>0){p.x=lastSafe.x;p.y=lastSafe.y;p.vx=0;p.vy=0;}
    else{p.tape-=18;sfx('hurt');flash=0.5;glitch=1;if(p.tape<=0){die();return;}p.x=lastSafe.x;p.y=lastSafe.y;p.vx=0;p.vy=0;p.invuln=60;}
  }
  if(p.invuln>0)p.invuln--;
  for(const e of enemies){
    if(e.hp<=0)continue;
    if(aabb(p,e)&&p.invuln<=0&&invincibleTimer<=0){
      p.tape-=14;p.invuln=70;p.vx=(p.x<e.x?-1:1)*3.2;p.vy=-3.2;
      sfx('hurt');shake=5;flash=0.4;glitch=0.8;
      if(p.tape<=0){die();return;}
    }
  }
  for(const pk of pickups){if(pk.got)continue;if(aabb(p,pk)){pk.got=true;p.tape=Math.min(p.maxTape,p.tape+22);sfx('pickup');}}
  for(const s of stars){if(s.got)continue;if(aabb(p,s)){s.got=true;levelStarsCollected++;save.totalStars++;save.levelStars[currentLevelId]=(save.levelStars[currentLevelId]||0)+1;persistSave();sfx('star');}}
  if(bonus&&!bonus.got&&aabb(p,bonus)){bonus.got=true;invincibleTimer=60*20;sfx('bonus');shake=5;flash=0.7;glitch=0.6;setMusicTheme('invincible');}
  if(Math.abs(p.vx)>0.2&&p.onGround)p.anim+=Math.abs(p.vx)*0.14;else p.anim*=0.9;
  if(p.x>exitX-30&&p.x<exitX+40&&p.y>exitY-40&&p.y<exitY+40&&p.onGround){
    if(!boss||!boss.active){
      levelStarsCollected=stars.filter(s=>s.got).length;
      save.levelStars[currentLevelId]=Math.max(save.levelStars[currentLevelId]||0,levelStarsCollected);
      const tsec=Math.floor((time-levelStartTime)/60);
      if(!save.bestTime[currentLevelId]||tsec<save.bestTime[currentLevelId])save.bestTime[currentLevelId]=tsec;
      persistSave();
      animState='end';animFrame=0;animTimer=0;
      sfx('win');flash=1;glitch=0.6;
    }
  }
}
function die(){state='dead';player.dead=true;sfx('hurt');shake=10;glitch=1.6;}
function updateEnemies(){
  const p=player;
  for(const e of enemies){
    if(e.hp<=0)continue;
    e.t++;if(e.hitT>0)e.hitT--;
    e.anim+=0.15;
    if(e.type==='cop'){
      const dx=p.x-e.x,dist=Math.abs(dx);
      // Движение к игроку и стрельба
      if(dist<180&&Math.abs(p.y-e.y)<40){
        e.dir=dx>0?1:-1; // лицом к игроку
        // Стоит и стреляет
        e.shootCd--;
        if(e.shootCd<=0){
          e.shootCd=90;
          const angle=Math.atan2(p.y+10-(e.y+8),p.x+8-(e.x+6));
          eBullets.push({x:e.x+6,y:e.y+8,w:5,h:5,vx:Math.cos(angle)*3,vy:Math.sin(angle)*3,life:150,bullet:true});
          sfx('shot');
        }
      } else {
        // Патрулирует
        e.x+=e.dir*0.65;
        if(e.x<e.minX){e.x=e.minX;e.dir=1;}
        if(e.x>e.maxX){e.x=e.maxX;e.dir=-1;}
      }
    } else if(e.type==='punk'){
      // Патрулирует
      e.x+=e.dir*1.0;
      if(e.x<e.minX){e.x=e.minX;e.dir=1;}
      if(e.x>e.maxX){e.x=e.maxX;e.dir=-1;}
      // Кидает бутылку под углом, если игрок в поле зрения
      const dx=p.x-e.x,dist=Math.abs(dx);
      if(dist<200&&Math.abs(p.y-e.y)<60&&dist>20){
        e.throwCd--;
        if(e.throwCd<=0){
          e.throwCd=140;
          // Параболический бросок в сторону игрока
          const t0=dist/3.2;
          const vx=(p.x-e.x)/t0;
          const vy=(p.y-e.y)/t0-0.5*0.25*t0;
          eBullets.push({x:e.x+6,y:e.y+6,w:6,h:6,vx:vx,vy:vy,life:200,bottle:true,g:0.25});
          sfx('bottle');
        }
      }
    } else if(e.type==='bum'){
      // Медленно ходит влево-вправо
      e.x+=e.dir*0.35;
      if(e.x<e.minX){e.x=e.minX;e.dir=1;}
      if(e.x>e.maxX){e.x=e.maxX;e.dir=-1;}
    } else if(e.type==='rat'){
      // Быстро бегает, может прыгать на игрока
      e.x+=e.dir*1.8;
      if(e.x<e.minX){e.x=e.minX;e.dir=1;}
      if(e.x>e.maxX){e.x=e.maxX;e.dir=-1;}
      if(Math.abs(p.x-e.x)<100&&p.y>e.y-20&&p.y<e.y+30)e.dir=p.x>e.x?1:-1;
    } else if(e.type==='pigeon'){
      e.x+=e.dir*0.7;
      if(e.x<e.minX){e.x=e.minX;e.dir=1;}
      if(e.x>e.maxX){e.x=e.maxX;e.dir=-1;}
      e.y=e.baseY+Math.sin(e.t*0.05+e.phase)*6;
      if(Math.abs(p.x-e.x)<30&&e.t%110===0)eBullets.push({x:e.x+4,y:e.y+10,w:6,h:6,vx:0,vy:1.8,life:180,poop:true});
    }
  }
  for(const b of eBullets){
    b.x+=b.vx;b.y+=b.vy;b.life--;
    if(b.bottle)b.vy+=(b.g||0.25);
    // Столкновение с игроком
    if(aabb(b,p)&&p.invuln<=0&&invincibleTimer<=0&&!p.crouch){
      p.tape-=b.poop?8:(b.bottle?14:12);p.invuln=70;b.life=0;
      p.vx=(b.vx>0?1:-1)*2.6;p.vy=-2.6;
      sfx('hurt');shake=4;flash=0.35;glitch=0.6;
      if(p.tape<=0)die();
    }
    // Бутылки разбиваются об землю
    if(b.bottle&&b.y>H-20){b.life=0;
      for(let i=0;i<8;i++)particles.push({x:b.x,y:b.y,vx:(Math.random()-0.5)*3,vy:-Math.random()*2,life:20,c:'#a0e0a0',s:1.5});
    }
  }
  eBullets=eBullets.filter(b=>b.life>0);
}
function updateShots(){
  for(const s of shots){
    s.x+=s.vx;s.life--;s.rot+=0.4;
    for(const e of enemies){
      if(e.hp<=0)continue;
      if(aabb(s,e)){
        e.hp--;s.life=0;e.hitT=8;
        if(!s.hit){s.hit=true;player.tape=Math.max(0,player.tape-8);}
        sfx('hit');shake=3;
        for(let i=0;i<8;i++)particles.push({x:s.x+5,y:s.y+3,vx:(Math.random()-0.5)*3,vy:(Math.random()-0.5)*3,life:20,c:'#00f0ff',s:1.6});
        if(e.hp<=0){
          sfx('kill');comboCount++;comboTimer=120;
          if(comboCount>=3){player.tape=Math.min(player.maxTape,player.tape+8);sfx('combo');}
          for(let i=0;i<16;i++)particles.push({x:e.x+6,y:e.y+8,vx:(Math.random()-0.5)*4,vy:(Math.random()-0.5)*4-1,life:32,c:i%2?'#ff2d95':'#ffde59',s:2});
          shake=Math.max(shake,4);
        }
        break;
      }
    }
    for(const so of solids){if(aabb(s,so)){s.life=0;break;}}
    if(s.x<-20||s.x>worldW+40)s.life=0;
  }
  shots=shots.filter(s=>s.life>0);
}
function updateParticles(){for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.life--;}particles=particles.filter(p=>p.life>0);}
function updateCamera(){

const TETROMINOES=[
  {shape:[[1,1,1,1]],c:'#00f0ff'},{shape:[[1,1],[1,1]],c:'#ffde59'},
  {shape:[[0,1,0],[1,1,1]],c:'#b026ff'},{shape:[[1,0,0],[1,1,1]],c:'#ff2d95'},
  {shape:[[0,0,1],[1,1,1]],c:'#39ff14'},{shape:[[1,1,0],[0,1,1]],c:'#ff9a3c'},
  {shape:[[0,1,1],[1,1,0]],c:'#ff5fa2'},
];
function mgTetrisSpawn(d){const t=TETROMINOES[Math.floor(Math.random()*TETROMINOES.length)];d.piece=t.shape.map(r=>r.slice());d.pieceColor=t.c;d.pieceX=3;d.pieceY=0;}
function mgTetrisCollide(d,shape,px,py){for(let y=0;y<shape.length;y++)for(let x=0;x<shape[y].length;x++){if(!shape[y][x])continue;const gx=px+x,gy=py+y;if(gx<0||gx>=10||gy>=20)return true;if(gy>=0&&d.grid[gy][gx])return true;}return false;}
function mgTetris(){
  const d=miniGame.data;
  if(!d.piece)mgTetrisSpawn(d);
  const kk=keys;
  if(!d._kL&&(kk['ArrowLeft']||kk['KeyA'])){if(!mgTetrisCollide(d,d.piece,d.pieceX-1,d.pieceY))d.pieceX--;d._kL=true;}
  if(!(kk['ArrowLeft']||kk['KeyA']))d._kL=false;
  if(!d._kR&&(kk['ArrowRight']||kk['KeyD'])){if(!mgTetrisCollide(d,d.piece,d.pieceX+1,d.pieceY))d.pieceX++;d._kR=true;}
  if(!(kk['ArrowRight']||kk['KeyD']))d._kR=false;
  if(!d._kD&&(kk['ArrowDown']||kk['KeyS'])){if(!mgTetrisCollide(d,d.piece,d.pieceX,d.pieceY+1))d.pieceY+=1;d._kD=true;}
  if(!(kk['ArrowDown']||kk['KeyS']))d._kD=false;
  if(!d._kU&&(kk['ArrowUp']||kk['KeyW']||kk['Space'])){const rotated=d.piece[0].map((_,i)=>d.piece.map(r=>r[i]).reverse());if(!mgTetrisCollide(d,rotated,d.pieceX,d.pieceY))d.piece=rotated;d._kU=true;}
  if(!(kk['ArrowUp']||kk['KeyW']||kk['Space']))d._kU=false;
  d.dropTimer++;
  const speed=Math.max(15,40-Math.floor(d.lines)*0.8);
  if(d.dropTimer>=speed){
    d.dropTimer=0;
    if(!mgTetrisCollide(d,d.piece,d.pieceX,d.pieceY+1))d.pieceY++;
    else{
      for(let y=0;y<d.piece.length;y++)for(let x=0;x<d.piece[y].length;x++){if(d.piece[y][x]&&d.pieceY+y>=0)d.grid[d.pieceY+y][d.pieceX+x]=d.pieceColor;}
      let cleared=0;
      for(let y=19;y>=0;y--){if(d.grid[y].every(c=>c)){d.grid.splice(y,1);d.grid.unshift(Array(10).fill(0));cleared++;y++;}}
      d.lines+=cleared;sfx('pickup');

function mgSnake(){

  else if((kk['ArrowDown']||kk['KeyS'])&&d.dir.y!==-1)d.dir={x:0,y:1};

function mgRace(){

function mgLines(){

  if(!d.drawing&&onEdge&&wantDraw){d.drawing=true;d.trail=[{x:d.px,y:d.py}];d.lastX=d.px;d.lastY=d.py;sfx('select');}
  if(d.drawing){
    if(Math.abs(d.px-d.lastX)>2||Math.abs(d.py-d.lastY)>2){d.trail.push({x:d.px,y:d.py});d.lastX=d.px;d.lastY=d.py;}
    for(const q of d.qix){q.x+=q.vx;q.y+=q.vy;if(q.x<14||q.x>W-14)q.vx*=-1;if(q.y<34||q.y>H-14)q.vy*=-1;

function mgTanks(){
  const d=miniGame.data;d.tick++;
  if(d.walls.length===0)mgSetupTanksLevel(d,1);
  const kk=keys;
  const spd=1.5;
  let nx=d.player.x,ny=d.player.y;
  if(kk['ArrowLeft']||kk['KeyA']){nx-=spd;d.player.dir=Math.PI;}
  if(kk['ArrowRight']||kk['KeyD']){nx+=spd;d.player.dir=0;}
  if(kk['ArrowUp']||kk['KeyW']){ny-=spd;d.player.dir=-Math.PI/2;}
  if(kk['ArrowDown']||kk['KeyS']){ny+=spd;d.player.dir=Math.PI/2;}
  nx=clamp(nx,20,W-20);ny=clamp(ny,45,H-20);
  if(!tankCollideWall(nx,d.player.y,8,d))d.player.x=nx;
  if(!tankCollideWall(d.player.x,ny,8,d))d.player.y=ny;
  if(!d._kS&&(kk['Space']||kk['KeyJ']||kk['KeyZ'])){d.pbullets.push({x:d.player.x+Math.cos(d.player.dir)*10,y:d.player.y+Math.sin(d.player.dir)*10,vx:Math.cos(d.player.dir)*4,vy:Math.sin(d.player.dir)*4});d._kS=true;sfx('shot');}
  if(!(kk['Space']||kk['KeyJ']||kk['KeyZ']))d._kS=false;
  for(const b of d.pbullets){b.x+=b.vx;b.y+=b.vy;}
  for(const b of d.ebullets){b.x+=b.vx;b.y+=b.vy;}
  d.pbullets=d.pbullets.filter(b=>{if(b.x<10||b.x>W-10||b.y<30||b.y>H-10)return false;if(tankCollideWall(b.x,b.y,2,d))return false;return true;});
  d.ebullets=d.ebullets.filter(b=>{if(b.x<10||b.x>W-10||b.y<30||b.y>H-10)return false;if(tankCollideWall(b.x,b.y,2,d))return false;return true;});
  for(const e of d.enemies){if(e.hp<=0)continue;e.cd--;const dx=d.player.x-e.x,dy=d.player.y-e.y;e.dir=Math.atan2(dy,dx);if(e.cd<=0){e.cd=90+Math.random()*40;d.ebullets.push({x:e.x+Math.cos(e.dir)*10,y:e.y+Math.sin(e.dir)*10,vx:Math.cos(e.dir)*2.5,vy:Math.sin(e.dir)*2.5});}}
  for(const b of d.pbullets){for(const e of d.enemies){if(e.hp<=0)continue;if(Math.abs(b.x-e.x)<10&&Math.abs(b.y-e.y)<10){e.hp--;b.dead=true;sfx('hit');if(e.hp<=0){d.levelKills++;sfx('kill');}}}}
  for(const b of d.ebullets){if(Math.abs(b.x-d.player.x)<8&&Math.abs(b.y-d.player.y)<8){endMiniGame(false);return;}}
  d.pbullets=d.pbullets.filter(b=>!b.dead);
  if(d.levelKills>=d.levelGoal&&d.enemies.every(e=>e.hp<=0)){if(d.level>=3){endMiniGame(true);return;}mgSetupTanksLevel(d,d.level+1);sfx('bonus');}
}

/* ============================================================
   КАРТА-МАРШРУТ (линейная последовательность)
   ============================================================ */
function drawMap(){
  // Фон
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#08000f');g.addColorStop(0.4,'#2a0a4a');g.addColorStop(0.75,'#8a1f6b');g.addColorStop(1,'#ff9a3c');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  // Солнце на фоне
  const cx=W*0.5,cy=H*0.85,r=90;
  const sg=ctx.createLinearGradient(0,cy-r,0,cy+r);
  sg.addColorStop(0,'#fff4a3');sg.addColorStop(0.4,'#ffcf47');sg.addColorStop(0.7,'#ff5fa2');sg.addColorStop(1,'#a02bff');
  ctx.fillStyle=sg;ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.fill();
  ctx.save();ctx.beginPath();
  for(let i=0;i<10;i++){const yy=cy-20+i*6.5;ctx.rect(cx-r-2,yy,r*2+4,2+i*0.7);}
  ctx.clip();ctx.fillStyle=g;ctx.fillRect(cx-r-4,cy-r-4,r*2+8,r*2+8);
  ctx.restore();

  // Заголовок
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#ffde59';ctx.font='bold 13px Courier New';
  ctx.fillText('ПУТЬ К ВИДЕОСАЛОНУ',W/2,20);
  ctx.fillStyle='rgba(255,255,255,0.7)';ctx.font='bold 7px Courier New';
  ctx.fillText('ПРОЙДЕНО: '+save.currentLevelIndex+' / '+(LEVEL_SEQUENCE.length-1),W/2,32);

  // Линия маршрута
  ctx.strokeStyle='#ff2d95';
  ctx.lineWidth=2;
  ctx.shadowColor='#ff2d95';ctx.shadowBlur=10;
  ctx.beginPath();
  for(let i=0;i<LEVEL_SEQUENCE.length;i++){
    const node=MAP_NODES[LEVEL_SEQUENCE[i]];
    if(i===0)ctx.moveTo(node.x,node.y);
    else ctx.lineTo(node.x,node.y);
  }
  ctx.stroke();ctx.shadowBlur=0;

  // Пунктирная линия для непройденных отрезков
  ctx.strokeStyle='rgba(255,45,149,0.35)';
  ctx.setLineDash([4,4]);
  ctx.beginPath();
  for(let i=save.currentLevelIndex;i<LEVEL_SEQUENCE.length;i++){
    const node=MAP_NODES[LEVEL_SEQUENCE[i]];
    if(i===save.currentLevelIndex)ctx.moveTo(node.x,node.y);
    else ctx.lineTo(node.x,node.y);
  }
  ctx.stroke();ctx.setLineDash([]);

  // Стрелки между точками
  for(let i=0;i<LEVEL_SEQUENCE.length-1;i++){
    const a=MAP_NODES[LEVEL_SEQUENCE[i]];
    const b=MAP_NODES[LEVEL_SEQUENCE[i+1]];
    const dx=b.x-a.x,dy=b.y-a.y;
    const len=Math.hypot(dx,dy);
    const t=0.5;
    const mx=a.x+dx*t,my=a.y+dy*t;
    const ang=Math.atan2(dy,dx);
    const passed=i<save.currentLevelIndex;
    ctx.save();
    ctx.translate(mx,my);ctx.rotate(ang);
    ctx.fillStyle=passed?'#ffde59':'rgba(255,45,149,0.5)';
    ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=passed?8:4;
    ctx.beginPath();
    ctx.moveTo(8,0);ctx.lineTo(-4,-5);ctx.lineTo(-4,5);
    ctx.closePath();ctx.fill();
    ctx.restore();
  }

  // Узлы уровней
  for(let i=0;i<LEVEL_SEQUENCE.length;i++){
    const id=LEVEL_SEQUENCE[i];
    const n=MAP_NODES[id];
    const done=save.visited[id]&&i<save.currentLevelIndex;
    const isCurrent=i===save.currentLevelIndex&&state!=='win';
    const isFuture=i>save.currentLevelIndex;

    // Пульсирующее кольцо для текущего
    if(isCurrent){
      const pulse=1+Math.sin(time*0.15)*0.15;
      ctx.save();ctx.globalAlpha=0.6;
      ctx.strokeStyle='#39ff14';ctx.lineWidth=2;
      ctx.shadowColor='#39ff14';ctx.shadowBlur=14;
      ctx.beginPath();ctx.arc(n.x,n.y,14*pulse,0,7);ctx.stroke();
      ctx.restore();
    }

    // Круглый узел
    ctx.save();
    if(done){ctx.fillStyle='#2a6a30';ctx.shadowColor='#39ff14';ctx.shadowBlur=8;}
    else if(isCurrent){ctx.fillStyle='#39ff14';ctx.shadowColor='#39ff14';ctx.shadowBlur=16;}
    else{ctx.fillStyle='#1a1a2a';ctx.shadowColor='#b026ff';ctx.shadowBlur=6;}
    ctx.beginPath();ctx.arc(n.x,n.y,9,0,7);ctx.fill();
    ctx.strokeStyle=done?'#39ff14':(isCurrent?'#fff':'#a060a0');
    ctx.lineWidth=isCurrent?2.5:1.5;
    ctx.stroke();
    ctx.restore();

    // Иконка внутри узла
    drawMapIcon(n.x,n.y,id,done||isCurrent);

    // Звёзды под узлом
    const starCount=save.levelStars[id]||0;
    if(starCount>0){
      ctx.fillStyle='#ffde59';ctx.font='bold 7px Courier New';
      ctx.textAlign='center';
      ctx.fillText('★'+starCount,n.x,n.y+18);
    }

    // Название над узлом
    ctx.fillStyle=done||isCurrent?'#fff':'rgba(255,255,255,0.5)';
    ctx.font='bold 7px Courier New';
    ctx.textAlign='center';
    ctx.fillText(n.label,n.x,n.y-16);
  }

  // Подсказка
  const a=0.5+Math.sin(time*0.1)*0.5;
  ctx.globalAlpha=a;
  ctx.fillStyle='#00f0ff';ctx.font='bold 9px Courier New';
  ctx.textAlign='center';
  const nextLabel=save.currentLevelIndex<LEVEL_SEQUENCE.length?'СЛЕДУЮЩИЙ: '+MAP_NODES[LEVEL_SEQUENCE[save.currentLevelIndex]].label:'ФИНАЛ';
  ctx.fillText(nextLabel,W/2,H-30);
  ctx.fillStyle='#ffde59';ctx.font='bold 8px Courier New';
  ctx.fillText('TAP / SPACE — ПРОДОЛЖИТЬ',W/2,H-16);
  ctx.globalAlpha=1;

  drawCRT();
}
function drawMapIcon(x,y,id,active){

  for(const px of [50,W-50]){ctx.fillRect(px-3,cy+20,6,H-cy-20);for(let a=0;a<6;a++){const ang=-Math.PI/2+(a-2.5)*0.42;ctx.save();ctx.translate(px,cy+22);ctx.rotate(ang);ctx.beginPath();ctx.ellipse(0,-22,5,22,0,0,7);ctx.fill();ctx.restore();}}
  ctx.strokeStyle='rgba(255,45,149,0.55)';ctx.lineWidth=1;
  const horizon=H*0.78;
  for(let i=0;i<14;i++){const y=horizon+Math.pow(i/14,1.9)*(H-horizon);ctx.globalAlpha=0.15+0.55*(i/14);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  ctx.globalAlpha=1;
  drawTitleHero();
  ctx.textAlign='center';ctx.textBaseline='alphabetic';
  const tg=ctx.createLinearGradient(0,20,0,60);
  tg.addColorStop(0,'#ffffff');tg.addColorStop(0.4,'#ffde59');tg.addColorStop(0.55,'#ff2d95');tg.addColorStop(1,'#6a00ff');
  ctx.fillStyle=tg;ctx.font='bold 46px Courier New';ctx.fillText('VHS',W/2,42);
  ctx.fillStyle='#00f0ff';ctx.font='bold 12px Courier New';ctx.fillText('RETURN TO THE RENTAL',W/2,60);
  ctx.fillStyle='rgba(255,255,255,0.75)';ctx.font='7px Courier New';ctx.fillText('1987 • КАССЕТА ХОЧЕТ ДОМОЙ',W/2,72);
  ctx.fillStyle='rgba(255,255,255,0.55)';ctx.font='6.5px Courier New';ctx.fillText('ФАНАТСКИЙ ПРОЕКТ • ДАНЬ УВАЖЕНИЯ ЭПОХЕ VHS',W/2,84);
  ctx.fillStyle='#ffde59';ctx.font='bold 7px Courier New';ctx.fillText('АВТОР: СТАЛЬНАЯ КРЫСА 1984',W/2,93);
  if(save.totalStars>0){ctx.fillStyle='#39ff14';ctx.font='bold 7px Courier New';ctx.fillText('РЕКОРД: ★ '+save.totalStars,W/2,102);}
  const a=0.5+Math.sin(titleTime*0.09)*0.5;
  ctx.globalAlpha=a;ctx.fillStyle='#ffde59';ctx.font='bold 13px Courier New';
  ctx.fillText('TAP / SPACE — НАЧАТЬ',W/2,H-24);
  ctx.globalAlpha=1;
  ctx.save();ctx.globalAlpha=0.55;
  ctx.fillStyle='#0a0018';ctx.fillRect(6,H-20,130,14);
  ctx.strokeStyle='#ff2d95';ctx.lineWidth=1;ctx.strokeRect(6.5,H-19.5,129,13);
  ctx.fillStyle='#ff2d95';ctx.font='bold 7px Courier New';ctx.textAlign='center';
  ctx.fillText('↔ ОРИЕНТАЦИЯ',71,H-13);
  ctx.restore();
  drawCRT();
}
function drawTitleHero(){
  const cx=W/2,cy=H*0.86;
  const t=titleTime;
  const bob=Math.sin(t*0.06)*2;
  const armWave=Math.sin(t*0.13)*7;
  const tapCycle=t%70;
  let tapFootY=0;
  if(tapCycle<20){const p=tapCycle/20;tapFootY=-Math.sin(p*Math.PI)*4;}
  const starRot=t*0.14;const starBob=Math.sin(t*0.09)*1.5;const starPulse=1+Math.sin(t*0.18)*0.15;
  ctx.save();ctx.translate(cx,cy+bob);
  ctx.fillStyle='rgba(0,0,0,0.45)';ctx.beginPath();ctx.ellipse(0,3,38,6,0,0,7);ctx.fill();
  ctx.fillStyle='#0e0c1a';ctx.beginPath();ctx.moveTo(-30,0);ctx.lineTo(-30,-9);ctx.lineTo(-10,-9);ctx.lineTo(-6,0);ctx.closePath();ctx.fill();
  ctx.save();ctx.translate(0,tapFootY);
  ctx.beginPath();ctx.moveTo(30,0);ctx.lineTo(30,-9);ctx.lineTo(10,-9);ctx.lineTo(6,0);ctx.closePath();ctx.fill();
  ctx.fillStyle='#fff';ctx.fillRect(6,-2,24,2);
  ctx.fillStyle='#ff2d95';ctx.fillRect(7,-4,22,3);
  ctx.restore();
  ctx.fillStyle='#fff';ctx.fillRect(-30,-2,24,2);
  ctx.fillStyle='#ff2d95';ctx.fillRect(-29,-4,22,3);
  ctx.fillStyle='#0e0c1a';ctx.fillRect(-17,-36,10,27);ctx.fillRect(7,-36,10,27);
  ctx.strokeStyle='#0e0c1a';ctx.lineWidth=9;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-30,-58);ctx.lineTo(-48,-54);ctx.lineTo(-52,-36);ctx.stroke();
  ctx.beginPath();ctx.moveTo(30,-58);ctx.lineTo(48,-58);ctx.lineTo(54,-78+armWave);ctx.stroke();
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(-52,-36,7.5,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(54,-78+armWave,7.5,0,7);ctx.fill();
  ctx.save();ctx.translate(-52,-56+starBob);
  ctx.rotate(starRot);
  ctx.fillStyle='#ffde59';ctx.shadowColor='#ffde59';ctx.shadowBlur=12;
  ctx.beginPath();
  for(let i=0;i<10;i++){const rr=i%2===0?8*starPulse:3.5*starPulse;const aa=(i*Math.PI/5)-Math.PI/2;if(i===0)ctx.moveTo(Math.cos(aa)*rr,Math.sin(aa)*rr);else ctx.lineTo(Math.cos(aa)*rr,Math.sin(aa)*rr);}
  ctx.closePath();ctx.fill();ctx.shadowBlur=0;
  ctx.restore();
  ctx.fillStyle='#0a0818';ctx.fillRect(-34,-74,68,38);
  ctx.fillStyle='#1a1826';ctx.fillRect(-32,-72,64,34);
  ctx.fillStyle='#ff2d95';ctx.fillRect(-32,-70,64,11);
  ctx.fillStyle='#ffde59';ctx.fillRect(-28,-67,10,2);
  ctx.fillStyle='#00f0ff';ctx.fillRect(-28,-64,10,1.5);
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(24,-64,2.6,0,7);ctx.fill();
  ctx.fillStyle='#ff0000';ctx.beginPath();ctx.arc(24,-64,1.9,0,7);ctx.fill();
  ctx.fillStyle='#05040a';ctx.fillRect(-28,-57,56,18);
  ctx.fillStyle='#3a3a52';ctx.beginPath();ctx.arc(-14,-48,7,0,7);ctx.fill();ctx.beginPath();ctx.arc(14,-48,7,0,7);ctx.fill();
  ctx.fillStyle='#1a1a2a';ctx.beginPath();ctx.arc(-14,-48,4,0,7);ctx.fill();ctx.beginPath();ctx.arc(14,-48,4,0,7);ctx.fill();
  ctx.fillStyle='#00f0ff';ctx.beginPath();ctx.arc(-14,-48,1.8,0,7);ctx.fill();ctx.beginPath();ctx.arc(14,-48,1.8,0,7);ctx.fill();
  ctx.fillStyle='#050505';ctx.fillRect(-7,-68,14,4);
  ctx.beginPath();ctx.moveTo(-30,-71);ctx.lineTo(-7,-71);ctx.lineTo(-7,-58);ctx.lineTo(-25,-58);ctx.lineTo(-30,-62);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(7,-71);ctx.lineTo(30,-71);ctx.lineTo(25,-58);ctx.lineTo(7,-58);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(255,45,149,0.85)';ctx.fillRect(-28,-70,20,12);
  ctx.fillStyle='rgba(0,240,255,0.55)';ctx.fillRect(8,-70,20,12);
  ctx.strokeStyle='#ffde59';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(-5,-61);ctx.quadraticCurveTo(0,-59,5,-61);ctx.stroke();
  ctx.restore();
}
function drawDead(){
  ctx.fillStyle='rgba(5,0,13,0.85)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#ff2d95';ctx.font='bold 26px Courier New';ctx.fillText('TAPE JAMMED',W/2,H*0.4);
  ctx.fillStyle='rgba(255,255,255,0.75)';ctx.font='9px Courier New';
  ctx.fillText('ЛЕНТА ЗАЖЕВАЛАСЬ.',W/2,H*0.5);
  ctx.fillText('ПОПРОБУЙ ЕЩЁ РАЗ.',W/2,H*0.56);
  const a=0.5+Math.sin(time*0.1)*0.5;
  ctx.globalAlpha=a;ctx.fillStyle='#ffde59';ctx.font='bold 11px Courier New';
  ctx.fillText('TAP / SPACE — ПЕРЕМОТАТЬ',W/2,H*0.72);
  ctx.globalAlpha=1;
  drawCRT();
}
function drawWin(){
  ctx.fillStyle='rgba(5,0,13,0.85)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#00f0ff';ctx.font='bold 22px Courier New';ctx.fillText('WELCOME HOME',W/2,H*0.2);
  ctx.fillStyle='#ffde59';ctx.font='bold 12px Courier New';ctx.fillText('VHS ВЕРНУЛАСЬ В ПРОКАТ',W/2,H*0.3);
  ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='9px Courier New';
  ctx.fillText('ДРУЗЬЯ НА ПОЛКАХ ЖДАЛИ.',W/2,H*0.4);
  ctx.fillText('ВЕЧЕР ПЯТНИЦЫ СПАСЁН.',W/2,H*0.47);
  ctx.fillStyle='#ffde59';ctx.font='bold 10px Courier New';
  ctx.fillText('★ '+save.totalStars,W/2,H*0.56);
  ctx.fillStyle='#ff2d95';ctx.font='bold 11px Courier New';ctx.fillText('TAP / SPACE — В МЕНЮ',W/2,H*0.82);
  drawCRT();
}
function drawStory(){
  storyTimer++;
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#050010');g.addColorStop(0.5,'#180630');g.addColorStop(1,'#3a0a3a');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const page=STORY_PAGES[storyPage];
  const bw=W-40,bh=Math.min(H-80,200);
  const bx=20,by=(H-bh)/2;
  ctx.fillStyle='rgba(5,0,13,0.85)';roundRect(bx,by,bw,bh,10);ctx.fill();
  ctx.strokeStyle='#ff2d95';ctx.lineWidth=2;roundRect(bx,by,bw,bh,10);ctx.stroke();
  ctx.textAlign='center';ctx.textBaseline='top';
  ctx.fillStyle='#ffde59';ctx.font='bold 10px Courier New';ctx.fillText('ИСТОРИЯ ИГРЫ',W/2,by+10);
  const lines=page.lines;
  const lh=12;
  const startY=by+(bh-lines.length*lh)/2+8;
  for(let i=0;i<lines.length;i++){ctx.fillStyle='#e0e0f0';ctx.font='bold 9px Courier New';ctx.fillText(lines[i],W/2,startY+i*lh);}
  const pagesCount=STORY_PAGES.length;
  const dotsY=by+bh-14;
  const dotsStart=W/2-pagesCount*5+3;
  for(let i=0;i<pagesCount;i++){ctx.fillStyle=i===storyPage?'#ffde59':'rgba(255,255,255,0.3)';ctx.beginPath();ctx.arc(dotsStart+i*10,dotsY,2.5,0,7);ctx.fill();}
  ctx.fillStyle='#00f0ff';ctx.font='bold 8px Courier New';ctx.textAlign='center';
  ctx.fillText(storyPage<STORY_PAGES.length-1?'TAP / SPACE — ДАЛЬШЕ':'TAP / SPACE — К ВЫБОРУ ФОРМАТА',W/2,H-20);
  const sb=getStorySkipBtn();
  ctx.save();ctx.globalAlpha=0.7;ctx.fillStyle='rgba(10,0,24,0.85)';roundRect(sb.x,sb.y,sb.w,sb.h,4);ctx.fill();
  ctx.strokeStyle='#ff2d95';ctx.lineWidth=1;roundRect(sb.x,sb.y,sb.w,sb.h,4);ctx.stroke();
  ctx.fillStyle='#ff2d95';ctx.font='bold 7px Courier New';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('ПРОПУСТИТЬ',sb.x+sb.w/2,sb.y+sb.h/2);
  ctx.restore();
  drawCRT();
}
function renderWorld(){
  const skyGrad=drawSky();
  drawBgStars();
  drawSun(skyGrad);
  drawMountains();
  ctx.save();ctx.translate(0,-camY*0.08);drawCityLayer(farB,0.12,currentTheme==='park'?240:190,'#150a26','#ff9a3c');ctx.restore();
  ctx.save();ctx.translate(0,-camY*0.18);drawCityLayer(nearB,0.35,currentTheme==='park'?250:200,'#0d0619','#ffde59');drawNeonSigns();ctx.restore();
  drawRain();
  ctx.save();ctx.scale(ZOOM,ZOOM);
  drawDecorations();
  if(goalStore||currentLevelId==='shops')drawVhsStore();
  drawPlatforms();
  drawProps();
  drawMetroTrain();
  drawPickups();
  drawStars();
  drawBonus();
  drawAmbientParticles();
  drawDrips();
  drawEnemies();
  drawBoss();
  drawShots();
  drawEBullets();
  drawPlayer();
  drawParticles();
  ctx.restore();
}
function render(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,W,H);
  if(state==='title'){drawTitle();return;}
  if(state==='story'){drawStory();return;}
  if(state==='orient_select'){drawOrientationSelect();return;}
  if(state==='howto'){drawHowTo();return;}
  if(state==='map'){drawMap();return;}
  if(state==='paused'){renderWorld();drawPaused();return;}
  if(state==='arcade_select'){renderWorld();drawArcadeSelect();return;}
  if(state==='minigame'){mgDraw();return;}
  if(state==='arcade_win'){renderWorld();drawArcadeWin();return;}
  renderWorld();
  if(state==='play'||state==='finale'){drawHUD();drawVhsFrame();drawPauseBtn();}
  if(state==='play'||state==='finale')drawTouchControls();
  if(state==='finale')drawSpeechBubble();
  drawCRT();
  if(state==='dead')drawDead();
  if(state==='win')drawWin();
}
let last=performance.now(),acc=0;
function loop(now){
  const dt=Math.min(50,now-last);last=now;acc+=dt;
  const STEP=1000/60;let guard=0;
  while(acc>=STEP&&guard<4){update();acc-=STEP;guard++;}
  if(guard>=4)acc=0;
  render();
  requestAnimationFrame(loop);
}
setOrientation(orientation);
player={x:40,y:120,w:16,h:20,vx:0,vy:0,onGround:false,facing:1,tape:100,maxTape:100,shootCd:0,invuln:0,anim:0,wrapFx:0,dead:false,crouch:false,hasDoubleJumped:false};
requestAnimationFrame(loop);
